<!DOCTYPE html>
<html>
<head>
  <title>LFT Report</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #1a1a1a; color: #eee; }
    h1 { margin-bottom: 10px; }
    .meta { color: #888; font-size: 0.9em; margin: 10px 0 20px 0; }
    .phase { margin: 20px 0; padding: 15px; background: #2a2a2a; border-radius: 8px; display: inline-block; }
    .phase h2 { margin: 0 0 10px 0; font-size: 1.1em; }
    .metrics { font-family: monospace; font-size: 0.85em; background: #333; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    .pass { color: #4f4; }
    .fail { color: #f44; }
    .summary { font-size: 1.2em; padding: 12px 20px; border-radius: 8px; margin: 0; display: inline-block; }
    .summary.pass { background: #143; }
    .summary.fail { background: #411; }
    .errors { background: #411; padding: 15px; border-radius: 8px; margin: 20px 0; display: inline-block; }
    .errors pre { margin: 0; white-space: pre-wrap; }
    .animator { display: block; }
    .anim-display { position: relative; display: inline-block; }
    .anim-img { border: 1px solid #444; border-radius: 4px; display: block; }
    .anim-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 3px 6px; border-radius: 3px; font-family: monospace; font-size: 0.8em; }
    .anim-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .anim-controls button { background: #444; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
    .anim-controls button:hover { background: #555; }
    .anim-controls input[type=range] { flex: 1; }
    .frame-num { font-family: monospace; font-size: 0.85em; min-width: 50px; }
    .loading { color: #888; }
  </style>
</head>
<body>
  <div id="report">
    <p class="loading">Loading results...</p>
  </div>

  <script>
    const animStates = {};

    function getAnimData(id) {
      if (!animStates[id]) {
        const container = document.getElementById(id);
        const dataEl = container.querySelector('.anim-data');
        const frames = JSON.parse(dataEl.textContent);
        animStates[id] = { frames, index: 0, playing: false, interval: null };
      }
      return animStates[id];
    }

    function showFrame(id, index) {
      const state = getAnimData(id);
      const container = document.getElementById(id);
      const img = container.querySelector('.anim-img');
      const label = container.querySelector('.anim-label');
      const slider = container.querySelector('input[type=range]');
      const frameNum = container.querySelector('.frame-num');

      state.index = index;
      img.src = 'data:image/png;base64,' + state.frames[index].data;
      label.textContent = state.frames[index].label;
      slider.value = index;
      frameNum.textContent = (index + 1) + '/' + state.frames.length;
    }

    function toggleAnim(id) {
      const state = getAnimData(id);
      const container = document.getElementById(id);
      const btn = container.querySelector('button');

      if (state.playing) {
        clearInterval(state.interval);
        state.playing = false;
        btn.textContent = 'Play';
      } else {
        state.playing = true;
        btn.textContent = 'Pause';
        state.interval = setInterval(() => {
          const next = (state.index + 1) % state.frames.length;
          showFrame(id, next);
        }, 500);
      }
    }

    function seekAnim(id, index) {
      showFrame(id, parseInt(index));
    }

    function renderPhase(p, phaseIdx) {
      const hasMultiple = p.screenshots.length > 1;
      const animatorId = `animator-${phaseIdx}`;

      if (hasMultiple) {
        return `
          <div class="phase">
            <h2>${p.name}</h2>
            <div class="metrics">
              Duration: ${p.duration}ms |
              Flickers: <span class="${p.flickers > 0 ? 'fail' : 'pass'}">${p.flickers}</span>
              ${p.note ? `| ${p.note}` : ''}
            </div>
            <div class="animator" id="${animatorId}">
              <div class="anim-display">
                <img class="anim-img" src="data:image/png;base64,${p.screenshots[0].data}" alt="Frame">
                <div class="anim-label">${p.screenshots[0].label}</div>
              </div>
              <div class="anim-controls">
                <button onclick="toggleAnim('${animatorId}')">Play</button>
                <input type="range" min="0" max="${p.screenshots.length - 1}" value="0"
                       oninput="seekAnim('${animatorId}', this.value)">
                <span class="frame-num">1/${p.screenshots.length}</span>
              </div>
              <div class="anim-data" style="display:none">${JSON.stringify(p.screenshots.map(s => ({label: s.label, data: s.data})))}</div>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="phase">
            <h2>${p.name}</h2>
            <div class="metrics">
              Duration: ${p.duration}ms |
              Flickers: <span class="${p.flickers > 0 ? 'fail' : 'pass'}">${p.flickers}</span>
              ${p.note ? `| ${p.note}` : ''}
            </div>
            <div class="screenshots">
              ${p.screenshots.map(s => `
                <div class="shot">
                  <div class="label">${s.label}</div>
                  <img src="data:image/png;base64,${s.data}" alt="${s.label}">
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function renderReport(results) {
      const phaseHTML = results.phases.map((p, i) => renderPhase(p, i)).join('');

      const errorsHTML = results.errors.length > 0 ? `
        <div class="errors">
          <h3>Console Errors (${results.errors.length})</h3>
          <pre>${results.errors.join('\n')}</pre>
        </div>
      ` : '';

      return `
        <h1>LFT: Long-Form Test</h1>
        <div class="summary ${results.passed ? 'pass' : 'fail'}">
          ${results.passed ? 'PASSED' : 'FAILED'} - ${results.totalFlickers} flickers detected
        </div>
        <p class="meta">PDF: ${results.pdf} | Run: ${results.timestamp} | Total: ${results.totalDuration}ms</p>
        ${errorsHTML}
        ${phaseHTML}
      `;
    }

    // Fetch and render
    fetch('lft-results.json')
      .then(r => r.json())
      .then(results => {
        document.getElementById('report').innerHTML = renderReport(results);
        // Auto-play animations
        document.querySelectorAll('.animator').forEach(el => {
          toggleAnim(el.id);
        });
      })
      .catch(err => {
        document.getElementById('report').innerHTML = `<p class="fail">Error loading results: ${err.message}</p>`;
      });
  </script>
</body>
</html>
