<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Grid Viewer v1.2.8</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const PDFGridViewer = () => {
          const [pdfFile, setPdfFile] = useState(null);
          const [numPages, setNumPages] = useState(0);
          const [isLoading, setIsLoading] = useState(false);
          const [loadingStatus, setLoadingStatus] = useState('');
          const [pagesLoaded, setPagesLoaded] = useState(0);
          const [tileRevision, setTileRevision] = useState(0);
          const viewerRef = useRef(null);
          const osdViewerRef = useRef(null);
          const pageCanvasesRef = useRef([]); // Store individual page canvases
          const pdfDocRef = useRef(null); // Store PDF document
          const tileCacheRef = useRef(null); // Store tile cache reference
          const tileSourceConfigRef = useRef(null); // Store tile source config
          
          // When tileRevision changes, recreate the tile source
          useEffect(() => {
            if (tileRevision > 0 && osdViewerRef.current && tileSourceConfigRef.current) {
              console.log(`Tile revision changed to ${tileRevision}, recreating tile source...`);
              
              // Save current viewport state
              const viewer = osdViewerRef.current;
              const currentBounds = viewer.viewport.getBounds();
              const currentZoom = viewer.viewport.getZoom();
              
              // Remove old tiledImage
              const world = viewer.world;
              if (world.getItemCount() > 0) {
                world.removeAll();
              }
              
              // Clear tile cache
              if (tileCacheRef.current) {
                tileCacheRef.current.clear();
              }
              
              // Add new tiledImage with same config (will call getTileUrl with fresh page data)
              viewer.addTiledImage({
                tileSource: tileSourceConfigRef.current,
                success: function() {
                  console.log(`  Tile source recreated successfully`);
                  
                  // Restore viewport position
                  viewer.viewport.fitBounds(currentBounds, true);
                }
              });
            }
          }, [tileRevision]);

          // Set up PDF.js worker
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

          // Generate the rotating grid pattern
          const generateGridPattern = (totalPages, cols) => {
            const pattern = [];
            const rows = totalPages; // For N pages, we want N rows to make N×N grid
            
            for (let row = 0; row < rows; row++) {
              const rowPages = [];
              for (let col = 0; col < cols; col++) {
                // Rotating pattern: each row starts at (row) offset from page 1
                const pageIndex = ((row + col) % totalPages);
                rowPages.push(pageIndex + 1); // Pages are 1-indexed for display
              }
              pattern.push(rowPages);
            }
            
            return pattern;
          };

          const handleFileUpload = async (event) => {
            const file = event.target.files[0];
            if (!file || file.type !== 'application/pdf') {
              alert('Please upload a PDF file');
              return;
            }

            setIsLoading(true);
            setLoadingStatus('Loading PDF...');
            setPdfFile(file);

            try {
              const arrayBuffer = await file.arrayBuffer();
              const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
              setNumPages(pdf.numPages);
              pdfDocRef.current = pdf;

              console.log(`[v1.2.8] Loaded PDF with ${pdf.numPages} pages`);
              
              // Render ONLY the first page initially
              setLoadingStatus('Rendering first page...');
              const firstPageCanvas = await renderPage(pdf, 1);
              pageCanvasesRef.current = [firstPageCanvas];
              setPagesLoaded(1);
              
              const pageWidth = firstPageCanvas.width;
              const pageHeight = firstPageCanvas.height;
              
              console.log(`First page rendered: ${pageWidth}x${pageHeight}`);
              
              // Initialize viewer immediately with just first page
              setLoadingStatus('');
              setIsLoading(false);
              initializeViewer(pdf.numPages, pageWidth, pageHeight);
              
              // Render remaining pages in background
              renderRemainingPages(pdf, pageWidth, pageHeight);
              
            } catch (error) {
              console.error('Error loading PDF:', error);
              alert('Error loading PDF: ' + error.message);
              setIsLoading(false);
            }
          };

          // Render remaining pages in background
          const renderRemainingPages = async (pdf, pageWidth, pageHeight) => {
            console.log('Starting background page rendering...');
            
            for (let i = 2; i <= pdf.numPages; i++) {
              const pageCanvas = await renderPage(pdf, i);
              pageCanvasesRef.current.push(pageCanvas);
              setPagesLoaded(i);
              
              // Every 3 pages, increment tile revision to force cache bust
              if (i % 3 === 0 || i === pdf.numPages) {
                console.log(`Incrementing tile revision after loading page ${i}...`);
                setTileRevision(prev => prev + 1);
              }
              
              // Log progress every 10 pages
              if (i % 10 === 0) {
                console.log(`Rendered ${i}/${pdf.numPages} pages`);
              }
              
              // Yield to browser occasionally
              if (i % 5 === 0) {
                await new Promise(resolve => setTimeout(resolve, 0));
              }
            }
            
            console.log(`All ${pdf.numPages} pages rendered!`);
          };

          // Render a single PDF page to canvas
          const renderPage = async (pdf, pageNum) => {
            const page = await pdf.getPage(pageNum);
            const scale = 2.0;
            const viewport = page.getViewport({ scale });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({
              canvasContext: context,
              viewport: viewport
            }).promise;
            
            return canvas;
          };

          const initializeViewer = (numPages, pageWidth, pageHeight) => {
            // Clean up existing viewer
            if (osdViewerRef.current) {
              osdViewerRef.current.destroy();
            }

            const viewerElement = document.getElementById('openseadragon-viewer');
            if (!viewerElement) {
              console.error('Viewer element not found');
              return;
            }

            const gridSize = numPages;
            const pattern = generateGridPattern(numPages, gridSize);
            const spacing = Math.floor(pageWidth * 0.05);

            // Calculate total grid dimensions
            const totalWidth = gridSize * pageWidth + (gridSize - 1) * spacing;
            const totalHeight = gridSize * pageHeight + (gridSize - 1) * spacing;
            
            console.log(`Page: ${pageWidth}x${pageHeight}, Spacing: ${spacing}`);
            console.log(`Grid: ${gridSize}×${gridSize}, Total: ${totalWidth}x${totalHeight}`);
            console.log(`Full pattern:`, pattern);
            
            // Debug: Print out where each page SHOULD appear
            console.log('Expected page positions in grid:');
            for (let row = 0; row < Math.min(3, gridSize); row++) {
              for (let col = 0; col < Math.min(3, gridSize); col++) {
                const pageNum = pattern[row][col];
                const px = col * (pageWidth + spacing);
                const py = row * (pageHeight + spacing);
                console.log(`  Page ${pageNum} at grid(${row},${col}): pixel position (${px}, ${py})`);
              }
            }
            
            // Use tile size at least as large as a page
            const tileSize = Math.max(512, Math.ceil(Math.max(pageWidth, pageHeight) / 256) * 256);
            const maxDimension = Math.max(totalWidth, totalHeight);
            const maxLevel = Math.ceil(Math.log2(maxDimension / tileSize));
            
            console.log(`Grid: ${gridSize}×${gridSize}, Total: ${totalWidth}x${totalHeight}`);
            console.log(`Tile size: ${tileSize}, Max level: ${maxLevel}`);
            
            // Tile cache
            const tileCache = new Map();
            tileCacheRef.current = tileCache;
            const maxCacheSize = 300;
            
            // Create reusable tile canvas
            const tileCanvas = document.createElement('canvas');
            tileCanvas.width = tileSize;
            tileCanvas.height = tileSize;
            const tileCtx = tileCanvas.getContext('2d', { alpha: false });
            
            // Custom tile source that generates tiles from page canvases
            const customTileSource = {
              height: totalHeight,
              width: totalWidth,
              tileSize: tileSize,
              minLevel: 0,
              maxLevel: maxLevel,
              getTileUrl: function(level, x, y) {
                const key = `${level}_${x}_${y}`;
                
                // Check cache
                if (tileCache.has(key)) {
                  const cached = tileCache.get(key);
                  // Move to end (LRU)
                  tileCache.delete(key);
                  tileCache.set(key, cached);
                  return cached;
                }
                
                // Generate tile from page canvases
                const scale = Math.pow(2, level - maxLevel);
                
                // Calculate tile boundaries in full-resolution grid coordinates
                const tileLeft = x * tileSize / scale;
                const tileTop = y * tileSize / scale;
                const tileRight = Math.min(tileLeft + tileSize / scale, totalWidth);
                const tileBottom = Math.min(tileTop + tileSize / scale, totalHeight);
                
                // Debug: log first few tiles with DETAILS
                if (tileCache.size < 3) {
                  console.log(`\nGenerating tile ${key}:`);
                  console.log(`  Tile bounds: (${tileLeft.toFixed(0)}, ${tileTop.toFixed(0)}) to (${tileRight.toFixed(0)}, ${tileBottom.toFixed(0)})`);
                  console.log(`  Scale: ${scale.toFixed(4)}, Level: ${level}`);
                }
                
                // Clear tile
                tileCtx.fillStyle = '#1f2937';
                tileCtx.fillRect(0, 0, tileSize, tileSize);
                
                let pagesDrawn = 0;
                
                // Draw portions of pages that intersect this tile
                for (let row = 0; row < gridSize; row++) {
                  for (let col = 0; col < gridSize; col++) {
                    // Calculate this page's position in the grid
                    const pageLeft = col * (pageWidth + spacing);
                    const pageTop = row * (pageHeight + spacing);
                    const pageRight = pageLeft + pageWidth;
                    const pageBottom = pageTop + pageHeight;
                    
                    // Check if this page intersects the tile (use <= to catch boundaries)
                    if (pageRight <= tileLeft || pageLeft >= tileRight ||
                        pageBottom <= tileTop || pageTop >= tileBottom) {
                      continue; // No intersection
                    }
                    
                    // Get the page number at this grid position
                    const pageNum = pattern[row][col];
                    const pageCanvas = pageCanvasesRef.current[pageNum - 1];
                    
                    if (tileCache.size < 3) {
                      console.log(`  Grid(${row},${col}): Page ${pageNum} at (${pageLeft.toFixed(0)},${pageTop.toFixed(0)}) intersects tile - ${pageCanvas ? 'LOADED' : 'not loaded'}`);
                    }
                    
                    if (!pageCanvas) {
                      continue; // Page not rendered yet
                    }
                    
                    // Calculate intersection
                    const intersectLeft = Math.max(tileLeft, pageLeft);
                    const intersectTop = Math.max(tileTop, pageTop);
                    const intersectRight = Math.min(tileRight, pageRight);
                    const intersectBottom = Math.min(tileBottom, pageBottom);
                    
                    // Source coordinates (within the page)
                    const srcX = intersectLeft - pageLeft;
                    const srcY = intersectTop - pageTop;
                    const srcW = intersectRight - intersectLeft;
                    const srcH = intersectBottom - intersectTop;
                    
                    // Destination coordinates (within the tile)
                    const destX = (intersectLeft - tileLeft) * scale;
                    const destY = (intersectTop - tileTop) * scale;
                    const destW = srcW * scale;
                    const destH = srcH * scale;
                    
                    // Draw this portion
                    tileCtx.drawImage(
                      pageCanvas,
                      srcX, srcY, srcW, srcH,
                      destX, destY, destW, destH
                    );
                    
                    pagesDrawn++;
                  }
                }
                
                if (tileCache.size < 5) {
                  console.log(`  Drew ${pagesDrawn} page(s) in tile ${key}`);
                }
                
                // Convert to data URL
                const tileUrl = tileCanvas.toDataURL('image/jpeg', 0.85);
                
                // Cache with LRU eviction
                tileCache.set(key, tileUrl);
                if (tileCache.size > maxCacheSize) {
                  const firstKey = tileCache.keys().next().value;
                  tileCache.delete(firstKey);
                }
                
                return tileUrl;
              }
            };
            
            // Store tile source config for recreation when pages load
            tileSourceConfigRef.current = customTileSource;
            
            // Initialize OpenSeadragon
            const viewer = OpenSeadragon({
              id: 'openseadragon-viewer',
              prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/',
              tileSources: customTileSource,
              showNavigator: true,
              navigatorPosition: 'BOTTOM_RIGHT',
              showRotationControl: true,
              minZoomLevel: 0.1,
              maxZoomLevel: 10,
              visibilityRatio: 0.2,
              constrainDuringPan: false,
              homeFillsViewer: true,
              immediateRender: true,
              preload: true,
              defaultZoomLevel: 1
            });
            
            // Set initial view to center on first page (top-left corner at 0,0)
            viewer.addHandler('open', function() {
              // Calculate the bounds for just the first page
              const bounds = new OpenSeadragon.Rect(0, 0, pageWidth, pageHeight);
              
              // Convert image coordinates to viewport coordinates
              const viewportBounds = viewer.viewport.imageToViewportRectangle(bounds);
              
              // Fit the viewport to show just page 1
              viewer.viewport.fitBounds(viewportBounds, true);
            });
            
            osdViewerRef.current = viewer;
          };

          return (
            <div className="w-full h-screen bg-gray-900 flex flex-col">
              {/* Header */}
              <div className="bg-gray-800 border-b border-gray-700 p-4">
                <div className="flex items-center justify-between max-w-7xl mx-auto">
                  <h1 className="text-2xl font-bold text-white">PDF Grid Viewer v1.2.8</h1>
                  
                  <label className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded cursor-pointer transition-colors">
                    {pdfFile ? 'Load Different PDF' : 'Upload PDF'}
                    <input
                      type="file"
                      accept="application/pdf"
                      onChange={handleFileUpload}
                      className="hidden"
                    />
                  </label>
                </div>
                
                {numPages > 0 && (
                  <div className="mt-2 text-sm text-gray-400 max-w-7xl mx-auto">
                    {numPages} pages • Grid size: {numPages}×{numPages}
                    {pagesLoaded < numPages && 
                      ` • Loaded ${pagesLoaded}/${numPages} pages`
                    }
                  </div>
                )}
              </div>

              {/* Viewer Area */}
              <div className="flex-1 relative">
                {!pdfFile ? (
                  <div className="absolute inset-0 flex items-center justify-center">
                    <div className="text-center text-gray-400">
                      <svg className="w-24 h-24 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                      </svg>
                      <p className="text-lg">Upload a PDF to get started</p>
                      <p className="text-sm mt-2">Pages will appear in a rotating grid pattern</p>
                    </div>
                  </div>
                ) : null}
                
                {isLoading && (
                  <div className="absolute inset-0 flex items-center justify-center bg-gray-900 z-10">
                    <div className="text-center">
                      <div className="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-600 border-t-blue-500 mb-4"></div>
                      <p className="text-white">{loadingStatus}</p>
                    </div>
                  </div>
                )}
                
                <div
                  id="openseadragon-viewer"
                  ref={viewerRef}
                  className="w-full h-full"
                  style={{ display: pdfFile ? 'block' : 'none' }}
                />
              </div>

              {/* Instructions */}
              {pdfFile && !isLoading && (
                <div className="bg-gray-800 border-t border-gray-700 p-3">
                  <div className="max-w-7xl mx-auto text-sm text-gray-400 flex gap-6">
                    <span>🖱️ Drag to pan</span>
                    <span>🔍 Scroll to zoom</span>
                    <span>🏠 Double-click to reset view</span>
                  </div>
                </div>
              )}
            </div>
          );
        };

        ReactDOM.render(<PDFGridViewer />, document.getElementById('root'));
    </script>
</body>
</html>
