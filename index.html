          _identifyRequiredTiles(level) {
            return this.qualityInspector._identifyRequiredTiles(level);
          }

          /**
           * Get lastDrawn analysis - feed-forward and feed-back signals
           */
          getLastDrawnAnalysis() {
            return this.qualityInspector.getLastDrawnAnalysis();
          }

          /**
           * Get priority pages based on what OSD is actually drawing
           */
          getDrawnPriorityPages() {
            return this.qualityInspector.getDrawnPriorityPages();
          }

          /**
           * Render tile content
           */

          /**
           * Phase 2.1: Delegate to TileGenerator module
           */
          _renderTile(level, x, y, scale, key, neededPages, resolution, tileLeft, tileTop, tileRight, tileBottom) {
            return this.tileGenerator._renderTile(level, x, y, scale, key, neededPages, resolution, tileLeft, tileTop, tileRight, tileBottom);
          }

          /**
           * Phase 2.1: Delegate to TileGenerator module
           */
          _drawPageIntersection(row, col, tileLeft, tileTop, tileRight, tileBottom, scale, debugKey, resolution, level) {
            return this.tileGenerator._drawPageIntersection(row, col, tileLeft, tileTop, tileRight, tileBottom, scale, debugKey, resolution, level);
          }
        }

        // ╔══════════════════════════════════════════════════════════════════════════╗
        // ║                      OPENSEADRAGON MANAGER MODULE                        ║
        // ╚══════════════════════════════════════════════════════════════════════════╝

        /**
         * OSDManager: OpenSeadragon viewer initialization and configuration
         * Extracted from TileStreamer in Phase 4 modularization
         * Handles device detection and viewer setup
         */
        const OSDManager = {
          isTouchDevice() {
            // Check multiple signals for touch devices
            const hasCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
            const hasNoHover = window.matchMedia('(hover: none)').matches;
            const hasTouchEvents = 'ontouchstart' in window;

            // If not a touch device at all, show navigator
            const isTouchCapable = hasCoarsePointer || hasNoHover || (hasTouchEvents && !window.matchMedia('(pointer: fine)').matches);
            if (!isTouchCapable) {
              return false;
            }

            // It's touch-capable, but is it a small phone or a tablet/iPad?
            // Calculate approximate physical width in inches
            const devicePixelRatio = window.devicePixelRatio || 1;
            const physicalWidth = window.screen.width / devicePixelRatio;
            const physicalHeight = window.screen.height / devicePixelRatio;

            // Assume ~160 DPI for rough physical size calculation
            // (Most phones are 326-460 DPI, tablets are 220-264 DPI)
            const minDimension = Math.min(physicalWidth, physicalHeight);

            // Hide navigator only on small screens (< 600 CSS pixels in portrait)
            // This catches phones but not iPads/tablets (typically 768px+)
            return minDimension < 600;
          },

          /**
           * Initialize OpenSeadragon viewer
           * @param {boolean} forceShowNavigator - If true, show navigator immediately; if undefined, auto-detect based on device
           */
          initialize(tileStreamer, pageWidth, pageHeight, gridSize, forceShowNavigator = undefined) {
            // Set fixed minZoomImageRatio - grid should fill ~90% of viewport when fully zoomed out
            const minZoomImageRatio = 0.9;

            // Detect small phone and hide navigator on mobile
            const isSmallPhone = this.isTouchDevice();
            const shouldShowNavigator = !isSmallPhone;
            window.osdShowNavigator = shouldShowNavigator; // Store for later use

            // Use forceShowNavigator parameter if provided, otherwise use device detection
            const showNavigator = forceShowNavigator !== undefined ? forceShowNavigator : shouldShowNavigator;

            // Adjust maxZoomPixelRatio for high DPI displays (Retina, etc.)
            // This ensures same zoom depth regardless of screen pixel density
            const devicePixelRatio = window.devicePixelRatio || 1;

            if (CONFIG.VERBOSE_LOGGING) {
              console.log(`Grid size: ${gridSize}×${gridSize}, minZoomImageRatio: ${minZoomImageRatio.toFixed(3)}`);
              console.log(`Small phone: ${isSmallPhone}, Navigator: ${showNavigator ? 'enabled' : 'deferred/hidden'}`);
              console.log(`Device pixel ratio: ${devicePixelRatio}`);
            }

            const viewerConfig = {
              id: 'openseadragon-viewer',
              prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/',
              tileSources: tileStreamer.getOSDConfig(),
              debugMode: CONFIG.DEBUG_MODE, // Show tile borders and labels
              showNavigator: showNavigator, // Always show if not mobile
              navigatorPosition: 'TOP_RIGHT',
              showRotationControl: false, // Hide rotation buttons
              showZoomControl: false, // Hide zoom in/out buttons
              showHomeControl: true, // Keep home button
              showFullPageControl: true, // Keep fullscreen button
              maxZoomLevel: null, // Remove max zoom level constraint
              maxZoomPixelRatio: Infinity, // Remove pixel ratio constraint - allow unlimited zoom
              minZoomImageRatio: minZoomImageRatio, // Dynamically calculated based on grid size
              visibilityRatio: CONFIG.OSD_VISIBILITY_RATIO,
              constrainDuringPan: false, // Allow panning beyond bounds when zoomed in
              homeFillsViewer: false,
              immediateRender: true, // true = render best level first (faster perceived load)
              preload: true,
              maxImageCacheCount: CONFIG.OSD_MAX_IMAGE_CACHE, // 0 = disabled to prevent stale tiles after healing
              zoomPerScroll: 1.5, // Increase scroll wheel sensitivity (default: 1.2)
              // Ensure touch gestures have same zoom limits as desktop
              gestureSettingsMouse: {
                clickToZoom: false,
                dblClickToZoom: true
              },
              gestureSettingsTouch: {
                pinchToZoom: true,
                flickEnabled: true,
                flickMinSpeed: 0.5,
                flickMomentum: 0.25
              },
              // Reduce sub-pixel rounding artifacts between tiles
              // See: https://github.com/openseadragon/openseadragon/issues/2515
              subPixelRoundingForTransparency: 2
            };

            // Only set minZoomLevel if specified
            if (CONFIG.OSD_MIN_ZOOM !== null) {
              viewerConfig.minZoomLevel = CONFIG.OSD_MIN_ZOOM;
            }

            const viewer = OpenSeadragon(viewerConfig);

            // Expose viewer globally for automated testing
            window.viewer = viewer;

            // Set initial view (switchable via DEBUG_INITIAL_VIEW_WHOLE_GRID)
            viewer.addHandler('open', function() {
              // Workaround for sub-pixel gaps with PNG tiles
              // Tell OSD our tiles don't have transparency to avoid transparency rendering artifacts
              // See: https://github.com/openseadragon/openseadragon/issues/2515
              viewer.world.getItemAt(0).source.hasTransparency = () => false;

              // Signal viewer is fully initialized and ready for testing
              window.viewerReady = true;

              // Apply persisted tile borders setting from localStorage (only if debug panel visible)
              const urlParams = new URLSearchParams(window.location.search);
              const isDebugVisible = urlParams.has('debug') && urlParams.get('debug') !== 'false' && urlParams.get('debug') !== '0';
              if (isDebugVisible) {
                const persistedTileBorders = localStorage.getItem('pdfgrid_tile_borders');
                if (viewer.setDebugMode && persistedTileBorders) {
                  viewer.setDebugMode(JSON.parse(persistedTileBorders));
                }
              }

              // Try to restore saved viewport first (if same file as last session)
              const savedViewport = ViewportManager.load(window.currentPdfFilename);

              if (savedViewport) {
                // Restore saved viewport
                viewer.viewport.zoomTo(savedViewport.zoom, savedViewport.center, true);
                viewer.viewport.panTo(savedViewport.center, true);
              } else if (CONFIG.DEBUG_INITIAL_VIEW_WHOLE_GRID) {
                // Debug mode: Show the entire grid at once (fills ~90% of viewport per minZoomImageRatio)
                viewer.viewport.goHome(true);
              } else {
                // Normal mode: Center on page 1 at top
                // In staggered grid, page 1 is at row 0, column halfN (centered)
                const spacing = Math.floor(pageWidth * CONFIG.GRID_SPACING_RATIO);
                const halfN = Math.floor(gridSize / 2);
                const page1Col = halfN;
                const page1Row = 0;

                // Calculate page 1 position in pixel coordinates
                const page1X = page1Col * (pageWidth + spacing);
                const page1Y = page1Row * (pageHeight + spacing);

                // Center on page 1, showing slightly more than one page (1.5x)
                const viewWidth = pageWidth * 1.5;
                const viewHeight = pageHeight * 1.5;
                const viewX = page1X - (viewWidth - pageWidth) / 2;
                const viewY = page1Y - (viewHeight - pageHeight) / 2;

                const viewportRect = viewer.viewport.imageToViewportRectangle(
                  viewX, viewY, viewWidth, viewHeight
                );
                viewer.viewport.fitBounds(viewportRect, true);
              }

              // Save viewport when user pans or zooms (debounced)
              viewer.addHandler('zoom', () => {
                ViewportManager.saveDebounced(viewer.viewport, window.currentPdfFilename);
              });

              viewer.addHandler('pan', () => {
                ViewportManager.saveDebounced(viewer.viewport, window.currentPdfFilename);
              });
            });

            // Track when initial tiles are fully loaded (for automated testing)
            // Use fully-loaded-change event to detect when all initial tiles finish loading
            let initialTilesLoaded = false;
            viewer.addHandler('fully-loaded-change', function(event) {
              if (event.fullyLoaded && !initialTilesLoaded) {
                initialTilesLoaded = true;
                // Give OSD a moment to finish drawing to canvas before signaling ready
                setTimeout(() => {
                  window.tilesFullyLoaded = true;
                  console.log('[OSD] Initial tiles fully loaded and rendered');
                }, 100);
              }
            });

            return viewer;
          }
        };

        // ╔══════════════════════════════════════════════════════════════════════════╗
        // ║                           ERROR BOUNDARY                                 ║
        // ╚══════════════════════════════════════════════════════════════════════════╝

        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null, errorInfo: null };
          }

          static getDerivedStateFromError(error) {
            return { hasError: true };
          }

          componentDidCatch(error, errorInfo) {
            console.error('Error caught by boundary:', error, errorInfo);
            this.state = { hasError: true, error, errorInfo };
          }

          render() {
            if (this.state.hasError) {
              return (
                <div className="w-full h-full bg-gray-900 flex items-center justify-center p-4">
                  <div className="max-w-2xl bg-gray-800 border border-red-500 rounded-lg p-6">
                    <h1 className="text-2xl font-bold text-red-500 mb-4">Something went wrong</h1>
                    <p className="text-gray-300 mb-4">
                      The application encountered an unexpected error. Please refresh the page to try again.
                    </p>
                    {CONFIG.DEBUG_MODE && this.state.error && (
                      <details className="mt-4">
                        <summary className="cursor-pointer text-gray-400 hover:text-white mb-2">
                          Error Details (Debug Mode)
                        </summary>
                        <pre className="bg-gray-900 p-4 rounded overflow-auto text-xs text-red-400 max-h-64">
                          {this.state.error.toString()}
                          {this.state.errorInfo && this.state.errorInfo.componentStack}
                        </pre>
                      </details>
                    )}
                    <button
                      onClick={() => window.location.reload()}
                      className="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded transition-colors"
                    >
                      Refresh Page
                    </button>
                  </div>
                </div>
              );
            }

            return this.props.children;
          }
        }

        // ╔══════════════════════════════════════════════════════════════════════════╗
        // ║                          CUSTOM REACT HOOKS                              ║
        // ╚══════════════════════════════════════════════════════════════════════════╝

        // Hook for localStorage-persisted state with type support
        const usePersistedState = (key, defaultValue, type = 'json') => {
          const fullKey = `pdfgrid_${key}`;
          const [value, setValue] = useState(() => {
            const stored = localStorage.getItem(fullKey);
            if (stored === null) return defaultValue;
            if (type === 'json') return JSON.parse(stored);
            if (type === 'int') return parseInt(stored);
            return stored; // string type
          });

          // Persist to localStorage on change
          useEffect(() => {
            if (type === 'json') {
              localStorage.setItem(fullKey, JSON.stringify(value));
            } else {
              localStorage.setItem(fullKey, value.toString());
            }
          }, [value, fullKey, type]);

          return [value, setValue];
        };

        // Hook for debug-only localStorage state (only loads if debug panel visible)
        const useDebugPersistedState = (key, defaultValue, isDebugVisible) => {
          const fullKey = `pdfgrid_${key}`;
          const [value, setValue] = useState(() => {
            if (!isDebugVisible) return defaultValue;
            const stored = localStorage.getItem(fullKey);
            return stored ? JSON.parse(stored) : defaultValue;
          });

          useEffect(() => {
            if (isDebugVisible) {
              localStorage.setItem(fullKey, JSON.stringify(value));
            }
          }, [value, fullKey, isDebugVisible]);

          return [value, setValue];
        };

        // ╔══════════════════════════════════════════════════════════════════════════╗
        // ║                            MAIN COMPONENT                                ║
        // ╚══════════════════════════════════════════════════════════════════════════╝

        const PDFGridViewer = () => {
          const [pdfFile, setPdfFile] = useState(null);
          const [numPages, setNumPages] = useState(0);
          const [isLoading, setIsLoading] = useState(false);
          const [loadingStatus, setLoadingStatus] = useState('');
          const [pagesLoaded, setPagesLoaded] = useState(0);
          const [urlInput, setUrlInput] = useState('');
          const [showHelp, setShowHelp] = useState(false);

          // Check for ?debug URL parameter
          const isDebugMode = React.useMemo(() => {

          const loadPDF = async (pdf, filename = 'PDF', suppressAlerts = false) => {
            try {

              // 0. Cancel all background rendering timers
              if (backgroundTimersRef.current && backgroundTimersRef.current.length > 0) {

                backgroundTimersRef.current.forEach(timer => clearTimeout(timer));

              }

              // 1. Destroy old OpenSeadragon viewer
              if (osdViewerRef.current) {
                if (CONFIG.VERBOSE_LOGGING) console.log('[Memory] Destroying old OpenSeadragon viewer');

                  if (osdViewerRef.current.removeAllHandlers) {

              window.__parallelRenderStats = null;
              window.__L0TileGeneration = null;
              window.__tileDebugLog = null;
              window.__L0OnDemandTracking = null;
              window.__L0OnDemandSkipped = null;
              window.__drawPageDebug = null;
              window.__tileCacheDebug = null;

              // Clean up grid dimension globals
              window.gridPageWidth = null;
              window.gridPageHeight = null;
              window.gridSize = null;

              // Clean up function references (closures)
              window.osdShowNavigator = null;

              // Force a delay to allow cleanup to propagate and GC to run before allocating new memory
              // This helps the browser's garbage collector identify and collect unreferenced objects
              // Increased from 50ms to 500ms to give GC more time for large PDFs
              if (CONFIG.VERBOSE_LOGGING) console.log('[Memory] Waiting 500ms for garbage collection...');
              await new Promise(resolve => setTimeout(resolve, 500));

              // Now set up new PDF
              setNumPages(pdf.numPages);
              pdfDocRef.current = pdf;
              window.pdfDoc = pdf; // Expose globally for testing/debugging
              setCurrentFilename(filename);

              // Update page title - extract filename from URL if needed
              const displayName = filename.startsWith('http://') || filename.startsWith('https://')
                ? decodeURIComponent(filename.split('/').pop() || 'PDF')
                : filename;
              document.title = `${displayName} - PDF Grid Viewer`;

              pageStreamer.updateCacheSizes(pdf.numPages, isIOSSafari);

              const actualLowResCapacity = pageStreamer.lowResPageCache.maxSize;
              const actualHighResCapacity = pageStreamer.highResPageCache.maxSize;
              setLowResPageCacheSize(actualLowResCapacity);
              setHighResPageCacheSize(actualHighResCapacity);

              if (CONFIG.VERBOSE_LOGGING) {
                console.log(`[Cache Control] Auto-calculated cache sizes: lowRes=${actualLowResCapacity}, highRes=${actualHighResCapacity}`);
              }

              // Get modal (most common) page dimensions by sampling multiple pages
              // This handles PDFs with mixed page sizes (e.g., cover page, landscape pages)
              const modalDims = await getModalPageDimensions(pdf, CONFIG.PDF_RENDER_SCALE);
              const pageWidth = modalDims.width;
              const pageHeight = modalDims.height;

              if (CONFIG.VERBOSE_LOGGING) {
                console.log(`[Init] Page dimensions: ${pageWidth}×${pageHeight} (modal of ${modalDims.samples} samples, ${modalDims.unique} unique sizes)`);
              }

              // Initialize viewer immediately (user can interact right away!)
              setLoadingStatus('Initializing viewer...');

              // CRITICAL: Clear tile cache before initializing viewer
              // When Phase 3 is skipped (large PDFs), some pages may still be rendering
              // Tiles generated during this window will have black/missing pages
              // Clearing ensures viewer starts fresh and all tiles use completed pages
              if (window.tileStreamerRef) {
                const tileCount = window.tileStreamerRef.tileCache.size;
                if (tileCount > 0) {
                  window.tileStreamerRef.tileCache.clear();
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Init] Cleared ${tileCount} pre-initialization tiles to prevent black pages`);
                  }
                }
              }

              // Check for ?nav URL parameter to force navigator visibility
              const navParams = new URLSearchParams(window.location.search);
              const forceNav = navParams.has('nav') && navParams.get('nav') !== 'false' && navParams.get('nav') !== '0';

              // Initialize viewer (navigator auto-hidden on touch devices unless ?nav)
              initializeViewer(pdf.numPages, pageWidth, pageHeight, forceNav || undefined, filename);

              // Background: Render remaining low-res pages, then add navigator when ready
              setTimeout(async () => {

                // VIEWPORT-AWARE RENDERING: Order pages by proximity to current view
                // This ensures visible pages render first, not sequential 1, 2, 3...
                const viewportOrderedPages = calculateViewportPriority(

                const remainingPages = viewportOrderedPages.filter(

                const availableSlots = cacheLowSize - currentlyCached;
                const pagesToRender = remainingPages.slice(0, availableSlots);
                const pagesDeferred = remainingPages.length - pagesToRender.length;

                    align-items: center;

                    flex-direction: column;
                    gap: 8px;
                    z-index: 1000;
                    font-size: 12px;
                    color: white;
