                    }
                    break;
                  }
                }
              }
            }

            if (invalidated > 0 && CONFIG.VERBOSE_LOGGING) {
              console.log(`[TileStreamer] Invalidated ${invalidated} tiles after rendering pages: ${pageNums.join(',')}`);
            }
          }

          /**
           * Render tile content
           */
          _renderTile(level, x, y, scale, key, neededPages, resolution, tileLeft, tileTop, tileRight, tileBottom) {
            const { totalWidth, totalHeight, pageWidth, pageHeight, spacing, gridRows, gridCols } = this.gridDims;

            // Track L0 tile rendering for diagnostics
            if (level === 0) {
              if (!window.__L0TileGeneration) window.__L0TileGeneration = { calls: [], renders: [] };
              if (!window.__L0TileGeneration.renders) window.__L0TileGeneration.renders = [];
              window.__L0TileGeneration.renders.push({
                time: Date.now(),
                key,
                neededPages: [...neededPages],
                resolution
              });
            }

            // Tile boundaries (extended with overlap) in grid coordinates

            // Configure interpolation based on zoom level
            if (level < CONFIG.IMAGE_SMOOTHING_THRESHOLD_LEVEL) {
              // Low zoom (minimap): use smoothing
              this.tileCtx.imageSmoothingEnabled = CONFIG.IMAGE_SMOOTHING_LOW_ZOOM;
            } else {
              // High zoom (deep zoom): disable smoothing for crisp pixels
              this.tileCtx.imageSmoothingEnabled = CONFIG.IMAGE_SMOOTHING_HIGH_ZOOM;
            }
            if (this.tileCtx.imageSmoothingEnabled) {
              this.tileCtx.imageSmoothingQuality = CONFIG.IMAGE_SMOOTHING_QUALITY;
            }

            // Clear tile with background color
            this.tileCtx.fillStyle = CONFIG.BACKGROUND_COLOR;
            this.tileCtx.fillRect(0, 0, this.tileCanvas.width, this.tileCanvas.height);

            // Draw portions of pages that intersect this tile
            let pagesDrawnCount = 0;

            for (let row = 0; row < gridRows; row++) {
              for (let col = 0; col < gridCols; col++) {
                const wasDrawn = this._drawPageIntersection(row, col, tileLeft, tileTop, tileRight, tileBottom, scale, key, resolution, level);
                if (wasDrawn) pagesDrawnCount++;
              }
            }


            // DEBUG: Draw colored borders on each edge to verify overlap
            if (CONFIG.TILE_LABELS) {
              this.tileCtx.lineWidth = 3;

              // Top edge - RED
              this.tileCtx.strokeStyle = '#FF0000';
              this.tileCtx.beginPath();
              this.tileCtx.moveTo(0, 1.5);
              this.tileCtx.lineTo(this.tileCanvas.width, 1.5);
              this.tileCtx.stroke();

              // Right edge - GREEN
              this.tileCtx.strokeStyle = '#00FF00';
              this.tileCtx.beginPath();
              this.tileCtx.moveTo(this.tileCanvas.width - 1.5, 0);
              this.tileCtx.lineTo(this.tileCanvas.width - 1.5, this.tileCanvas.height);
              this.tileCtx.stroke();

              // Bottom edge - BLUE
              this.tileCtx.strokeStyle = '#0000FF';
              this.tileCtx.beginPath();
              this.tileCtx.moveTo(0, this.tileCanvas.height - 1.5);
              this.tileCtx.lineTo(this.tileCanvas.width, this.tileCanvas.height - 1.5);
              this.tileCtx.stroke();

              // Left edge - YELLOW
              this.tileCtx.strokeStyle = '#FFFF00';
              this.tileCtx.beginPath();
              this.tileCtx.moveTo(1.5, 0);
              this.tileCtx.lineTo(1.5, this.tileCanvas.height);
              this.tileCtx.stroke();

              // Draw level number at center
              this.tileCtx.font = 'bold 60px monospace';
              this.tileCtx.textAlign = 'center';
              this.tileCtx.textBaseline = 'middle';

              // Black outline for contrast
              this.tileCtx.strokeStyle = '#000000';
              this.tileCtx.lineWidth = 5;
              this.tileCtx.strokeText(`L${level}`, this.tileCanvas.width / 2, this.tileCanvas.height / 2 - 100);

              // White text
              this.tileCtx.fillStyle = '#FFFFFF';
              this.tileCtx.fillText(`L${level}`, this.tileCanvas.width / 2, this.tileCanvas.height / 2 - 100);

              // Draw cache key below level, wrapped across multiple lines
              this.tileCtx.font = 'bold 48px monospace';
              const maxWidth = this.tileCanvas.width - 20; // Leave 10px margin on each side
              const lineHeight = 56;

              // Split key into words/chunks at underscores
              const chunks = key.split('_');
              const lines = [];
              let currentLine = '';

              for (const chunk of chunks) {
                const testLine = currentLine ? currentLine + '_' + chunk : chunk;
                const metrics = this.tileCtx.measureText(testLine);

                if (metrics.width > maxWidth && currentLine) {
                  // Line is too long, save current line and start new one
                  lines.push(currentLine);
                  currentLine = chunk;
                } else {
                  currentLine = testLine;
                }
              }
              if (currentLine) lines.push(currentLine);

              // Draw each line
              const startY = this.tileCanvas.height / 2 - 20;
              this.tileCtx.strokeStyle = '#000000';
              this.tileCtx.lineWidth = 6;

              lines.forEach((line, i) => {
                const y = startY + (i * lineHeight);
                this.tileCtx.strokeText(line, this.tileCanvas.width / 2, y);
                this.tileCtx.fillStyle = '#FFFF00'; // Yellow for key
                this.tileCtx.fillText(line, this.tileCanvas.width / 2, y);
              });
            }

            // Convert to data URL
            let dataUrl;
            if (CONFIG.TILE_FORMAT === 'png') {
              dataUrl = this.tileCanvas.toDataURL('image/png');
            } else {
              dataUrl = this.tileCanvas.toDataURL('image/jpeg', CONFIG.TILE_JPEG_QUALITY);
            }

            return dataUrl;
          }

          /**
           * Render a blank tile (for when no page data is available yet)
           */
          _renderBlankTile() {
            // DEBUG: Fill with bright green instead of background color
            this.tileCtx.fillStyle = '#00FF00'; // Bright green
            this.tileCtx.fillRect(0, 0, this.tileCanvas.width, this.tileCanvas.height);

            // Return blank tile as data URL
            if (CONFIG.TILE_FORMAT === 'png') {
              return this.tileCanvas.toDataURL('image/png');
            } else {
              return this.tileCanvas.toDataURL('image/jpeg', CONFIG.TILE_JPEG_QUALITY);
            }
          }

          /**
           * Draw page intersection with tile
           */
          _drawPageIntersection(row, col, tileLeft, tileTop, tileRight, tileBottom, scale, debugKey, resolution, level) {
            const { pageWidth, pageHeight, spacing } = this.gridDims;

            // Calculate page position in grid
            const pageLeft = col * (pageWidth + spacing);
            const pageTop = row * (pageHeight + spacing);
            const pageRight = pageLeft + pageWidth;
            const pageBottom = pageTop + pageHeight;

            // Check intersection
            if (pageRight <= tileLeft || pageLeft >= tileRight ||
                pageBottom <= tileTop || pageTop >= tileBottom) {
              return false;
            }

            // Get page canvas
            const pageNum = this.pattern[row][col];

            // Skip blank cells in staggered grid pattern
            if (pageNum === 0) {
              return false;
            }

            // Get canvas from PageStreamer cache with conditional fallback
            const pageCache = this.pageStreamer._getPageCache(resolution);
            let pageCanvas = pageCache.get(`${pageNum}_${resolution}`);

            // Track cache misses and trigger on-demand rendering
            if (!pageCanvas) {
              this.stats.cacheMisses++;

              // On-demand rendering: Immediately start rendering the missing page
              // This is fire-and-forget - we use fallback now, but the page will be ready soon
              // Deduplicate: Only trigger if not already rendering (exploit page periodicity)
              const renderKey = `${pageNum}_${resolution}`;
              const alreadyRendering = this.pageStreamer.renderingInProgress.has(renderKey);

              // Track why on-demand was skipped for L0 diagnostics
              if (level === 0 && !window.__L0OnDemandSkipped) {
                window.__L0OnDemandSkipped = { enabled: CONFIG.ON_DEMAND_RENDERING_ENABLED, skipped: [] };
              }

              if (!CONFIG.ON_DEMAND_RENDERING_ENABLED && level === 0) {
                window.__L0OnDemandSkipped.skipped.push({pageNum, reason: 'disabled'});
              } else if (alreadyRendering && level === 0) {
                window.__L0OnDemandSkipped.skipped.push({pageNum, reason: 'already_rendering'});
              }

              if (CONFIG.ON_DEMAND_RENDERING_ENABLED && !alreadyRendering) {
                this.stats.onDemandRenders++;

                // Track on-demand render for L0 diagnostics
                if (level === 0) {
                  if (!window.__L0OnDemandTracking) window.__L0OnDemandTracking = { triggered: [], completed: [], failed: [] };
                  window.__L0OnDemandTracking.triggered.push({pageNum, resolution, time: Date.now()});
                }

                // Fire async render (don't await - use fallback for now)
                this.pageStreamer.renderPage(pageNum, resolution)
                  .then(() => {
                    this.stats.onDemandHits++;

                    // Track completion for L0 diagnostics
                    if (level === 0) {
                      window.__L0OnDemandTracking.completed.push({pageNum, resolution, time: Date.now()});
                    }

                    if (CONFIG.VERBOSE_LOGGING) {
                      console.log(`[On-Demand] Rendered page ${pageNum} at ${resolution}, scheduling tile refresh`);
                    }

                    // CRITICAL: Schedule tile refresh to show newly-rendered pages
                    // Without this, tiles with blank pages won't update even though pages are now rendered
                    // Uses debounced refresh to batch multiple page renders (100ms timeout)
                    this.scheduleRedraw();
                  })
                  .catch(err => {
                    // Track failure for L0 diagnostics
                    if (level === 0) {
                      window.__L0OnDemandTracking.failed.push({pageNum, resolution, error: err.message, time: Date.now()});
                    }
                    console.warn(`[On-Demand] Failed to render page ${pageNum} at ${resolution}:`, err);
                  });
              }
            }

            // Debug: iOS diagnostic - show cache access details
            if (isIOSSafari && CONFIG.DEBUG_MODE) {
              const cacheStatus = pageCanvas ? 'HIT' : 'MISS';
              const cacheSize = `L:${this.pageStreamer.lowResPageCache.size} H:${this.pageStreamer.highResPageCache.size}`;
              if (!window.__tileCacheDebug) window.__tileCacheDebug = [];
              window.__tileCacheDebug.push(`L${level} p${pageNum}_${resolution} ${cacheStatus} (${cacheSize})`);
              if (window.__tileCacheDebug.length > 8) window.__tileCacheDebug.shift();
            }

            // Fallback logic: prevent excessive downsampling in either direction
            if (CONFIG.FALLBACK_RENDERING_ENABLED) {
              if (!pageCanvas && resolution === 'high') {
                // High-res requested but not available - try low-res fallback
                // canvasScaleFactor with low-res = PDF_LOW_RES_SCALE / PDF_RENDER_SCALE
                // = 0.3 / 4.0 = 0.075
                // Show downsampled content rather than empty tiles
                pageCanvas = this.pageStreamer.lowResPageCache.get(`${pageNum}_low`);
                // On-demand rendering will eventually replace with high-res
              } else if (!pageCanvas && resolution === 'low') {
                // Low-res requested but not available - check if high-res would be acceptable
                // Calculate sampling ratio: how much would we downsample high-res?
                // Sampling ratio = scale / PDF_RENDER_SCALE
                // Only use high-res if sampling ratio >= 0.5 (no more than 2x downsampling)
                const minSafeScale = 0.5 * CONFIG.PDF_RENDER_SCALE; // 0.5 * 4.0 = 2.0
                if (scale >= minSafeScale) {
                  pageCanvas = this.pageStreamer.highResPageCache.get(`${pageNum}_high`);
                }
              }
              // Note: If fallback would require excessive downsampling, we leave blank
              // rather than show extremely blurry content. On-demand rendering will fill it in.
            }
            // Note: If fallback is disabled, tiles will remain blank until correct resolution is rendered

            if (!pageCanvas) {
              // Track why drawing failed for diagnostics
              if (!window.__drawPageDebug) window.__drawPageDebug = { failures: [] };
              window.__drawPageDebug.failures.push({
                level, pageNum, resolution,
                reason: 'no_canvas',
                requestedRes: resolution,
                highAvail: this.pageStreamer.hasPage(pageNum, 'high'),
                lowAvail: this.pageStreamer.hasPage(pageNum, 'low')
              });

              // Neither resolution available yet - tile will be blank
              return false;
            }

            // Debug: Disabled per-page canvas validation

            // Calculate intersection rectangle
            const intersectLeft = Math.max(tileLeft, pageLeft);
            const intersectTop = Math.max(tileTop, pageTop);
            const intersectRight = Math.min(tileRight, pageRight);
            const intersectBottom = Math.min(tileBottom, pageBottom);

            // Calculate canvas scale factor
            // Grid dimensions are based on high-res, but canvas might be low-res
            const canvasScaleFactor = pageCanvas.width / pageWidth;

            // Diagnostic: Warn if scale factor is unexpectedly small (indicates wrong resolution)
            if (CONFIG.DEBUG_MODE && level > this.minimapMaxLevel && canvasScaleFactor < 0.5) {
              // Detect actual resolution being used (not just requested)
              const actualResolution = canvasScaleFactor < 0.15 ? 'low' : 'high';
              const resolutionMatch = actualResolution === resolution ? 'as requested' : `fallback (requested ${resolution})`;
              console.warn(`[TileStreamer] L${level} page ${pageNum}: Using ${actualResolution}-res ${resolutionMatch} at deep zoom. canvasScaleFactor=${canvasScaleFactor.toFixed(3)} (canvas ${pageCanvas.width}px / grid ${pageWidth}px). Expected high-res (≥0.5).`);
            }

            // Source coordinates (within the page canvas, adjusted for resolution)
            const srcX = (intersectLeft - pageLeft) * canvasScaleFactor;
            const srcY = (intersectTop - pageTop) * canvasScaleFactor;
            const srcW = (intersectRight - intersectLeft) * canvasScaleFactor;
            const srcH = (intersectBottom - intersectTop) * canvasScaleFactor;

            // Destination coordinates (within the tile canvas)
            // Grid coords → canvas pixels
            const destX = (intersectLeft - tileLeft) * scale;
            const destY = (intersectTop - tileTop) * scale;
            const destW = (intersectRight - intersectLeft) * scale;
            const destH = (intersectBottom - intersectTop) * scale;

            // Debug: Check if drawing outside canvas bounds (disabled to reduce noise)
            // if (CONFIG.DEBUG_MODE && this.cacheGeneration >= 2) {
            //   if (destX >= this.tileCanvas.width || destY >= this.tileCanvas.height) {
            //     console.warn(`[Drawing] Page ${pageNum} at level ${level} gen${this.cacheGeneration}: destX=${destX.toFixed(1)}, destY=${destY.toFixed(1)} >= canvas ${this.tileCanvas.width}x${this.tileCanvas.height}`);
            //   }
            //   if (destW <= 0 || destH <= 0) {
            //     console.warn(`[Drawing] Page ${pageNum} at level ${level} gen${this.cacheGeneration}: zero destW/H: ${destW.toFixed(1)}x${destH.toFixed(1)}`);
            //   }
            // }

            // Debug: Check tile context state before drawing (first draw only)
            if (CONFIG.DEBUG_MODE && level === 1 && !this._contextStateChecked) {
              this._contextStateChecked = true;
              console.log(`[L1 Context] globalAlpha=${this.tileCtx.globalAlpha}, globalCompositeOperation=${this.tileCtx.globalCompositeOperation}, imageSmoothingEnabled=${this.tileCtx.imageSmoothingEnabled}`);
            }

            // Debug: Disabled per-draw bounds checking

            // Validate drawing coordinates before attempting draw
            if (srcW <= 0 || srcH <= 0 || destW <= 0 || destH <= 0) {
              if (!window.__drawPageDebug) window.__drawPageDebug = { failures: [] };
              window.__drawPageDebug.failures.push({
                level, pageNum, resolution,
                reason: 'invalid_dimensions',
                srcW, srcH, destW, destH,
                canvasScaleFactor
              });
              return false;
            }

            // Bounds check with floating point tolerance (1px epsilon)
            // Floating point math can produce values like 124.00000000000001 when canvas is 124px
            // Allow small overshoot to prevent rejecting valid draws due to FP precision errors
            const epsilon = 1.0;
            const maxSrcX = pageCanvas.width + epsilon;
            const maxSrcY = pageCanvas.height + epsilon;

            if (srcX < -epsilon || srcY < -epsilon || srcX + srcW > maxSrcX || srcY + srcH > maxSrcY) {
              if (!window.__drawPageDebug) window.__drawPageDebug = { failures: [] };
              window.__drawPageDebug.failures.push({
                level, pageNum, resolution,
                reason: 'source_out_of_bounds',
                srcX, srcY, srcW, srcH,
                canvasWidth: pageCanvas.width,
                canvasHeight: pageCanvas.height,
                canvasScaleFactor,
                overshootX: (srcX + srcW) - pageCanvas.width,
                overshootY: (srcY + srcH) - pageCanvas.height
              });
              return false;
            }

            // Draw
            try {
              this.tileCtx.drawImage(
                pageCanvas,
                srcX, srcY, srcW, srcH,
                destX, destY, destW, destH
              );

              // Track successful draw for L0 diagnostics
              if (level === 0) {
                if (!window.__drawPageDebug) window.__drawPageDebug = { failures: [], successes: [] };
                if (!window.__drawPageDebug.successes) window.__drawPageDebug.successes = [];
                window.__drawPageDebug.successes.push({ pageNum, resolution });
              }

              return true;
            } catch (err) {
              if (!window.__drawPageDebug) window.__drawPageDebug = { failures: [] };
              window.__drawPageDebug.failures.push({
                level, pageNum, resolution,
                reason: 'draw_exception',
                error: err.message
              });
              return false;
            }
          }
        }

        // ╔══════════════════════════════════════════════════════════════════════════╗
        // ║                      OPENSEADRAGON MANAGER MODULE                        ║
        // ╚══════════════════════════════════════════════════════════════════════════╝

        /**
         * OpenSeadragon viewer initialization and configuration
         * Handles device detection, viewport setup, and navigator management
         */
        const OSDManager = {
          /**
           * Detect if device is a small phone (not tablet/iPad)
           * Uses physical screen size, not just pixels
           */
          isTouchDevice() {
            // Check multiple signals for touch devices
            const hasCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
            const hasNoHover = window.matchMedia('(hover: none)').matches;
            const hasTouchEvents = 'ontouchstart' in window;

            // If not a touch device at all, show navigator
            const isTouchCapable = hasCoarsePointer || hasNoHover || (hasTouchEvents && !window.matchMedia('(pointer: fine)').matches);
            if (!isTouchCapable) {
              return false;
            }

            // It's touch-capable, but is it a small phone or a tablet/iPad?
            // Calculate approximate physical width in inches
            const devicePixelRatio = window.devicePixelRatio || 1;
            const physicalWidth = window.screen.width / devicePixelRatio;
            const physicalHeight = window.screen.height / devicePixelRatio;

            // Assume ~160 DPI for rough physical size calculation
            // (Most phones are 326-460 DPI, tablets are 220-264 DPI)
            const minDimension = Math.min(physicalWidth, physicalHeight);

            // Hide navigator only on small screens (< 600 CSS pixels in portrait)
            // This catches phones but not iPads/tablets (typically 768px+)
            return minDimension < 600;
          },

          /**
           * Initialize OpenSeadragon viewer
           * @param {boolean} forceShowNavigator - If true, show navigator immediately (used during recreation)
           */
          initialize(tileStreamer, pageWidth, pageHeight, gridSize, forceShowNavigator = false) {
            // Set fixed minZoomImageRatio - grid should fill ~90% of viewport when fully zoomed out
            const minZoomImageRatio = 0.9;

            // Detect small phone and hide navigator on mobile
            const isSmallPhone = this.isTouchDevice();
            const showNavigator = !isSmallPhone;
            window.osdShowNavigator = showNavigator; // Store for later use

            // Adjust maxZoomPixelRatio for high DPI displays (Retina, etc.)
            // This ensures same zoom depth regardless of screen pixel density
            const devicePixelRatio = window.devicePixelRatio || 1;

            if (CONFIG.VERBOSE_LOGGING) {
              console.log(`Grid size: ${gridSize}×${gridSize}, minZoomImageRatio: ${minZoomImageRatio.toFixed(3)}`);
              console.log(`Small phone: ${isSmallPhone}, Navigator: ${showNavigator ? 'enabled' : 'hidden (mobile)'}`);
              console.log(`Device pixel ratio: ${devicePixelRatio}`);
            }

            const viewerConfig = {
              id: 'openseadragon-viewer',
              prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/',
              tileSources: tileStreamer.getOSDConfig(),
              debugMode: CONFIG.DEBUG_MODE, // Show tile borders and labels
              showNavigator: showNavigator, // Always show if not mobile
              navigatorPosition: 'TOP_RIGHT',
              showRotationControl: false, // Hide rotation buttons
              showZoomControl: false, // Hide zoom in/out buttons
              showHomeControl: true, // Keep home button
              showFullPageControl: true, // Keep fullscreen button
              maxZoomLevel: null, // Remove max zoom level constraint
              maxZoomPixelRatio: Infinity, // Remove pixel ratio constraint - allow unlimited zoom
              minZoomImageRatio: minZoomImageRatio, // Dynamically calculated based on grid size
              visibilityRatio: CONFIG.OSD_VISIBILITY_RATIO,
              constrainDuringPan: false, // Allow panning beyond bounds when zoomed in
              homeFillsViewer: false,
              immediateRender: true,
              preload: true,
              maxImageCacheCount: 20, // Small cache to preserve successful tiles, prevent serving degraded regenerations
              // Fallback options if this doesn't work:
              // - Option 2: Throttle/dedupe L0 tile generation requests
              // - Option 3: Delay L0 generation until page cache is complete
              zoomPerScroll: 1.5, // Increase scroll wheel sensitivity (default: 1.2)
              // Ensure touch gestures have same zoom limits as desktop
              gestureSettingsMouse: {
                clickToZoom: false,
                dblClickToZoom: true
              },
              gestureSettingsTouch: {
                pinchToZoom: true,
                flickEnabled: true,
                flickMinSpeed: 0.5,
                flickMomentum: 0.25
              },
              // Reduce sub-pixel rounding artifacts between tiles
              // See: https://github.com/openseadragon/openseadragon/issues/2515
              subPixelRoundingForTransparency: 2
            };

            // Only set minZoomLevel if specified
            if (CONFIG.OSD_MIN_ZOOM !== null) {
              viewerConfig.minZoomLevel = CONFIG.OSD_MIN_ZOOM;
            }

            const viewer = OpenSeadragon(viewerConfig);

            // Expose viewer globally for automated testing
            window.viewer = viewer;

            // Set initial view (switchable via DEBUG_INITIAL_VIEW_WHOLE_GRID)
            viewer.addHandler('open', function() {
              // Workaround for sub-pixel gaps with PNG tiles
              // Tell OSD our tiles don't have transparency to avoid transparency rendering artifacts
              // See: https://github.com/openseadragon/openseadragon/issues/2515
              viewer.world.getItemAt(0).source.hasTransparency = () => false;

              // Signal viewer is fully initialized and ready for testing
              window.viewerReady = true;

              if (CONFIG.DEBUG_INITIAL_VIEW_WHOLE_GRID) {
                // Debug mode: Show the entire grid at once (fills ~90% of viewport per minZoomImageRatio)
                viewer.viewport.goHome(true);
              } else {
                // Normal mode: Center on page 1 at top
                // In staggered grid, page 1 is at row 0, column halfN (centered)
                const spacing = Math.floor(pageWidth * CONFIG.GRID_SPACING_RATIO);
                const halfN = Math.floor(gridSize / 2);
                const page1Col = halfN;
                const page1Row = 0;

                // Calculate page 1 position in pixel coordinates
                const page1X = page1Col * (pageWidth + spacing);
                const page1Y = page1Row * (pageHeight + spacing);

                // Center on page 1, showing slightly more than one page (1.5x)
                const viewWidth = pageWidth * 1.5;
                const viewHeight = pageHeight * 1.5;
                const viewX = page1X - (viewWidth - pageWidth) / 2;
                const viewY = page1Y - (viewHeight - pageHeight) / 2;

                const viewportRect = viewer.viewport.imageToViewportRectangle(
                  viewX, viewY, viewWidth, viewHeight
                );
                viewer.viewport.fitBounds(viewportRect, true);
              }
            });

            // Track when initial tiles are fully loaded (for automated testing)
            // Use fully-loaded-change event to detect when all initial tiles finish loading
            let initialTilesLoaded = false;
            viewer.addHandler('fully-loaded-change', function(event) {
              if (event.fullyLoaded && !initialTilesLoaded) {
                initialTilesLoaded = true;
                // Give OSD a moment to finish drawing to canvas before signaling ready
                setTimeout(() => {
                  window.tilesFullyLoaded = true;
                  console.log('[OSD] Initial tiles fully loaded and rendered');
                }, 100);
              }
            });

            return viewer;
          }
        };

        // ╔══════════════════════════════════════════════════════════════════════════╗
        // ║                            MAIN COMPONENT                                ║
        // ╚══════════════════════════════════════════════════════════════════════════╝

        const PDFGridViewer = () => {
          const [pdfFile, setPdfFile] = useState(null);
          const [numPages, setNumPages] = useState(0);
          const [isLoading, setIsLoading] = useState(false);
          const [loadingStatus, setLoadingStatus] = useState('');
          const [pagesLoaded, setPagesLoaded] = useState(0);
          const [urlInput, setUrlInput] = useState('');
          const [showHelp, setShowHelp] = useState(false);
          const [showDebug, setShowDebug] = useState(() => {
            // Check for ?debug URL parameter
            const params = new URLSearchParams(window.location.search);
            return params.has('debug') && params.get('debug') !== 'false' && params.get('debug') !== '0';
          });
          const [showVerboseLogging, setShowVerboseLogging] = useState(false);
          const [showTileLabels, setShowTileLabels] = useState(false);
          const [showTileBorders, setShowTileBorders] = useState(false);
          const [debugUpdateCounter, setDebugUpdateCounter] = useState(0);
          const [currentFilename, setCurrentFilename] = useState('');
          const [storageMB, setStorageMB] = useState(0); // Track storage usage

          // Performance toggles - load from localStorage or use CONFIG defaults
          const [parallelRendering, setParallelRendering] = useState(() => {
            const stored = localStorage.getItem('pdfgrid_parallel_rendering');
            return stored !== null ? JSON.parse(stored) : CONFIG.PARALLEL_RENDERING_ENABLED;
          });
          const [onDemandRendering, setOnDemandRendering] = useState(() => {
            const stored = localStorage.getItem('pdfgrid_ondemand_rendering');
            return stored !== null ? JSON.parse(stored) : CONFIG.ON_DEMAND_RENDERING_ENABLED;
          });
          const [predictiveRendering, setPredictiveRendering] = useState(() => {
            const stored = localStorage.getItem('pdfgrid_predictive_rendering');
            return stored !== null ? JSON.parse(stored) : CONFIG.PREDICTIVE_RENDERING_ENABLED;
          });
          const [upfrontRendering, setUpfrontRendering] = useState(() => {
            const stored = localStorage.getItem('pdfgrid_upfront_rendering');
            return stored !== null ? JSON.parse(stored) : CONFIG.UPFRONT_RENDERING_ENABLED;
          });
          const [fallbackRendering, setFallbackRendering] = useState(() => {
            const stored = localStorage.getItem('pdfgrid_fallback_rendering');

          const [resolutionMode, setResolutionMode] = useState(() => {

          const [tileCacheSize, setTileCacheSize] = useState(() => {

          });
          const [lowResPageCacheSize, setLowResPageCacheSize] = useState(() => {

          const [highResPageCacheSize, setHighResPageCacheSize] = useState(() => {

          });
          const [viewportRadius, setViewportRadius] = useState(() => {

            return stored !== null ? parseInt(stored) : CONFIG.VIEWPORT_PRIORITY_RADIUS;
          });

          const viewerRef = useRef(null);
          const osdViewerRef = useRef(null);
          const pageCanvasesRef = useRef([]); // Legacy: kept for backward compatibility
          const lowResCanvasesRef = useRef([]);  // Low-res canvases for navigator/minimap
          const highResCanvasesRef = useRef([]); // High-res canvases for main viewer
          const pdfDocRef = useRef(null);
          const tileStreamerRef = useRef(null);
          const loadingCancelledRef = useRef(false);
          const pdfFileSizeRef = useRef(0); // Track PDF file size in bytes

          // Detect touch device using OSDManager
          const isTouchDevice = React.useMemo(() => OSDManager.isTouchDevice(), []);

          // Initialize PDF.js worker on mount
          React.useEffect(() => {
            PDFUtils.initWorker();
          }, []);

          // Fix iOS Safari viewport height
          React.useEffect(() => {
            const setVH = () => {
              const vh = window.innerHeight * 0.01;
              document.documentElement.style.setProperty('--vh', `${vh}px`);
            };

            setVH();
            window.addEventListener('resize', setVH);
            window.addEventListener('orientationchange', setVH);

            return () => {

              window.removeEventListener('orientationchange', setVH);

          }, []);

          // Sync debug state with CONFIG
          React.useEffect(() => {

          // Sync debug panel state with URL parameter
          React.useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const currentDebugParam = params.has('debug') && params.get('debug') !== 'false' && params.get('debug') !== '0';

            // Only update URL if state differs from current param
            if (showDebug !== currentDebugParam) {
              if (showDebug) {
                params.set('debug', '1');
              } else {
                params.delete('debug');
              }

              const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
              window.history.replaceState({}, '', newUrl);
            }
          }, [showDebug]);

          // Auto-load PDF on mount
          // Separated concerns: URL parameters always work, config auto-load is optional
          React.useEffect(() => {
            // Handle URL parameters - ALWAYS runs (independent of CONFIG.AUTO_LOAD_PDF)
            const handleURLParameters = async () => {
              const { url: urlParam, pdf: pdfParam } = URLManager.getParams();

              // Priority 1: ?url= parameter (remote URL)
              if (urlParam) {
                try {
                  console.log(`Loading PDF from URL parameter: ${urlParam}`);
                  await loadPDFFromURL(urlParam, true); // skipHistory=true to avoid double-pushing
                  return true; // Successfully handled
                } catch (error) {
                  console.error(`Failed to load PDF from URL parameter: ${error.message}`);
                  alert(`Failed to load PDF from URL: ${error.message}`);
                  return true; // Handled (even though it failed)
                }
              }

              if (pdfParam) {

                let storageError = null;

                try {
                  storageAttempted = true;
                  const stored = await PDFStorage.load();
                  if (stored && stored.filename === pdfFilename) {
                    console.log(`Loading local PDF from storage: ${pdfFilename}`);

                    setIsLoading(true);

                    await loadPDFFromURL(pdfFilename, true); // Load relative path, skipHistory=true
                    return true; // Successfully handled
                  } catch (error) {

                    if (storageError) {
                      errorMsg += `Storage error: ${storageError.message}\n`;
                    } else if (storageAttempted) {
                      errorMsg += `Not found in storage.\n`;

                  }
                } else {

                  if (storageError) {
                    errorMsg += `Storage error: ${storageError.message}\n\n`;
                  }
                  errorMsg += `Cannot fetch from server (file:// protocol).`;

                  console.log(errorMsg);
                  alert(errorMsg);
                  return true; // Handled (even though it failed)
                }
              }

              return false; // No URL parameters present
            };

            // Restore stored PDF from previous session - ALWAYS runs if no URL params
            const restoreStoredPDF = async () => {
              try {
                const stored = await PDFStorage.load();
                if (stored) {
                  console.log(`Loading stored PDF from previous session: ${stored.filename}`);
                  loadingCancelledRef.current = false; // Reset cancel flag
                  setIsLoading(true);
                  setLoadingStatus('Loading stored PDF...');
                  setPdfFile({ name: stored.filename });
                  setUrlInput(stored.filename);

                  // Add ?pdf= parameter to URL
                  URLManager.replaceState('pdf', stored.filename);

                  const pdf = await pdfjsLib.getDocument({ data: stored.pdfData }).promise;

          /**

          const loadPDF = async (pdf, filename = 'PDF') => {
            try {
              setNumPages(pdf.numPages);
              pdfDocRef.current = pdf;
              setCurrentFilename(filename);

              // Update page title - extract filename from URL if needed
              const displayName = filename.startsWith('http://') || filename.startsWith('https://')
                ? decodeURIComponent(filename.split('/').pop() || 'PDF')
                : filename;
              document.title = `${displayName} - PDF Grid Viewer`;

              if (CONFIG.VERBOSE_LOGGING) {
                console.log(`[Resolution Mode] Configured for: ${CONFIG.RESOLUTION_MODE}`);
              }

              // Phase 1: Render priority high-res pages FIRST
              let pageWidth, pageHeight;
              let priorityPages = [];
              if (CONFIG.RESOLUTION_MODE === 'high' || CONFIG.RESOLUTION_MODE === 'dual') {
                priorityPages = GridPattern.calculatePriorityPages(pdf.numPages);
                if (CONFIG.VERBOSE_LOGGING) {

                }
                setLoadingStatus('Rendering initial view...');
                await pageStreamer.renderBatch(

                  (current, total) => {
                    setPagesLoaded(current);
                    setLoadingStatus(`Rendering initial view (${current}/${priorityPages.length})...`);
                  }
                );

                // Get page dimensions from first rendered high-res page
                const firstHighRes = pageStreamer.highResPageCache.get('1_high') || pageStreamer.highResPageCache.get(`${priorityPages[0]}_high`);
                pageWidth = firstHighRes.width;
                pageHeight = firstHighRes.height;
              } else {
                if (CONFIG.VERBOSE_LOGGING) {
                  console.log(`[Resolution Mode] Skipping Phase 1 (high-res) - mode is '${CONFIG.RESOLUTION_MODE}'`);
                }
              }

              // Phase 2: Render low-res pages needed for initial viewport (calculated dynamically)
              // v1.8: Calculate which pages are visible/needed in initial view
              // Note: Separate low/high-res caches prevent eviction conflicts
              let initialLowResCount = 0;
              if (CONFIG.RESOLUTION_MODE === 'low' || CONFIG.RESOLUTION_MODE === 'dual') {
                // If we skipped Phase 1, we need to render at least one low-res page to get dimensions
                if (!pageWidth) {
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`Rendering page 1 (low-res) to get dimensions...`);
                  }
                  await pageStreamer.renderPage(1, 'low');
                  const firstLowRes = pageStreamer.lowResPageCache.get('1_low');
                  pageWidth = firstLowRes.width;
                  pageHeight = firstLowRes.height;

                setLoadingStatus('Rendering minimap...');
                const initialLowResPages = GridPattern.calculateInitialViewportPages(pdf.numPages, pageWidth, pageHeight);

                if (CONFIG.VERBOSE_LOGGING) {
                  console.log(`Rendering ${initialLowResPages.length} low-res pages for initial viewport coverage...`);
                }
                initialLowResCount = initialLowResPages.length;
                await pageStreamer.renderBatch(
                  initialLowResPages,
                  'low',
                  20,
                  (current, total) => {
                    setPagesLoaded(current);
                    setLoadingStatus(`Rendering minimap (${current}/${initialLowResCount})...`);
                  }
                );
              } else {
                if (CONFIG.VERBOSE_LOGGING) {
                  console.log(`[Resolution Mode] Skipping Phase 2 (low-res) - mode is '${CONFIG.RESOLUTION_MODE}'`);
                }
              }

              // Phase 3: Render ALL remaining pages BEFORE viewer initialization
              // Complete all page rendering NOW to avoid L0 tile issues
              // Use same fast batch approach as initial rendering
              if (CONFIG.UPFRONT_RENDERING_ENABLED && (CONFIG.RESOLUTION_MODE === 'low' || CONFIG.RESOLUTION_MODE === 'dual')) {
                if (CONFIG.VERBOSE_LOGGING) {
                  console.log(`[Upfront Rendering] ENABLED - Rendering all remaining low-res pages before viewer starts`);
                }
                const remainingPages = [];
                for (let i = 1; i <= pdf.numPages; i++) {
                  if (!pageStreamer.hasPage(i, 'low')) {
                    remainingPages.push(i);
                  }
                }

                if (remainingPages.length > 0) {
                  setLoadingStatus(`Rendering remaining ${remainingPages.length} pages...`);
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`  Rendering remaining ${remainingPages.length} low-res pages with fast batching...`);
                  }
                  await pageStreamer.renderBatch(
                    remainingPages,
                    'low',
                    20,  // Same batch size as initial rendering (fast!)
                    (current, total) => {
                      setLoadingStatus(`Rendering minimap (${initialLowResCount + current}/${pdf.numPages})...`);
                    }
                  );
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`  All pages rendered!`);
                  }
                }
              } else if (!CONFIG.UPFRONT_RENDERING_ENABLED) {
                if (CONFIG.VERBOSE_LOGGING) {
                  console.log(`[Upfront Rendering] DISABLED - Skipping Phase 3 (remaining pages will render on-demand)`);
                }
              } else {
                if (CONFIG.VERBOSE_LOGGING) {
                  console.log(`[Upfront Rendering] Skipping Phase 3 - resolution mode is '${CONFIG.RESOLUTION_MODE}' (low-res not needed)`);
                }
              }

              // Phase 4: Initialize viewer (user can interact, all pages ready!)
              setLoadingStatus('Initializing viewer...');
              initializeViewer(pdf.numPages, pageWidth, pageHeight);

              // Note: window.viewerReady is set in the viewer's 'open' event handler
              setLoadingStatus('');
              setIsLoading(false);

              if (CONFIG.VERBOSE_LOGGING) {
                const cacheStats = pageStreamer.getCacheStats();
                console.log(`Initial rendering complete:`);
                console.log(`  High-res: ${priorityPages.length}/${pdf.numPages} pages (priority for detail)`);
                console.log(`  Low-res: ${cacheStats.low}/${pdf.numPages} pages (ALL pages rendered!)`);
                console.log(`  Navigator: shown with complete grid`);
              }

            } catch (error) {
