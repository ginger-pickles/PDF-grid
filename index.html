              const { url: urlParam, pdf: pdfParam } = URLManager.getParams();

              // Priority 1: ?url= parameter (remote URL)
              if (urlParam) {
                try {
                  console.log(`Loading PDF from URL parameter: ${urlParam}`);
                  await loadPDFFromURL(urlParam, true); // skipHistory=true to avoid double-pushing
                  return true; // Successfully handled
                } catch (error) {
                  console.error(`Failed to load PDF from URL parameter: ${error.message}`);
                  alert(`Failed to load PDF from URL: ${error.message}`);
                  return true; // Handled (even though it failed)
                }
              }

              // Priority 2: ?pdf= parameter (local file from storage or server)
              if (pdfParam) {
                const pdfFilename = decodeURIComponent(pdfParam);

                // First try loading from storage
                try {
                  const stored = await PDFStorage.load();
                  if (stored && stored.filename === pdfFilename) {
                    console.log(`Loading local PDF from storage: ${pdfFilename}`);
                    loadingCancelledRef.current = false; // Reset cancel flag
                    setIsLoading(true);
                    setLoadingStatus('Loading stored PDF...');
                    setPdfFile({ name: stored.filename });
                    setUrlInput(stored.filename);

                    const pdf = await pdfjsLib.getDocument({ data: stored.pdfData }).promise;
                    await loadPDF(pdf, stored.filename);
                    return true; // Successfully handled
                  }
                } catch (error) {
                  console.error(`Failed to load from storage:`, error);
                }

                // If not in storage, try fetching from server (only works when served via HTTP)
                if (window.location.protocol !== 'file:') {
                  try {
                    console.log(`PDF not in storage, attempting to fetch from server: ${pdfFilename}`);
                    await loadPDFFromURL(pdfFilename, true); // Load relative path, skipHistory=true
                    return true; // Successfully handled
                  } catch (error) {
                    console.error(`Failed to fetch PDF from server: ${error.message}`);
                    alert(`PDF "${pdfFilename}" not found in storage or on server.`);
                    return true; // Handled (even though it failed)
                  }
                } else {
                  console.log(`PDF "${pdfFilename}" not in storage, and file:// protocol prevents server fetch`);
                  return true; // Handled (even though it failed)
                }
              }

              return false; // No URL parameters present
            };

            // Restore stored PDF from previous session - ALWAYS runs if no URL params
            const restoreStoredPDF = async () => {
              try {
                const stored = await PDFStorage.load();
                if (stored) {
                  console.log(`Loading stored PDF from previous session: ${stored.filename}`);
                  loadingCancelledRef.current = false; // Reset cancel flag
                  setIsLoading(true);
                  setLoadingStatus('Loading stored PDF...');
                  setPdfFile({ name: stored.filename });
                  setUrlInput(stored.filename);

                  // Add ?pdf= parameter to URL
                  URLManager.replaceState('pdf', stored.filename);

                  const pdf = await pdfjsLib.getDocument({ data: stored.pdfData }).promise;
                  await loadPDF(pdf, stored.filename);
                  return true; // Successfully restored
                }
              } catch (error) {
                console.error(`Failed to load stored PDF:`, error);
                setIsLoading(false);
                // Show error and clear bad storage
                alert(`Failed to restore stored PDF: ${error.message}\n\nClearing storage.`);
                await PDFStorage.clear();
              }
              return false; // No stored PDF or failed to restore
            };

            // Auto-load demo PDF - ONLY runs if CONFIG.AUTO_LOAD_PDF is set
            const autoLoadDemo = async () => {
              if (!CONFIG.AUTO_LOAD_PDF) {
                console.log('No PDF to auto-load. Waiting for manual upload or URL parameters.');
                return;
              }

              // Skip auto-load for file:// protocol (browser security restrictions)
              if (window.location.protocol === 'file:') {
                console.log('Auto-load disabled for file:// protocol. Please serve via HTTP (e.g., python -m http.server) to use auto-load, or drag & drop a PDF to get started.');
                return;
              }

              try {
                console.log(`Attempting to auto-load demo: ${CONFIG.AUTO_LOAD_PDF}`);
                await loadPDFFromURL(CONFIG.AUTO_LOAD_PDF);
              } catch (error) {
                console.log(`Auto-load failed (${error.message}). Waiting for manual upload.`);
                // Silently fail - user can upload manually
              }
            };

            // Run loading sequence
            (async () => {
              // First, check for URL parameters (highest priority, always runs)
              const handledByURL = await handleURLParameters();
              if (handledByURL) return;

              // Second, try to restore stored PDF from previous session (always runs)
              const restoredFromStorage = await restoreStoredPDF();
              if (restoredFromStorage) return;

              // Finally, auto-load demo if configured (only if CONFIG.AUTO_LOAD_PDF is set)
              await autoLoadDemo();
            })();
          }, []);

          // TEMPORARILY DISABLED: Handle browser back/forward navigation
          // React.useEffect(() => {
          //   const handlePopState = async (event) => {
          //     console.log('Popstate event:', event.state);
          //     const { url: urlParam, pdf: pdfParam } = URLManager.getParams();
          //     if (urlParam) {
          //       console.log(`Back/forward: Loading URL ${urlParam}`);
          //       await loadPDFFromURL(urlParam, true);
          //     } else if (pdfParam) {
          //       console.log(`Back/forward: Loading local PDF ${pdfParam}`);
          //       try {
          //         const stored = await PDFStorage.load();
          //         if (stored && stored.filename === decodeURIComponent(pdfParam)) {
          //           loadingCancelledRef.current = false;
          //           setIsLoading(true);
          //           setLoadingStatus('Loading PDF...');
          //           setPdfFile({ name: stored.filename });
          //           setUrlInput(stored.filename);
          //           const pdf = await pdfjsLib.getDocument({ data: stored.pdfData }).promise;
          //           await loadPDF(pdf, stored.filename);
          //         } else {
          //           alert(`PDF "${pdfParam}" not found in storage. It may have expired.`);
          //         }
          //       } catch (error) {
          //         console.error('Error loading PDF from history:', error);
          //         alert(`Failed to load PDF: ${error.message}`);
          //       }
          //     }
          //   };
          //   window.addEventListener('popstate', handlePopState);
          //   return () => window.removeEventListener('popstate', handlePopState);
          // }, []);

          /**
           * Common PDF loading logic for both file upload and URL loading
           */
          const loadPDF = async (pdf, filename = 'PDF') => {
            try {
              setNumPages(pdf.numPages);
              pdfDocRef.current = pdf;
              setCurrentFilename(filename);

              // Update page title - extract filename from URL if needed
              const displayName = filename.startsWith('http://') || filename.startsWith('https://')
                ? decodeURIComponent(filename.split('/').pop() || 'PDF')
                : filename;
              document.title = `${displayName} - PDF Grid Viewer`;

              console.log(`[v${CONFIG.VERSION}] Loaded ${filename} with ${pdf.numPages} pages`);

              // Allow UI to update (show spinner) before heavy rendering starts
              await new Promise(resolve => setTimeout(resolve, 100));

              // Create PageStreamer instance
              const pageStreamer = new PageStreamer(pdf);
              window.pageStreamerRef = pageStreamer; // Store globally for TileStreamer access

              // Phase 1: Render priority high-res pages FIRST
              const priorityPages = GridPattern.calculatePriorityPages(pdf.numPages);
              console.log(`Rendering ${priorityPages.length} priority pages for initial view (high-res)...`);
              setLoadingStatus('Rendering initial view...');
              await pageStreamer.renderBatch(
                priorityPages,
                'high',
                5,
                (current, total) => {
                  setPagesLoaded(current);
                  setLoadingStatus(`Rendering initial view (${current}/${priorityPages.length})...`);
                }
              );

              // Get page dimensions from first rendered high-res page
              const firstHighRes = pageStreamer.pageCache.get('1_high') || pageStreamer.pageCache.get(`${priorityPages[0]}_high`);
              const pageWidth = firstHighRes.width;
              const pageHeight = firstHighRes.height;

              // Phase 2: Render low-res pages needed for initial viewport (calculated dynamically)
              // v1.8: Calculate which pages are visible/needed in initial view
              setLoadingStatus('Rendering minimap...');
              const initialLowResPages = GridPattern.calculateInitialViewportPages(pdf.numPages, pageWidth, pageHeight);
              console.log(`Rendering ${initialLowResPages.length} low-res pages for initial viewport coverage...`);
              const initialLowResCount = initialLowResPages.length;
              await pageStreamer.renderBatch(
                initialLowResPages,
                'low',
                20,
                (current, total) => {
                  setPagesLoaded(current);
                  setLoadingStatus(`Rendering minimap (${current}/${initialLowResCount})...`);
                }
              );

              // Phase 3: Initialize viewer (user can interact immediately!)
              setLoadingStatus('Initializing viewer...');
              initializeViewer(pdf.numPages, pageWidth, pageHeight);

              setLoadingStatus('');
              setIsLoading(false);

              const cacheStats = pageStreamer.getCacheStats();
              console.log(`Initial rendering complete:`);
              console.log(`  High-res: ${priorityPages.length}/${pdf.numPages} pages (priority for detail)`);
              console.log(`  Low-res: ${cacheStats.low}/${pdf.numPages} pages (initial viewport coverage, rest in background...)`);
              console.log(`  Navigator: shown immediately`);
              console.log(`  Strategy: Render all pages in background, then recreate viewer for complete grid`);

              // Phase 4: Background render remaining pages (sequential), then add navigator
              renderLowResInBackground(pageStreamer, pdf.numPages, initialLowResCount);

            } catch (error) {
              if (error.message === 'Loading cancelled by user') {
                console.log('PDF loading cancelled by user');
                setIsLoading(false);
                setLoadingStatus('');
                setPdfFile(null);
              } else {
                throw error;
              }
            }
          };

          /**
           * Background rendering of remaining low-res pages for minimap
           * Non-blocking, yields to browser to keep UI responsive
           * Sequential rendering for simplicity
           */
          const renderLowResInBackground = async (pageStreamer, numPages, startPage = 1) => {
            console.log(`Starting background minimap rendering from page ${startPage + 1}...`);

            for (let pageNum = startPage + 1; pageNum <= numPages; pageNum++) {

              // Check if loading was cancelled
              if (loadingCancelledRef.current) {
                console.log('[Background] Rendering cancelled by user');
                return;
              }

              // Check if already cached
              if (pageStreamer.pageCache.has(`${pageNum}_low`)) {
                continue;
              }

              // Render low-res page
              await pageStreamer.renderPage(pageNum, 'low');

              // Yield to browser every 5 pages to keep UI responsive
              if (pageNum % 5 === 0) {
                await new Promise(resolve => setTimeout(resolve, 0));
              }

              // Log progress periodically
              if (pageNum % 10 === 0 || pageNum === numPages) {
                const cacheStats = pageStreamer.getCacheStats();
                console.log(`Background minimap: ${cacheStats.low}/${numPages} pages rendered`);
              }
            }

            // Verify all pages actually rendered
            const finalStats = pageStreamer.getCacheStats();
            console.log(`[Background] Loop completed: ${finalStats.low}/${numPages} low-res pages in cache`);

            // Debug: List any missing low-res pages
            if (CONFIG.DEBUG_MODE) {
              const missingLowRes = [];
              for (let i = 1; i <= numPages; i++) {
                if (!pageStreamer.hasPage(i, 'low')) {
                  missingLowRes.push(i);
                }
              }
              if (missingLowRes.length > 0) {
                console.warn(`[Background] WARNING: Missing low-res pages: [${missingLowRes.join(',')}]`);
              } else {
                console.log(`[Background] All ${numPages} low-res pages confirmed in cache`);
              }

              // Debug: Check pages 7-10 for transparency (only log if blank)
              for (let pageNum = 7; pageNum <= 10; pageNum++) {
                const canvas = pageStreamer.pageCache.get(`${pageNum}_low`);
                if (canvas) {
                  const ctx = canvas.getContext('2d');
                  const centerX = Math.floor(canvas.width / 2);
                  const centerY = Math.floor(canvas.height / 2);
                  const pixelData = ctx.getImageData(centerX, centerY, 1, 1).data;
                  if (pixelData[3] === 0) {
                    console.warn(`[Background] Page ${pageNum}_low is BLANK!`);
                  }
                }
              }
            }

            // Ensure level 0 tile (overview) is generated with all pages before recreation
            if (window.tileStreamerRef && window.osdViewerRef) {
              console.log('[Background] All pages ready - ensuring level 0 tile is complete...');

              // Explicitly generate level 0 tile to ensure it has all pages
              // This is the overview tile that shows the entire grid
              try {
                window.tileStreamerRef.generateTile(0, 0, 0);
                console.log('[Background] Level 0 overview tile generated with all pages');
              } catch (error) {
                console.warn('[Background] Could not pre-generate level 0 tile:', error);
              }

              // Now do final TiledImage recreation for clean slate
              console.log('[Background] Recreating TiledImage with all pages complete...');

              try {
                const viewer = window.osdViewerRef;
                const currentZoom = viewer.viewport.getZoom();
                const currentCenter = viewer.viewport.getCenter();

                // Clear tile cache so new TiledImage gets fresh tiles with all pages
                console.log('[Background] Clearing tile cache for fresh regeneration...');
                window.tileStreamerRef.cache.clear();
                console.log('[Background] Tile cache cleared');

                console.log('[Background] About to remove old TiledImage...');
                // Remove old TiledImage
                const oldTiledImage = viewer.world.getItemAt(0);
                if (oldTiledImage) {
                  viewer.world.removeItem(oldTiledImage);
                  console.log('[Background] Old TiledImage removed');
                }

                // Wait for cleanup
                await new Promise(resolve => setTimeout(resolve, 50));

                // Add fresh TiledImage
                viewer.addTiledImage({
                  tileSource: window.tileStreamerRef.getOSDConfig(),
                  success: () => {
                    viewer.viewport.zoomTo(currentZoom, null, true);
                    viewer.viewport.panTo(currentCenter, true);
                    console.log('[Background] TiledImage recreation complete - all tiles have full content!');
                  }
                });
              } catch (error) {
                console.error('[Background] Error recreating TiledImage:', error);
              }
            }

            console.log('[Background] Progressive minimap rendering complete');
          };

          const loadPDFFromURL = async (url, skipHistory = false) => {
            loadingCancelledRef.current = false; // Reset cancel flag
            setIsLoading(true);
            setLoadingStatus('Loading PDF...');
            setPdfFile({ name: url }); // Store URL as "file" for display

            // Update input field immediately to show what's being loaded
            setUrlInput(url);

            // Allow UI to update (show spinner) before heavy work starts
            await new Promise(resolve => setTimeout(resolve, 50));

            // TEMPORARILY DISABLED: URL parameter management
            // if (!skipHistory) {
            //   if (url.startsWith('http://') || url.startsWith('https://')) {
            //     await PDFStorage.clear();
            //     URLManager.pushState('url', url);
            //   } else {
            //     URLManager.pushState('pdf', url);
            //   }
            // } else {
            //   if (url.startsWith('http://') || url.startsWith('https://')) {
            //     await PDFStorage.clear();
            //   }
            // }

            try {
              const pdf = await PDFUtils.loadPDFFromURL(url);
              await loadPDF(pdf, url);
            } catch (error) {
              if (error.message === 'Loading cancelled by user') {
                console.log('Loading cancelled');
                setPdfFile(null);
              } else {
                console.error('Error loading PDF from URL:', error);
                setPdfFile(null); // Clear pdfFile to show instruction screen
              }
              setIsLoading(false);
              setLoadingStatus('');
              if (error.message !== 'Loading cancelled by user') {
                throw error; // Re-throw for auto-load handler
              }
            }
          };

          const handleFileUpload = async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            loadingCancelledRef.current = false; // Reset cancel flag
            setIsLoading(true);
            setLoadingStatus('Loading PDF...');
            setPdfFile(file);
            setUrlInput(file.name); // Show filename in URL bar

            // Allow UI to update (show spinner) before heavy work starts
            await new Promise(resolve => setTimeout(resolve, 50));

            // TEMPORARILY DISABLED: URL parameter management
            // URLManager.pushState('pdf', file.name);

            try {
              const pdf = await PDFUtils.loadPDFFromFile(file);
              await loadPDF(pdf, file.name);

              // TEMPORARILY DISABLED: Storage operations
              // const fileData = await file.arrayBuffer();
              // await PDFStorage.save(fileData, file.name);
            } catch (error) {
              if (error.message === 'Loading cancelled by user') {
                console.log('Loading cancelled');
                setPdfFile(null);
              } else {
                console.error('Error loading PDF:', error);
                alert('Error loading PDF: ' + error.message);
              }
              setIsLoading(false);
              setLoadingStatus('');
            }
          };

          const handleUrlLoad = async () => {
            const url = urlInput.trim();
            if (!url) {
              alert('Please enter a URL');
              return;
            }

            // Validate URL format
            if (!url.startsWith('http://') && !url.startsWith('https://') && !url.endsWith('.pdf')) {
              alert('Please enter a valid URL starting with http:// or https://\n\nExample: https://example.com/document.pdf');
              return;
            }

            // Check if URL looks like a PDF
            const urlLower = url.toLowerCase();
            if (!urlLower.endsWith('.pdf') && !urlLower.includes('.pdf?') && !urlLower.includes('.pdf#')) {
              const proceed = confirm(
                'The URL doesn\'t appear to be a PDF file.\n\n' +
                'URL: ' + url + '\n\n' +
                'Do you want to try loading it anyway?'
              );
              if (!proceed) {
                return;
              }
            }

            try {
              await loadPDFFromURL(url);
              // URL is now displayed in the input field by loadPDFFromURL
            } catch (error) {
              let errorMsg = 'Error loading PDF from URL:\n\n' + error.message;

              // Provide helpful hints for common errors
              if (error.message.includes('Invalid PDF structure')) {
                errorMsg += '\n\nTip: Make sure the URL points directly to a PDF file, not an HTML page.';
              } else if (error.message.includes('NetworkError') || error.message.includes('CORS')) {
                errorMsg += '\n\nTip: The server may not allow cross-origin requests. Try a different PDF URL.';
              }

              alert(errorMsg);
            }
          };

          const handleUrlKeyPress = (event) => {
            if (event.key === 'Enter') {
              handleUrlLoad();
            }
          };

          const handleStopLoading = () => {
            loadingCancelledRef.current = true;
            // Immediately hide the spinner for instant feedback
            setIsLoading(false);
            setLoadingStatus('');
            setPdfFile(null);
          };

          const initializeViewer = (numPages, pageWidth, pageHeight, showNavigator = false) => {
            // Clean up existing viewer
            if (osdViewerRef.current) {
              osdViewerRef.current.destroy();
            }

            const viewerElement = document.getElementById('openseadragon-viewer');
            if (!viewerElement) {
              console.error('Viewer element not found');
              return;
            }

            // Generate grid pattern and dimensions
            const pattern = GridPattern.generate(numPages, numPages);
            const gridDims = GridPattern.calculateDimensions(numPages, pageWidth, pageHeight, pattern);

            console.log(`Grid: ${gridDims.gridRows}×${gridDims.gridCols} pages, ${pageWidth}x${pageHeight}px each, Total: ${gridDims.totalWidth}x${gridDims.totalHeight}px`);

            // Create tile streamer with PageStreamer
            const pageStreamer = window.pageStreamerRef;
            const tileStreamer = new TileStreamer(
              gridDims,
              pattern,
              pageStreamer,  // PageStreamer instance
              numPages
            );
            tileStreamerRef.current = tileStreamer;
            window.tileStreamerRef = tileStreamer; // Store globally for debugging

            // Expose periodicity analysis function globally
            window.analyzePeriodicityPatterns = () => tileStreamer.analyzePeriodicityPatterns();
            console.log('Tip: Call analyzePeriodicityPatterns() from console to see tile deduplication opportunities');

            // Store grid dimensions globally for viewer recreation
            window.gridPageWidth = pageWidth;
            window.gridPageHeight = pageHeight;
            window.gridSize = gridDims.gridSize;

            // Initialize OpenSeadragon viewer
            const viewer = OSDManager.initialize(tileStreamer, pageWidth, pageHeight, gridDims.gridSize, showNavigator);
            osdViewerRef.current = viewer;
            window.osdViewerRef = viewer; // Store globally for async tile updates
          };

          const initializeViewerWithNavigator = (numPages, pageWidth, pageHeight) => {
            return initializeViewer(numPages, pageWidth, pageHeight, true);
          };

          /**
           * Drag-and-drop handlers
           */
          const handleDragOver = (e) => {
            e.preventDefault();
            e.stopPropagation();
          };

          const handleDrop = async (e) => {
            e.preventDefault();
            e.stopPropagation();

            if (isLoading) return;

            const files = e.dataTransfer.files;
            if (files.length > 0) {
              const file = files[0];
              if (file.type === 'application/pdf') {
                await handleFileUpload({ target: { files: [file] } });
              } else {
                alert('Please drop a PDF file');
              }
            }
          };

          /**
           * Download current PDF to device filesystem
           * Handles different browsers: Chrome (File System API), iOS (Web Share), others (download link)
           */
          const handleDownload = async () => {
            if (!pdfDocRef.current || !currentFilename) {
              alert('No PDF loaded');
              return;
            }

            try {
              const pdf = pdfDocRef.current;
              const data = await pdf.getData();

              // Extract filename from URL or use default
              let filename = currentFilename.replace(/^https?:\/\/.*\//, '') || 'document.pdf';

              // Ensure .pdf extension
              if (!filename.toLowerCase().endsWith('.pdf')) {
                filename += '.pdf';
              }

              // Detect iOS/iPadOS
              // Note: iPadOS 13+ reports as macOS in desktop mode, but still supports touch/share
              const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
              const isIPadOS = (navigator.maxTouchPoints && navigator.maxTouchPoints > 2 && /MacIntel/.test(navigator.platform));
              const isMobileSafari = isIOS || isIPadOS;

              // Try modern File System Access API first (Chrome, Edge, Opera - but not iOS/iPadOS)
              if (!isMobileSafari && window.showSaveFilePicker) {
                try {
                  const handle = await window.showSaveFilePicker({
                    suggestedName: filename,
                    types: [{
                      description: 'PDF Document',
                      accept: { 'application/pdf': ['.pdf'] }
                    }]
                  });

                  const writable = await handle.createWritable();
                  await writable.write(data);
                  await writable.close();

                  console.log(`PDF saved as: ${filename}`);
                  return;
                } catch (error) {
                  if (error.name === 'AbortError') {
                    console.log('Save cancelled by user');
                    return;
                  }
                  // Fall through to next method
                  console.log('File System Access API failed, trying next method');
                }
              }

              // iOS/iPadOS Safari: Use Web Share API (works for saving files on iOS/iPadOS)
              if (isMobileSafari && navigator.share && navigator.canShare) {
                try {
                  const file = new File([data], filename, { type: 'application/pdf' });

                  if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                      files: [file],
                      title: 'Download PDF',
                      text: filename
                    });
                    console.log('PDF shared successfully on iOS');
                    return;
                  }
                } catch (error) {
                  if (error.name === 'AbortError') {
                    console.log('Share cancelled by user');
                    return;
                  }
                  console.log('Web Share API failed, trying fallback');
                }
              }

              // Fallback for desktop Firefox, Safari, and older browsers
              // Create blob with octet-stream to force download behavior
              const blob = new Blob([data], { type: 'application/octet-stream' });

              // Create object URL
              const url = URL.createObjectURL(blob);

              // Create and configure download link
              const a = document.createElement('a');
              a.href = url;
              a.download = filename; // Set filename
              a.target = '_blank'; // Prevent navigation in current tab

              // Important: Must append to DOM for Firefox
              document.body.appendChild(a);

              // Trigger download
              a.click();

              // Cleanup after download starts
              setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
              }, 250);

              console.log(`Download triggered for: ${filename}`);
            } catch (error) {
              console.error('Error downloading PDF:', error);
              alert('Failed to download PDF');
            }
          };

          return (
            <div className="w-full h-full bg-gray-900 flex flex-col">
              {/* Header */}
              <div className="bg-gray-800 border-b border-gray-700 p-2 md:p-3">
                <div className="flex items-center gap-2 max-w-7xl mx-auto">
                  {/* Help Button */}
                  <button
                    onClick={() => setShowHelp(!showHelp)}
                    className="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white rounded cursor-pointer transition-colors text-lg font-bold"
                    title="Help & About"
                  >
                    ?
                  </button>

                  {/* URL Input */}
                  <input
                    type="text"
                    value={urlInput}
                    onChange={(e) => setUrlInput(e.target.value)}
                    onKeyPress={handleUrlKeyPress}
                    onFocus={(e) => e.target.select()}
                    placeholder="Enter PDF URL or choose local file..."
                    className="flex-1 px-2 md:px-3 py-2 bg-gray-700 text-white border border-gray-600 rounded focus:outline-none focus:border-blue-500 text-sm"
                    disabled={isLoading}
                  />
                  <button
                    onClick={handleUrlLoad}
                    disabled={isLoading}
                    className="px-3 md:px-4 py-2 bg-green-600 hover:bg-green-700 active:bg-green-800 text-white rounded cursor-pointer transition-colors disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap text-sm"
                  >
                    <span className="md:hidden">URL</span>
                    <span className="hidden md:inline">Open URL</span>
                  </button>

                  {/* File Upload */}
                  <label className="px-3 md:px-4 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded cursor-pointer transition-colors text-center text-sm whitespace-nowrap">
                    <span className="md:hidden">PDF</span>
                    <span className="hidden md:inline">Local PDF</span>
                    <input
                      type="file"
                      accept="application/pdf"
                      onChange={handleFileUpload}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>

              {/* Viewer Area */}
              <div
                className="flex-1 relative"
                onDragOver={handleDragOver}
                onDrop={handleDrop}
              >
                {/* Help/About Overlay */}
                {showHelp && (
                  <div className="absolute top-0 left-0 right-0 z-20 bg-gray-800 border-b border-gray-700 shadow-lg max-h-full overflow-y-auto">
                    <div className="max-w-4xl mx-auto p-4 md:p-6">
                      <div className="flex justify-between items-start mb-4">
                        <h2 className="text-xl font-bold text-white">PDF Grid Viewer v{CONFIG.VERSION}</h2>
                        <button
                          onClick={() => setShowHelp(false)}
                          className="text-gray-400 hover:text-white text-2xl leading-none"
                          title="Close"
                        >
                          ×
                        </button>
                      </div>

                      <div className="text-gray-300 space-y-4 text-sm md:text-base">
                        <div>
                          <p>By <a href="https://www.jessehiemstra.com" className="text-blue-400 hover:text-blue-300 underline" onClick={() => setShowHelp(false)}>Jesse Hiemstra</a></p>
                        </div>

                        <div>
                          <p>This tool displays the pages of a PDF in a repeating staggered grid; advancing both horizontally (like a book) and vertically (like a scroll).
                          Adjacent pages in orthogonal directions are sequential neighbors, transforming a one-dimensional stream of pages into a continuous two-dimensional space.
                          Zooming out shows the whole at once, where structure and patterns emerge.</p>
                        </div>

                        <div>
                          <h3 className="font-semibold text-white mb-2">Loading Data</h3>
                          <p>A demo PDF may already be loaded. <br /> Try inspecting something big, like a <a href="?url=https://ia800503.us.archive.org/22/items/PopularMechanics1950/Popular_Mechanics_10_1950.pdf" className="text-blue-400 hover:text-blue-300 underline" onClick={() => setShowHelp(false)}>magazine</a>, <a href="?url=https://dn790003.ca.archive.org/0/items/the-unwritten-laws-of-engineering/The%20Unwritten%20Laws%20of%20Engineering.pdf" className="text-blue-400 hover:text-blue-300 underline" onClick={() => setShowHelp(false)}>book</a>, or <a href="?url=https://utoronto.scholaris.ca/server/api/core/bitstreams/d72537ff-052e-4d5a-b9db-0a63438e8d4e/content" className="text-blue-400 hover:text-blue-300 underline" onClick={() => setShowHelp(false)}>academic publication</a>!</p>
                          <ul className="list-disc list-inside space-y-1">
                            <li><strong>From URL:</strong> Enter a URL and click "Open URL" (or press Enter).</li>
                            <li><strong>Remote Parameter:</strong> Add <code className="bg-gray-700 px-1 rounded">?url=https://example.com/file.pdf</code> to the page URL.</li>
                            <li><strong>Drag-and-Drop:</strong> Drag a PDF file from your computer onto the viewer.</li>
                            <li><strong>Local File:</strong> Click "Local PDF" to choose a file from your device.</li>
                            <li><strong>Local Parameter:</strong> Add <code className="bg-gray-700 px-1 rounded">?pdf=file.pdf</code> to the page URL.</li>

                          </ul>
                        </div>

                        <div>
                          <h3 className="font-semibold text-white mb-2">Controls</h3>
                          <ul className="list-disc list-inside space-y-1">
                            <li><strong>Pan:</strong> Click and drag to move around.</li>
                            <li><strong>Zoom:</strong> Scroll wheel or pinch to zoom in/out.</li>
                            <li><strong>Home:</strong> Click the home button (top-right) to reset view.</li>
                            <li><strong>Fullscreen:</strong> Click the fullscreen button for immersive viewing.</li>
                          </ul>
                        </div>

                        {pdfFile && (
                          <div className="pt-2 border-t border-gray-700">
                            <button
                              onClick={handleDownload}
                              className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded transition-colors"
                            >
                              Download PDF
                            </button>
                          </div>
                        )}

                        <div>

                          <p>The code for this tool resides in a single HTML file that calls external libraries. While it is not suited for production, it may be downloaded and run on a local machine, or any web server. Please attribute me if reproduced; I believe the idea is somewhat novel.</p>
                        </div>

                        <div className="text-xs text-gray-400 pt-2 border-t border-gray-700">
                          <p>Built with Claude Code using PDF.js, OpenSeadragon, React, and Tailwind CSS.</p>
                          <p className="mt-1">
                            <a
                              href="https://github.com/ginger-pickles/PDF-grid"
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-blue-400 hover:text-blue-300 underline"
                            >
                              View on GitHub
                            </a>
                          </p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {!pdfFile ? (
                  <div className="absolute inset-0 flex items-center justify-center">
                    <div className="text-center text-gray-400">
                      <svg className="w-24 h-24 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                      </svg>
                      <p className="text-lg">Drag & drop a PDF to get started</p>
                      <p className="text-sm mt-2">Pages will appear in a rotating grid pattern; zoom out to see the whole at once.</p>
                      <p className="text-sm mt-2">Local files are stored locally and not uploaded to any server. View page source code to verify.</p>
                      <p className="text-sm mt-2">This app is a single HTML file. Save it to your device and open to run "offline." <i>Serve</i> it from your device for improved functionality, such as auto-loading files with ?pdf parameter.</p>
                      </div>
                  </div>
                ) : null}
                
                {isLoading && (
                  <div className="absolute inset-0 flex items-center justify-center bg-gray-900 z-10">
                    <div className="text-center">
                      <div className="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-600 border-t-blue-500 mb-4"></div>
                      <p className="text-white mb-4">{loadingStatus}</p>
                      <button
                        onClick={handleStopLoading}
                        className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded transition-colors"
                      >
                        Stop
                      </button>
                    </div>
                  </div>
                )}
                
                <div
                  id="openseadragon-viewer"
                  ref={viewerRef}
                  className="w-full h-full"
                  style={{ display: pdfFile ? 'block' : 'none' }}
                />
              </div>

            </div>
          );
        };

        ReactDOM.render(<PDFGridViewer />, document.getElementById('root'));
    </script>
</body>
</html>
