<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PDF Grid Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --vh: 1vh;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
        }
        #root {
            width: 100%;
            height: 100%;
        }
        /* Prevent iOS Safari from bouncing */
        body, #root {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }
        /* Navigator sizing - responsive */
        .navigator {
            max-width: 25vw !important;
            max-height: 25vw !important;
            width: 200px !important;
            height: 200px !important;
        }
        @media (min-width: 768px) {
            .navigator {
                width: 200px !important;
                height: 200px !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // ============================================================================
        // CONFIGURATION
        // ============================================================================

        const CONFIG = {
          // Version
          VERSION: '1.5.1',

          // Debug
          DEBUG_MODE: false, // Enable verbose logging and detailed error messages

          // Auto-load
          AUTO_LOAD_PDF: 'demo.pdf', // Set to null to disable auto-load, or filename to try loading

          // CORS Proxy for external PDFs
          // Use when loading PDFs from servers that don't send CORS headers
          // Options: null (disabled), 'https://corsproxy.io/?', 'https://api.allorigins.win/raw?url='
          CORS_PROXY: 'https://corsproxy.io/?',

          // PDF Rendering
          PDF_RENDER_SCALE: 2.0,

          // Grid Layout
          GRID_SPACING_RATIO: 0.01, // Spacing as ratio of page width

          // Tile System
          DEFAULT_TILE_SIZE: 512,
          MIN_TILE_SIZE: 512,
          TILE_SIZE_MULTIPLIER: 256,
          TILE_JPEG_QUALITY: 0.85,

          // Caching
          MAX_CACHE_SIZE: 300,

          // Performance
          RENDER_BATCH_SIZE: 5, // Yield to browser every N pages
          TILE_REFRESH_INTERVAL: 3, // Refresh tiles every N pages during loading

          // OpenSeadragon
          OSD_MIN_ZOOM: null, // Let minZoomImageRatio control minimum zoom
          OSD_MAX_ZOOM: 100, // Allow very deep zoom into page details
          OSD_MAX_ZOOM_PIXEL_RATIO: 8.0, // Allow zoom to 8x the original pixel resolution (quarter-page or smaller)
          OSD_VISIBILITY_RATIO: 0.9, // 90% of grid must remain visible (allows limited panning beyond edges when zoomed in)

          // Storage
          STORAGE_EXPIRY_DAYS: 7, // Auto-delete stored local PDFs after N days

          // UI
          BACKGROUND_COLOR: '#1f2937'
        };

        // ============================================================================
        // ERROR CODES
        // ============================================================================

        const ErrorCodes = {
          // File errors
          INVALID_FILE: 'INVALID_FILE',
          FILE_READ_ERROR: 'FILE_READ_ERROR',

          // Network errors
          NETWORK_ERROR: 'NETWORK_ERROR',
          CORS_ERROR: 'CORS_ERROR',
          FETCH_ERROR: 'FETCH_ERROR',

          // PDF errors
          PDF_PARSE_ERROR: 'PDF_PARSE_ERROR',
          PDF_RENDER_ERROR: 'PDF_RENDER_ERROR',
          INVALID_PDF: 'INVALID_PDF',

          // Storage errors
          STORAGE_QUOTA_ERROR: 'STORAGE_QUOTA_ERROR',
          STORAGE_READ_ERROR: 'STORAGE_READ_ERROR',
          STORAGE_WRITE_ERROR: 'STORAGE_WRITE_ERROR',

          // Viewer errors
          VIEWER_INIT_ERROR: 'VIEWER_INIT_ERROR',

          // Unknown
          UNKNOWN_ERROR: 'UNKNOWN_ERROR'
        };

        // Debug logging helper
        const debug = (...args) => {
          if (CONFIG.DEBUG_MODE) {
            console.log('[DEBUG]', ...args);
          }
        };

        // ============================================================================
        // PDF UTILITIES MODULE
        // ============================================================================

        const PDFUtils = {
          /**
           * Initialize PDF.js worker
           */
          initWorker() {
            pdfjsLib.GlobalWorkerOptions.workerSrc =
              'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          },

          /**
           * Load PDF from file
           */
          async loadPDFFromFile(file) {
            if (!file || file.type !== 'application/pdf') {
              throw new Error('Invalid file type. Please provide a PDF file.');
            }

            const arrayBuffer = await file.arrayBuffer();
            return await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          },

          /**
           * Load PDF from URL
           * Let PDF.js handle the fetch directly for better CORS handling
           */
          async loadPDFFromURL(url) {
            // Apply CORS proxy if configured and URL is external
            if (CONFIG.CORS_PROXY && this._isExternalURL(url)) {
              const proxiedUrl = CONFIG.CORS_PROXY + encodeURIComponent(url);
              console.log(`Using CORS proxy: ${proxiedUrl}`);

              // Fetch via proxy and get binary data
              const response = await fetch(proxiedUrl);
              if (!response.ok) {
                throw new Error(`Failed to fetch PDF via proxy: ${response.status} ${response.statusText}`);
              }

              const arrayBuffer = await response.arrayBuffer();
              return await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            }

            // For non-external URLs, let PDF.js handle it directly
            return await pdfjsLib.getDocument({ url: url }).promise;
          },

          /**
           * Check if URL is external (cross-origin)
           */
          _isExternalURL(url) {
            // Relative URLs are not external
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
              return false;
            }

            try {
              const urlObj = new URL(url);
              return urlObj.origin !== window.location.origin;
            } catch (e) {
              return false;
            }
          },

          /**
           * Render a single PDF page to canvas
           */
          async renderPageToCanvas(page, scale = CONFIG.PDF_RENDER_SCALE) {
            const viewport = page.getViewport({ scale });

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({
              canvasContext: context,
              viewport: viewport
            }).promise;

            return canvas;
          },

          /**
           * Render all pages of a PDF document
           */
          async renderAllPages(pdf, onProgress) {
            const pageCanvases = [];

            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const canvas = await this.renderPageToCanvas(page);
              pageCanvases.push(canvas);

              if (onProgress) {
                onProgress(i, pdf.numPages);
              }

              // Yield to browser occasionally
              if (i % CONFIG.RENDER_BATCH_SIZE === 0) {
                await new Promise(resolve => setTimeout(resolve, 0));
              }
            }

            return pageCanvases;
          }
        };

        // ============================================================================
        // GRID PATTERN MODULE
        // ============================================================================

        const GridPattern = {
          /**
           * Generate rotating grid pattern
           * For N pages, creates N×N grid where each row rotates the sequence
           */
          generate(totalPages, cols) {
            const pattern = [];
            const rows = totalPages; // N×N grid

            for (let row = 0; row < rows; row++) {
              const rowPages = [];
              for (let col = 0; col < cols; col++) {
                // Rotating pattern: each row starts at (row) offset from page 1
                const pageIndex = ((row + col) % totalPages);
                rowPages.push(pageIndex + 1); // Pages are 1-indexed
              }
              pattern.push(rowPages);
            }

            return pattern;
          },

          /**
           * Calculate grid dimensions
           */
          calculateDimensions(numPages, pageWidth, pageHeight) {
            const gridSize = numPages;
            const spacing = Math.floor(pageWidth * CONFIG.GRID_SPACING_RATIO);

            const totalWidth = gridSize * pageWidth + (gridSize - 1) * spacing;
            const totalHeight = gridSize * pageHeight + (gridSize - 1) * spacing;

            return {
              gridSize,
              spacing,
              totalWidth,
              totalHeight,
              pageWidth,
              pageHeight
            };
          }
        };

        // ============================================================================
        // URL AND HISTORY MANAGER MODULE
        // ============================================================================

        /**
         * Manages URL parameters and browser history for PDF loading
         */
        const URLManager = {
          /**
           * Parse current URL parameters
           * @returns {{url: string|null, pdf: string|null}}
           */
          getParams() {
            const params = new URLSearchParams(window.location.search);
            return {
              url: params.get('url'),
              pdf: params.get('pdf') ? decodeURIComponent(params.get('pdf')) : null
            };
          },

          /**
           * Generate URL string for given type and value
           * @param {string} type - 'url', 'pdf', or 'clear'
           * @param {string} value - Parameter value
           * @returns {string} Generated URL
           */
          buildURL(type, value) {
            const base = window.location.pathname;

            if (type === 'clear' || !value) {
              return base;
            }

            if (type === 'url') {
              return `${base}?url=${encodeURIComponent(value)}`;
            }

            if (type === 'pdf') {
              return `${base}?pdf=${encodeURIComponent(value)}`;
            }

            return base;
          },

          /**
           * Push new state to browser history
           * @param {string} type - 'url' or 'pdf'
           * @param {string} value - Parameter value
           */
          pushState(type, value) {
            const newUrl = this.buildURL(type, value);
            const state = { type, value };

            debug('URLManager.pushState:', { type, value, newUrl });
            window.history.pushState(state, '', newUrl);
          },

          /**
           * Replace current history state
           * @param {string} type - 'url', 'pdf', or 'clear'
           * @param {string} value - Parameter value
           */
          replaceState(type, value) {
            const newUrl = this.buildURL(type, value);
            const state = type === 'clear' ? {} : { type, value };

            debug('URLManager.replaceState:', { type, value, newUrl });
            window.history.replaceState(state, '', newUrl);
          },

          /**
           * Clear URL parameters
           */
          clear() {
            this.replaceState('clear', null);
          }
        };

        // ============================================================================
        // TILE CACHE MODULE
        // ============================================================================

        /**
         * Simple FIFO cache optimized for static content (PDF tiles)
         * Uses single Map lookup per get() for maximum performance
         */
        class TileCache {
          constructor(maxSize = CONFIG.MAX_CACHE_SIZE) {
            this.cache = new Map();
            this.maxSize = maxSize;
          }

          get(key) {
            // Single Map lookup - no reorganization needed
            return this.cache.get(key) || null;
          }

          set(key, value) {
            // Only evict if cache is full and key doesn't exist
            if (this.cache.size >= this.maxSize && !this.cache.has(key)) {
              // Remove oldest entry (first in Map)
              const firstKey = this.cache.keys().next().value;
              this.cache.delete(firstKey);
            }
            this.cache.set(key, value);
          }

          has(key) {
            return this.cache.has(key);
          }

          size() {
            return this.cache.size;
          }

          clear() {
            this.cache.clear();
          }
        }

        // ============================================================================
        // PDF STORAGE MODULE
        // ============================================================================

        /**
         * Hybrid storage for local PDF persistence across page refreshes
         * Uses sessionStorage (clears on tab close) with IndexedDB fallback (for large files)
         */
        const PDFStorage = {
          STORAGE_KEY: 'pdf-grid-viewer-pdf',
          DB_NAME: 'pdf-grid-viewer',
          DB_VERSION: 1,
          STORE_NAME: 'pdfs',

          /**
           * Save PDF to storage (try sessionStorage first, fall back to IndexedDB)
           */
          async save(pdfData, filename) {
            const data = {
              pdfData: Array.from(new Uint8Array(pdfData)), // Convert to array for JSON
              filename: filename,
              timestamp: Date.now()
            };

            // Try sessionStorage first (auto-clears on tab close)
            try {
              sessionStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
              console.log('Saved PDF to sessionStorage:', filename);
              return;
            } catch (e) {
              // Quota exceeded or other error - fall back to IndexedDB
              console.log('sessionStorage failed, using IndexedDB:', e.message);
            }

            // Fall back to IndexedDB for large files
            try {
              await this._saveToIndexedDB(data);
              console.log('Saved PDF to IndexedDB:', filename);
            } catch (e) {
              console.error('Failed to save PDF to storage:', e);
            }
          },

          /**
           * Load PDF from storage (check sessionStorage first, then IndexedDB)
           */
          async load() {
            const expiryMs = CONFIG.STORAGE_EXPIRY_DAYS * 24 * 60 * 60 * 1000;

            // Try sessionStorage first
            try {
              const item = sessionStorage.getItem(this.STORAGE_KEY);
              if (item) {
                const data = JSON.parse(item);
                if (this._isValid(data, expiryMs)) {
                  console.log('Loaded PDF from sessionStorage:', data.filename);
                  return {
                    pdfData: new Uint8Array(data.pdfData).buffer,
                    filename: data.filename
                  };
                } else {
                  // Expired - clear it
                  sessionStorage.removeItem(this.STORAGE_KEY);
                }
              }
            } catch (e) {
              console.error('Error reading sessionStorage:', e);
            }

            // Try IndexedDB
            try {
              const data = await this._loadFromIndexedDB();
              if (data && this._isValid(data, expiryMs)) {
                console.log('Loaded PDF from IndexedDB:', data.filename);
                return {
                  pdfData: new Uint8Array(data.pdfData).buffer,
                  filename: data.filename
                };
              } else if (data) {
                // Expired - clear it
                await this._deleteFromIndexedDB();
              }
            } catch (e) {
              console.error('Error reading IndexedDB:', e);
            }

            return null;
          },

          /**
           * Clear all stored PDFs
           */
          async clear() {
            try {
              sessionStorage.removeItem(this.STORAGE_KEY);
            } catch (e) {
              console.error('Error clearing sessionStorage:', e);
            }

            try {
              await this._deleteFromIndexedDB();
            } catch (e) {
              console.error('Error clearing IndexedDB:', e);
            }

            console.log('Cleared all stored PDFs');
          },

          /**
           * Check if stored data is valid and not expired
           */
          _isValid(data, expiryMs) {
            if (!data || !data.pdfData || !data.filename || !data.timestamp) {
              return false;
            }
            const age = Date.now() - data.timestamp;
            return age < expiryMs;
          },

          /**
           * Save to IndexedDB
           */
          async _saveToIndexedDB(data) {
            const db = await this._openDB();
            return new Promise((resolve, reject) => {
              const tx = db.transaction(this.STORE_NAME, 'readwrite');
              const store = tx.objectStore(this.STORE_NAME);
              const request = store.put(data, this.STORAGE_KEY);
              request.onsuccess = () => resolve();
              request.onerror = () => reject(request.error);
            });
          },

          /**
           * Load from IndexedDB
           */
          async _loadFromIndexedDB() {
            try {
              const db = await this._openDB();
              return new Promise((resolve, reject) => {
                const tx = db.transaction(this.STORE_NAME, 'readonly');
                const store = tx.objectStore(this.STORE_NAME);
                const request = store.get(this.STORAGE_KEY);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });
            } catch (e) {
              // DB might not exist yet
              return null;
            }
          },

          /**
           * Delete from IndexedDB
           */
          async _deleteFromIndexedDB() {
            try {
              const db = await this._openDB();
              return new Promise((resolve, reject) => {
                const tx = db.transaction(this.STORE_NAME, 'readwrite');
                const store = tx.objectStore(this.STORE_NAME);
                const request = store.delete(this.STORAGE_KEY);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
              });
            } catch (e) {
              // DB might not exist yet - that's okay
              return;
            }
          },

          /**
           * Open IndexedDB connection
           */
          async _openDB() {
            return new Promise((resolve, reject) => {
              const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);
              request.onerror = () => reject(request.error);
              request.onsuccess = () => resolve(request.result);
              request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(this.STORE_NAME)) {
                  db.createObjectStore(this.STORE_NAME);
                }
              };
            });
          }
        };

        // ============================================================================
        // TILE SOURCE MODULE
        // ============================================================================

        class CustomTileSource {
          constructor(gridDims, pattern, pageCanvases, numPages) {
            this.gridDims = gridDims;
            this.pattern = pattern;
            this.pageCanvases = pageCanvases;
            this.numPages = numPages;
            this.cache = new TileCache();

            // Calculate tile parameters
            this.tileSize = Math.max(
              CONFIG.MIN_TILE_SIZE,
              Math.ceil(Math.max(gridDims.pageWidth, gridDims.pageHeight) / CONFIG.TILE_SIZE_MULTIPLIER) * CONFIG.TILE_SIZE_MULTIPLIER
            );

            const maxDimension = Math.max(gridDims.totalWidth, gridDims.totalHeight);
            this.maxLevel = Math.ceil(Math.log2(maxDimension / this.tileSize));

            // Create reusable tile canvas
            this.tileCanvas = document.createElement('canvas');
            this.tileCanvas.width = this.tileSize;
            this.tileCanvas.height = this.tileSize;
            this.tileCtx = this.tileCanvas.getContext('2d', { alpha: false });

            console.log(`Tile size: ${this.tileSize}, Max level: ${this.maxLevel}`);
          }

          /**
           * Get OpenSeadragon tile source configuration
           */
          getOSDConfig() {
            return {
              height: this.gridDims.totalHeight,
              width: this.gridDims.totalWidth,
              tileSize: this.tileSize,
              minLevel: 0,
              maxLevel: this.maxLevel,
              getTileUrl: this.generateTile.bind(this)
            };
          }

          /**
           * Generate a tile at specified level and coordinates
           */
          generateTile(level, x, y) {
            const key = `${level}_${x}_${y}`;

            // Only cache if all pages are loaded
            const allPagesLoaded = this.pageCanvases.length >= this.numPages;

            // Check cache (single lookup, no redundant has() call)
            if (allPagesLoaded) {
              const cached = this.cache.get(key);
              if (cached) {
                return cached;
              }
            }

            // Generate tile
            const scale = Math.pow(2, level - this.maxLevel);
            const tileUrl = this._renderTile(level, x, y, scale, key);

            // Cache if all pages loaded
            if (allPagesLoaded) {
              this.cache.set(key, tileUrl);
            }

            return tileUrl;
          }

          /**
           * Render tile content
           */
          _renderTile(level, x, y, scale, key) {
            const { totalWidth, totalHeight, pageWidth, pageHeight, spacing, gridSize } = this.gridDims;

            // Calculate tile boundaries in full-resolution grid coordinates
            const tileLeft = x * this.tileSize / scale;
            const tileTop = y * this.tileSize / scale;
            const tileRight = Math.min(tileLeft + this.tileSize / scale, totalWidth);
            const tileBottom = Math.min(tileTop + this.tileSize / scale, totalHeight);

            // Debug first few tiles
            if (this.cache.size() < 3) {
              console.log(`\nGenerating tile ${key}:`);
              console.log(`  Bounds: (${tileLeft.toFixed(0)}, ${tileTop.toFixed(0)}) to (${tileRight.toFixed(0)}, ${tileBottom.toFixed(0)})`);
              console.log(`  Scale: ${scale.toFixed(4)}, Level: ${level}`);
            }

            // Clear tile with background color
            this.tileCtx.fillStyle = CONFIG.BACKGROUND_COLOR;
            this.tileCtx.fillRect(0, 0, this.tileSize, this.tileSize);

            let pagesDrawn = 0;

            // Draw portions of pages that intersect this tile
            for (let row = 0; row < gridSize; row++) {
              for (let col = 0; col < gridSize; col++) {
                if (this._drawPageIntersection(row, col, tileLeft, tileTop, tileRight, tileBottom, scale, key)) {
                  pagesDrawn++;
                }
              }
            }

            if (this.cache.size() < 5) {
              console.log(`  Drew ${pagesDrawn} page(s) in tile ${key}`);
            }

            // Convert to data URL
            return this.tileCanvas.toDataURL('image/jpeg', CONFIG.TILE_JPEG_QUALITY);
          }

          /**
           * Draw page intersection with tile
           */
          _drawPageIntersection(row, col, tileLeft, tileTop, tileRight, tileBottom, scale, debugKey) {
            const { pageWidth, pageHeight, spacing } = this.gridDims;

            // Calculate page position in grid
            const pageLeft = col * (pageWidth + spacing);
            const pageTop = row * (pageHeight + spacing);
            const pageRight = pageLeft + pageWidth;
            const pageBottom = pageTop + pageHeight;

            // Check intersection
            if (pageRight <= tileLeft || pageLeft >= tileRight ||
                pageBottom <= tileTop || pageTop >= tileBottom) {
              return false;
            }

            // Get page canvas
            const pageNum = this.pattern[row][col];
            const pageCanvas = this.pageCanvases[pageNum - 1];

            if (this.cache.size() < 3) {
              console.log(`  Grid(${row},${col}): Page ${pageNum} at (${pageLeft.toFixed(0)},${pageTop.toFixed(0)}) - ${pageCanvas ? 'LOADED' : 'not loaded'}`);
            }

            if (!pageCanvas) {
              return false;
            }

            // Calculate intersection rectangle
            const intersectLeft = Math.max(tileLeft, pageLeft);
            const intersectTop = Math.max(tileTop, pageTop);
            const intersectRight = Math.min(tileRight, pageRight);
            const intersectBottom = Math.min(tileBottom, pageBottom);

            // Source coordinates (within the page)
            const srcX = intersectLeft - pageLeft;
            const srcY = intersectTop - pageTop;
            const srcW = intersectRight - intersectLeft;
            const srcH = intersectBottom - intersectTop;

            // Destination coordinates (within the tile)
            const destX = (intersectLeft - tileLeft) * scale;
            const destY = (intersectTop - tileTop) * scale;
            const destW = srcW * scale;
            const destH = srcH * scale;

            // Draw
            this.tileCtx.drawImage(
              pageCanvas,
              srcX, srcY, srcW, srcH,
              destX, destY, destW, destH
            );

            return true;
          }
        }

        // ============================================================================
        // OPENSEADRAGON MANAGER MODULE
        // ============================================================================

        const OSDManager = {
          /**
           * Initialize OpenSeadragon viewer
           */
          initialize(tileSource, pageWidth, pageHeight, gridSize) {
            // Calculate minZoomImageRatio based on grid size
            // Small grids: 0.95 (tight constraint with 5% margins)
            // Large grids: scales down to allow zooming in to individual pages
            // Formula: max(0.05, min(0.95, 10 / gridSize))
            const minZoomImageRatio = Math.max(0.05, Math.min(0.95, 10 / gridSize));

            console.log(`Grid size: ${gridSize}×${gridSize}, minZoomImageRatio: ${minZoomImageRatio.toFixed(3)}`);

            const viewerConfig = {
              id: 'openseadragon-viewer',
              prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/',
              tileSources: tileSource.getOSDConfig(),
              showNavigator: true,
              navigatorPosition: 'TOP_RIGHT',
              showRotationControl: false, // Hide rotation buttons
              showZoomControl: false, // Hide zoom in/out buttons
              showHomeControl: true, // Keep home button
              showFullPageControl: true, // Keep fullscreen button
              maxZoomLevel: CONFIG.OSD_MAX_ZOOM,
              maxZoomPixelRatio: CONFIG.OSD_MAX_ZOOM_PIXEL_RATIO,
              minZoomImageRatio: minZoomImageRatio, // Dynamically calculated based on grid size
              visibilityRatio: CONFIG.OSD_VISIBILITY_RATIO,
              constrainDuringPan: false, // Allow panning beyond bounds when zoomed in
              homeFillsViewer: false,
              immediateRender: true,
              preload: true
            };

            // Only set minZoomLevel if specified
            if (CONFIG.OSD_MIN_ZOOM !== null) {
              viewerConfig.minZoomLevel = CONFIG.OSD_MIN_ZOOM;
            }

            const viewer = OpenSeadragon(viewerConfig);

            // Set initial view to first page
            viewer.addHandler('open', function() {
              const viewportRect = viewer.viewport.imageToViewportRectangle(
                0, 0, pageWidth, pageHeight
              );
              viewer.viewport.fitBounds(viewportRect, true);
            });

            return viewer;
          }
        };

        // ============================================================================
        // MAIN COMPONENT
        // ============================================================================

        const PDFGridViewer = () => {
          const [pdfFile, setPdfFile] = useState(null);
          const [numPages, setNumPages] = useState(0);
          const [isLoading, setIsLoading] = useState(false);
          const [loadingStatus, setLoadingStatus] = useState('');
          const [pagesLoaded, setPagesLoaded] = useState(0);
          const [urlInput, setUrlInput] = useState('');
          const [showHelp, setShowHelp] = useState(false);
          const [currentFilename, setCurrentFilename] = useState('');
          const viewerRef = useRef(null);
          const osdViewerRef = useRef(null);
          const pageCanvasesRef = useRef([]);
          const pdfDocRef = useRef(null);
          const tileSourceRef = useRef(null);

          // Initialize PDF.js worker on mount
          React.useEffect(() => {
            PDFUtils.initWorker();
          }, []);

          // Fix iOS Safari viewport height
          React.useEffect(() => {
            const setVH = () => {
              const vh = window.innerHeight * 0.01;
              document.documentElement.style.setProperty('--vh', `${vh}px`);
            };

            setVH();
            window.addEventListener('resize', setVH);
            window.addEventListener('orientationchange', setVH);

            return () => {
              window.removeEventListener('resize', setVH);
              window.removeEventListener('orientationchange', setVH);
            };
          }, []);

          // Auto-load PDF on mount (priority: URL parameter > stored PDF > config)
          React.useEffect(() => {
            const autoLoadPDF = async () => {
              // Check URL parameters first (highest priority)
              const { url: urlParam, pdf: pdfParam } = URLManager.getParams();

              // Priority 1: ?url= parameter (remote URL)
              if (urlParam) {
                try {
                  console.log(`Loading PDF from URL parameter: ${urlParam}`);
                  await loadPDFFromURL(urlParam, true); // skipHistory=true to avoid double-pushing
                  return;
                } catch (error) {
                  console.error(`Failed to load PDF from URL parameter: ${error.message}`);
                  alert(`Failed to load PDF from URL: ${error.message}`);
                  return;
                }
              }

              // Priority 2: ?pdf= parameter (local file from storage or server)
              if (pdfParam) {
                const pdfFilename = decodeURIComponent(pdfParam);

                // First try loading from storage
                try {
                  const stored = await PDFStorage.load();
                  if (stored && stored.filename === pdfFilename) {
                    console.log(`Loading local PDF from storage: ${pdfFilename}`);
                    setIsLoading(true);
                    setLoadingStatus('Loading stored PDF...');
                    setPdfFile({ name: stored.filename });
                    setUrlInput(stored.filename);

                    const pdf = await pdfjsLib.getDocument({ data: stored.pdfData }).promise;
                    await loadPDF(pdf, stored.filename);
                    return;
                  }
                } catch (error) {
                  console.error(`Failed to load from storage:`, error);
                }

                // If not in storage, try fetching from server (only works when served via HTTP)
                if (window.location.protocol !== 'file:') {
                  try {
                    console.log(`PDF not in storage, attempting to fetch from server: ${pdfFilename}`);
                    await loadPDFFromURL(pdfFilename, true); // Load relative path, skipHistory=true
                    return;
                  } catch (error) {
                    console.error(`Failed to fetch PDF from server: ${error.message}`);
                    alert(`PDF "${pdfFilename}" not found in storage or on server.`);
                    // Fall through to next priority
                  }
                } else {
                  console.log(`PDF "${pdfFilename}" not in storage, and file:// protocol prevents server fetch`);
                  // Fall through to next priority
                }
              }

              // Priority 3: Stored local PDF (no parameter, just from storage)
              if (!urlParam && !pdfParam) {
                try {
                  const stored = await PDFStorage.load();
                  if (stored) {
                    console.log(`Loading stored PDF from previous session: ${stored.filename}`);
                    setIsLoading(true);
                    setLoadingStatus('Loading stored PDF...');
                    setPdfFile({ name: stored.filename });
                    setUrlInput(stored.filename);

                    // Add ?pdf= parameter to URL
                    URLManager.replaceState('pdf', stored.filename);

                    const pdf = await pdfjsLib.getDocument({ data: stored.pdfData }).promise;
                    await loadPDF(pdf, stored.filename);
                    return;
                  }
                } catch (error) {
                  console.error(`Failed to load stored PDF:`, error);
                  setIsLoading(false);
                  // Show error and clear bad storage
                  alert(`Failed to restore stored PDF: ${error.message}\n\nClearing storage and showing demo.`);
                  await PDFStorage.clear();
                  // Continue to config auto-load
                }
              }

              // Fall back to config auto-load (lowest priority)
              if (!CONFIG.AUTO_LOAD_PDF) return;

              // Skip auto-load for file:// protocol (browser security restrictions)
              if (window.location.protocol === 'file:') {
                console.log('Auto-load disabled for file:// protocol. Please serve via HTTP (e.g., python -m http.server) to use auto-load, or drag & drop a PDF to get started.');
                return;
              }

              try {
                console.log(`Attempting to auto-load: ${CONFIG.AUTO_LOAD_PDF}`);
                await loadPDFFromURL(CONFIG.AUTO_LOAD_PDF);
              } catch (error) {
                console.log(`Auto-load failed (${error.message}). Waiting for manual upload.`);
                // Silently fail - user can upload manually
              }
            };

            autoLoadPDF();
          }, []);

          // Handle browser back/forward navigation
          React.useEffect(() => {
            const handlePopState = async (event) => {
              console.log('Popstate event:', event.state);

              // Parse URL parameters
              const { url: urlParam, pdf: pdfParam } = URLManager.getParams();

              if (urlParam) {
                // Navigate to URL
                console.log(`Back/forward: Loading URL ${urlParam}`);
                await loadPDFFromURL(urlParam, true); // skipHistory=true
              } else if (pdfParam) {
                // Navigate to local PDF
                console.log(`Back/forward: Loading local PDF ${pdfParam}`);
                try {
                  const stored = await PDFStorage.load();
                  if (stored && stored.filename === decodeURIComponent(pdfParam)) {
                    setIsLoading(true);
                    setLoadingStatus('Loading PDF...');
                    setPdfFile({ name: stored.filename });
                    setUrlInput(stored.filename);

                    const pdf = await pdfjsLib.getDocument({ data: stored.pdfData }).promise;
                    await loadPDF(pdf, stored.filename);
                  } else {
                    alert(`PDF "${pdfParam}" not found in storage. It may have expired.`);
                  }
                } catch (error) {
                  console.error('Error loading PDF from history:', error);
                  alert(`Failed to load PDF: ${error.message}`);
                }
              }
            };

            window.addEventListener('popstate', handlePopState);
            return () => window.removeEventListener('popstate', handlePopState);
          }, []);

          /**
           * Common PDF loading logic for both file upload and URL loading
           */
          const loadPDF = async (pdf, filename = 'PDF') => {
            setNumPages(pdf.numPages);
            pdfDocRef.current = pdf;
            setCurrentFilename(filename);

            // Update page title - extract filename from URL if needed
            const displayName = filename.startsWith('http://') || filename.startsWith('https://')
              ? decodeURIComponent(filename.split('/').pop() || 'PDF')
              : filename;
            document.title = `${displayName} - PDF Grid Viewer`;

            console.log(`[v${CONFIG.VERSION}] Loaded ${filename} with ${pdf.numPages} pages`);

            // Render all pages
            setLoadingStatus('Rendering all pages...');
            const pageCanvases = await PDFUtils.renderAllPages(pdf, (current, total) => {
              setPagesLoaded(current);
              setLoadingStatus(`Rendering page ${current}/${total}...`);
            });

            pageCanvasesRef.current = pageCanvases;

            const pageWidth = pageCanvases[0].width;
            const pageHeight = pageCanvases[0].height;

            console.log(`All ${pdf.numPages} pages rendered: ${pageWidth}x${pageHeight}`);

            // Initialize viewer
            setLoadingStatus('Initializing viewer...');
            initializeViewer(pdf.numPages, pageWidth, pageHeight);

            setLoadingStatus('');
            setIsLoading(false);
          };

          const loadPDFFromURL = async (url, skipHistory = false) => {
            setIsLoading(true);
            setLoadingStatus('Loading PDF...');
            setPdfFile({ name: url }); // Store URL as "file" for display

            // Clear any stored local PDFs when loading from URL
            await PDFStorage.clear();

            // Add ?url= parameter to URL for browser history and refresh (unless loading from history)
            if (!skipHistory && (url.startsWith('http://') || url.startsWith('https://'))) {
              URLManager.pushState('url', url);
            }

            try {
              const pdf = await PDFUtils.loadPDFFromURL(url);
              await loadPDF(pdf, url);
              // Only display URL in field if it's an actual URL (not a local filename like demo.pdf)
              if (url.startsWith('http://') || url.startsWith('https://')) {
                setUrlInput(url);
              }
            } catch (error) {
              console.error('Error loading PDF from URL:', error);
              setIsLoading(false);
              setPdfFile(null); // Clear pdfFile to show instruction screen
              setLoadingStatus('');
              throw error; // Re-throw for auto-load handler
            }
          };

          const handleFileUpload = async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            setIsLoading(true);
            setLoadingStatus('Loading PDF...');
            setPdfFile(file);
            setUrlInput(file.name); // Show filename in URL bar

            // Add ?pdf= parameter to URL for browser history and refresh
            URLManager.pushState('pdf', file.name);

            try {
              // Read file as ArrayBuffer for storage
              const fileData = await file.arrayBuffer();

              const pdf = await PDFUtils.loadPDFFromFile(file);
              await loadPDF(pdf, file.name);

              // Save to storage for persistence across refreshes
              await PDFStorage.save(fileData, file.name);
            } catch (error) {
              console.error('Error loading PDF:', error);
              alert('Error loading PDF: ' + error.message);
              setIsLoading(false);
            }
          };

          const handleUrlLoad = async () => {
            const url = urlInput.trim();
            if (!url) {
              alert('Please enter a URL');
              return;
            }

            // Validate URL format
            if (!url.startsWith('http://') && !url.startsWith('https://') && !url.endsWith('.pdf')) {
              alert('Please enter a valid URL starting with http:// or https://\n\nExample: https://example.com/document.pdf');
              return;
            }

            // Check if URL looks like a PDF
            const urlLower = url.toLowerCase();
            if (!urlLower.endsWith('.pdf') && !urlLower.includes('.pdf?') && !urlLower.includes('.pdf#')) {
              const proceed = confirm(
                'The URL doesn\'t appear to be a PDF file.\n\n' +
                'URL: ' + url + '\n\n' +
                'Do you want to try loading it anyway?'
              );
              if (!proceed) {
                return;
              }
            }

            try {
              await loadPDFFromURL(url);
              // URL is now displayed in the input field by loadPDFFromURL
            } catch (error) {
              let errorMsg = 'Error loading PDF from URL:\n\n' + error.message;

              // Provide helpful hints for common errors
              if (error.message.includes('Invalid PDF structure')) {
                errorMsg += '\n\nTip: Make sure the URL points directly to a PDF file, not an HTML page.';
              } else if (error.message.includes('NetworkError') || error.message.includes('CORS')) {
                errorMsg += '\n\nTip: The server may not allow cross-origin requests. Try a different PDF URL.';
              }

              alert(errorMsg);
            }
          };

          const handleUrlKeyPress = (event) => {
            if (event.key === 'Enter') {
              handleUrlLoad();
            }
          };

          const initializeViewer = (numPages, pageWidth, pageHeight) => {
            // Clean up existing viewer
            if (osdViewerRef.current) {
              osdViewerRef.current.destroy();
            }

            const viewerElement = document.getElementById('openseadragon-viewer');
            if (!viewerElement) {
              console.error('Viewer element not found');
              return;
            }

            // Generate grid pattern and dimensions
            const pattern = GridPattern.generate(numPages, numPages);
            const gridDims = GridPattern.calculateDimensions(numPages, pageWidth, pageHeight);

            console.log(`Page: ${pageWidth}x${pageHeight}, Spacing: ${gridDims.spacing}`);
            console.log(`Grid: ${gridDims.gridSize}×${gridDims.gridSize}, Total: ${gridDims.totalWidth}x${gridDims.totalHeight}`);

            // Debug: Print first few page positions
            console.log('Expected page positions in grid:');
            for (let row = 0; row < Math.min(3, gridDims.gridSize); row++) {
              for (let col = 0; col < Math.min(3, gridDims.gridSize); col++) {
                const pageNum = pattern[row][col];
                const px = col * (pageWidth + gridDims.spacing);
                const py = row * (pageHeight + gridDims.spacing);
                console.log(`  Page ${pageNum} at grid(${row},${col}): pixel position (${px}, ${py})`);
              }
            }

            // Create tile source
            const tileSource = new CustomTileSource(
              gridDims,
              pattern,
              pageCanvasesRef.current,
              numPages
            );
            tileSourceRef.current = tileSource;

            // Initialize OpenSeadragon viewer
            const viewer = OSDManager.initialize(tileSource, pageWidth, pageHeight, gridDims.gridSize);
            osdViewerRef.current = viewer;
          };

          /**
           * Drag-and-drop handlers
           */
          const handleDragOver = (e) => {
            e.preventDefault();
            e.stopPropagation();
          };

          const handleDrop = async (e) => {
            e.preventDefault();
            e.stopPropagation();

            if (isLoading) return;

            const files = e.dataTransfer.files;
            if (files.length > 0) {
              const file = files[0];
              if (file.type === 'application/pdf') {
                await handleFileUpload({ target: { files: [file] } });
              } else {
                alert('Please drop a PDF file');
              }
            }
          };

          /**
           * Download current PDF
           */
          const handleDownload = async () => {
            if (!pdfDocRef.current || !currentFilename) {
              alert('No PDF loaded');
              return;
            }

            try {
              const pdf = pdfDocRef.current;
              const data = await pdf.getData();
              const blob = new Blob([data], { type: 'application/pdf' });
              const url = URL.createObjectURL(blob);

              const a = document.createElement('a');
              a.href = url;
              a.download = currentFilename.replace(/^https?:\/\/.*\//, '') || 'download.pdf';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            } catch (error) {
              console.error('Error downloading PDF:', error);
              alert('Failed to download PDF');
            }
          };

          return (
            <div className="w-full h-full bg-gray-900 flex flex-col">
              {/* Header */}
              <div className="bg-gray-800 border-b border-gray-700 p-2 md:p-3">
                <div className="flex items-center gap-2 max-w-7xl mx-auto">
                  {/* Help Button */}
                  <button
                    onClick={() => setShowHelp(!showHelp)}
                    className="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white rounded cursor-pointer transition-colors text-lg font-bold"
                    title="Help & About"
                  >
                    ?
                  </button>

                  {/* URL Input */}
                  <input
                    type="text"
                    value={urlInput}
                    onChange={(e) => setUrlInput(e.target.value)}
                    onKeyPress={handleUrlKeyPress}
                    onFocus={(e) => e.target.select()}
                    placeholder="Enter PDF URL or choose local file..."
                    className="flex-1 px-2 md:px-3 py-2 bg-gray-700 text-white border border-gray-600 rounded focus:outline-none focus:border-blue-500 text-sm"
                    disabled={isLoading}
                  />
                  <button
                    onClick={handleUrlLoad}
                    disabled={isLoading}
                    className="px-3 md:px-4 py-2 bg-green-600 hover:bg-green-700 active:bg-green-800 text-white rounded cursor-pointer transition-colors disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap text-sm"
                  >
                    <span className="md:hidden">URL</span>
                    <span className="hidden md:inline">Open URL</span>
                  </button>

                  {/* File Upload */}
                  <label className="px-3 md:px-4 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded cursor-pointer transition-colors text-center text-sm whitespace-nowrap">
                    <span className="md:hidden">PDF</span>
                    <span className="hidden md:inline">Local PDF</span>
                    <input
                      type="file"
                      accept="application/pdf"
                      onChange={handleFileUpload}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>

              {/* Viewer Area */}
              <div
                className="flex-1 relative"
                onDragOver={handleDragOver}
                onDrop={handleDrop}
              >
                {/* Help/About Overlay */}
                {showHelp && (
                  <div className="absolute top-0 left-0 right-0 z-20 bg-gray-800 border-b border-gray-700 shadow-lg max-h-full overflow-y-auto">
                    <div className="max-w-4xl mx-auto p-4 md:p-6">
                      <div className="flex justify-between items-start mb-4">
                        <h2 className="text-xl font-bold text-white">PDF Grid Viewer v{CONFIG.VERSION}</h2>
                        <button
                          onClick={() => setShowHelp(false)}
                          className="text-gray-400 hover:text-white text-2xl leading-none"
                          title="Close"
                        >
                          ×
                        </button>
                      </div>

                      <div className="text-gray-300 space-y-4 text-sm md:text-base">
                        <div>

                          <p>This tool displays the pages of a PDF in a staggered repeating grid; advancing both horizontally (like a book) and vertically (like a scroll).
                          Adjacent pages are always sequential neighbors, transforming a one-dimensional stream of pages into a continuous two-dimensional space; unlike a conventional left-to-right wrapped grid, where pages in rows above and below are far away from each other.
                          Zooming out shows the whole at once, where structure and patterns emerge.</p>
                        </div>

                        <div>
                          <h3 className="font-semibold text-white mb-2">Loading Data</h3>
                          <p>A demo PDF may already be loaded. Try inspecting something big, like a magazine or book!</p>
                          <ul className="list-disc list-inside space-y-1">
                            <li><strong>From URL:</strong> Enter a URL and click "Open URL" (or press Enter).</li>
                            <li><strong>Remote Parameter:</strong> Add <code className="bg-gray-700 px-1 rounded">?url=https://example.com/file.pdf</code> to the page URL.</li>
                            <li><strong>Drag-and-Drop:</strong> Drag a PDF file from your computer onto the viewer.</li>
                            <li><strong>Local File:</strong> Click "Local PDF" to choose a file from your device.</li>
                            <li><strong>Local Parameter:</strong> Add <code className="bg-gray-700 px-1 rounded">?pdf=file.pdf</code> to the page URL.</li>

                          </ul>
                        </div>

                        <div>
                          <h3 className="font-semibold text-white mb-2">Controls</h3>
                          <ul className="list-disc list-inside space-y-1">
                            <li><strong>Pan:</strong> Click and drag to move around.</li>
                            <li><strong>Zoom:</strong> Scroll wheel or pinch to zoom in/out.</li>
                            <li><strong>Home:</strong> Click the home button (top-right) to reset view.</li>
                            <li><strong>Fullscreen:</strong> Click the fullscreen button for immersive viewing.</li>
                          </ul>
                        </div>

                        {pdfFile && (
                          <div className="pt-2 border-t border-gray-700">
                            <button
                              onClick={handleDownload}
                              className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded transition-colors"
                            >
                              Download PDF
                            </button>
                          </div>
                        )}

                        <div>

                          <p>This tool is resides in a single HTML file that calls external libraries. While it is not suited for production, it may be downloaded and run on a local machine, or any web server.</p>
                        </div>

                        <div className="text-xs text-gray-400 pt-2 border-t border-gray-700">
                          <p>Built by <a
                                        href="https://www.jessehiemstra.com"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="text-blue-400 hover:text-blue-300 underline" >Jesse Hiemstra</a> with Claude Code using PDF.js, OpenSeadragon, React, and Tailwind CSS.</p>
                          <p className="mt-1">
                            <a
                              href="https://github.com/ginger-pickles/PDF-grid"
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-blue-400 hover:text-blue-300 underline"
                            >
                              View on GitHub
                            </a>
                          </p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {!pdfFile ? (
                  <div className="absolute inset-0 flex items-center justify-center">
                    <div className="text-center text-gray-400">
                      <svg className="w-24 h-24 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                      </svg>
                      <p className="text-lg">Drag & drop a PDF to get started</p>
                      <p className="text-sm mt-2">Pages will appear in a rotating grid pattern; zoom out to see the whole at once.</p>
                      <p className="text-sm mt-2">Local files are stored locally and not uploaded to any server. View page source code to verify.</p>
                      <p className="text-sm mt-2">This app is a single HTML file. Save it to your device and open to run "offline." <i>Serve</i> it from your device for improved functionality, such as auto-loading files with ?pdf parameter.</p>
                      </div>
                  </div>
                ) : null}
                
                {isLoading && (
                  <div className="absolute inset-0 flex items-center justify-center bg-gray-900 z-10">
                    <div className="text-center">
                      <div className="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-600 border-t-blue-500 mb-4"></div>
                      <p className="text-white">{loadingStatus}</p>
                    </div>
                  </div>
                )}
                
                <div
                  id="openseadragon-viewer"
                  ref={viewerRef}
                  className="w-full h-full"
                  style={{ display: pdfFile ? 'block' : 'none' }}
                />
              </div>

            </div>
          );
        };

        ReactDOM.render(<PDFGridViewer />, document.getElementById('root'));
    </script>
</body>
</html>
