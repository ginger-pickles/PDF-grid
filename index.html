              return { tiles: [], pagesNeeded: [], qualityIssues: [] };
            }

            const ts = this.tileStreamer;
            const lastDrawn = tiledImage._lastDrawn;
            const tiles = [];
            const pagesNeededSet = new Set();
            const qualityIssues = [];

            for (const tile of lastDrawn) {
              if (!tile.loaded) continue;

              const level = tile.level;
              const x = tile.x;
              const y = tile.y;

              // Calculate which pages this tile needs
              const scale = Math.pow(2, level - ts.maxLevel);
              const tileWidthInGrid = ts.tileWidth / scale;
              const tileHeightInGrid = ts.tileHeight / scale;
              const tileLeft = x * tileWidthInGrid;
              const tileTop = y * tileHeightInGrid;
              const tileRight = Math.min(tileLeft + tileWidthInGrid, ts.gridDims.totalWidth);
              const tileBottom = Math.min(tileTop + tileHeightInGrid, ts.gridDims.totalHeight);

              const neededPages = ts._calculateIntersectingPages(tileLeft, tileTop, tileRight, tileBottom);
              const expectedResolution = level <= ts.minimapMaxLevel ? 'low' : 'high';

              // Feed-forward: collect pages needed for visible tiles
              neededPages.forEach(p => pagesNeededSet.add(`${p}_${expectedResolution}`));

              // Feed-back: check if tile is at correct resolution
              const pageCache = ts.pageStreamer._getPageCache(expectedResolution);
              const missingPages = neededPages.filter(p => !pageCache.has(`${p}_${expectedResolution}`));

              const tileInfo = {
                level, x, y,
                key: `L${level}(${x},${y})`,
                neededPages,
                expectedResolution,
                missingPages,
                isComplete: missingPages.length === 0
              };
              tiles.push(tileInfo);

              // Quality issue: tile visible but missing pages (blurry/incomplete)
              if (missingPages.length > 0) {
                qualityIssues.push({
                  ...tileInfo,
                  issue: 'incomplete',
                  description: `Tile at L${level} missing ${missingPages.length} ${expectedResolution}-res pages`
                });
              }
            }

            // Convert Set to sorted array
            const pagesNeeded = Array.from(pagesNeededSet).map(key => {
              const [pageNum, resolution] = key.split('_');
              return { pageNum: parseInt(pageNum), resolution };
            }).sort((a, b) => a.pageNum - b.pageNum);

            return { tiles, pagesNeeded, qualityIssues };
          }

          /**
           * Get priority pages based on what OSD is actually drawing
           * More accurate than viewport prediction - uses actual tile requests
           * @returns {Array<{pageNum, resolution}>} Pages to prioritize, in order
           */
          getDrawnPriorityPages() {
            const { pagesNeeded, qualityIssues } = this.getLastDrawnAnalysis();

            // Prioritize pages for incomplete tiles (they're visible but blurry)
            const incompletePages = new Set();
            qualityIssues.forEach(issue => {
              issue.missingPages.forEach(p => incompletePages.add(`${p}_${issue.expectedResolution}`));
            });

            // Sort: incomplete tiles first (visible but wrong), then other needed pages
            return pagesNeeded.sort((a, b) => {
              const aKey = `${a.pageNum}_${a.resolution}`;
              const bKey = `${b.pageNum}_${b.resolution}`;
              const aIncomplete = incompletePages.has(aKey);
              const bIncomplete = incompletePages.has(bKey);
              if (aIncomplete && !bIncomplete) return -1;
              if (!aIncomplete && bIncomplete) return 1;
              return a.pageNum - b.pageNum;
            });
          }
        }

        // ╔══════════════════════════════════════════════════════════════════════════╗
        // ║                    BACKGROUND RENDERER MODULE                            ║
        // ╚══════════════════════════════════════════════════════════════════════════╝

        /**
         * BackgroundRenderer: Manages progressive background tile rendering
         * Implements bidirectional strategy (L0-down background + viewport-first immediate)
         * Extracted from TileStreamer in Phase 2.3 modularization
         */
        class BackgroundRenderer {
          constructor(tileStreamer) {
            this.tileStreamer = tileStreamer;
          }

          /**
           * Start background rendering from L0, progressively rendering each level
           * Bidirectional strategy: L0-down (background) meets viewport-first (immediate)
           * Solves cache thrashing by rendering low levels (few tiles, need all pages) first
           */
          startBackgroundRendering() {
            const queue = this.tileStreamer.backgroundQueue;

            if (!queue.enabled) {
              if (CONFIG.VERBOSE_LOGGING) {
                console.log('[Background Rendering] Not enabled yet - waiting for OSD init');
              }
              return;
            }

            if (queue.isRunning) {
              if (CONFIG.VERBOSE_LOGGING) {
                console.log('[Background Rendering] Already running');
              }
              return;
            }

            if (CONFIG.VERBOSE_LOGGING) {
              console.log('[Background Rendering] Starting L0-down progressive rendering');
            }
            queue.isRunning = true;
            queue.stopRequested = false;
            queue.currentLevel = 0;
            queue.levelIndex = 0;
            queue.startTime = Date.now(); // Track start time for grace period

            // Start processing from L0
            this._processBackgroundQueue();
          }

          /**
           * Stop background rendering (e.g., user interaction, viewport change)
           */
          stopBackgroundRendering() {
            const queue = this.tileStreamer.backgroundQueue;

            if (queue.isRunning) {
              if (CONFIG.VERBOSE_LOGGING) {
                console.log('[Background Rendering] Stopping at level', queue.currentLevel);
              }
              queue.stopRequested = true;
              queue.isRunning = false;
            }
          }

          /**
           * Resume background rendering from where it left off
           */
          resumeBackgroundRendering() {
            const queue = this.tileStreamer.backgroundQueue;

            if (!queue.enabled || queue.isRunning) {
              return;
            }

            if (CONFIG.VERBOSE_LOGGING) {
              console.log('[Background Rendering] Resuming from level', queue.currentLevel);
            }
            queue.isRunning = true;
            queue.stopRequested = false;
            this._processBackgroundQueue();
          }

          /**
           * Process the background rendering queue
           * Renders tiles level-by-level from L0 upward
           */
          _processBackgroundQueue() {
            // Wrap entire function in try-catch to prevent silent failures
            try {
              const queue = this.tileStreamer.backgroundQueue;

              // Defensive check: Ensure queue exists
              if (!queue) {
                console.error('[Background Rendering] Queue object is undefined!');
                return;
              }

              // Check if we should stop
              if (queue.stopRequested || !queue.enabled) {
                if (CONFIG.VERBOSE_LOGGING) {
                  console.log('[Background Rendering] Stopped (requested:' + queue.stopRequested + ', enabled:' + queue.enabled + ')');
                }
                queue.isRunning = false;
                return;
              }

              // Check if we've reached the minimap max level (stop before high-res levels to prevent memory explosion)
              // High-res tiles will render on-demand when user zooms in
              if (queue.currentLevel > this.tileStreamer.minimapMaxLevel) {
                if (CONFIG.VERBOSE_LOGGING) {
                  console.log('[Background Rendering] Completed low-res levels (L0 to L' + this.tileStreamer.minimapMaxLevel + ') - high-res tiles render on-demand');
                }
                queue.isRunning = false;
                return;
              }

              // If starting a new level, calculate all tiles for this level
              if (queue.levelIndex === 0) {
                const resolution = this.tileStreamer._getResolutionForLevel(queue.currentLevel);
                queue.tilesInLevel = this.tileStreamer._getTilesForLevel(queue.currentLevel);

                // For high-res levels, we need to batch by pages to avoid cache thrashing
                if (resolution === 'high') {
                  // Annotate each tile with required pages
                  const tilesWithPages = queue.tilesInLevel.map(tile => {
                    const bounds = this.tileStreamer._getTileBounds(tile.level, tile.x, tile.y);
                    const neededPages = this.tileStreamer._calculateIntersectingPages(bounds.left, bounds.top, bounds.right, bounds.bottom);
                    return { ...tile, neededPages };
                  });

                  // Group tiles by page batches (8 pages per batch fits in 10-page cache)
                  const batchSize = queue.highResBatchSize;
                  const tilesGroupedByBatch = [];

                  // PDF pages are 1-indexed, so start from 1
                  for (let startPage = 1; startPage <= this.tileStreamer.numPages; startPage += batchSize) {
                    const endPage = Math.min(startPage + batchSize - 1, this.tileStreamer.numPages);
                    const pagesInBatch = new Set(Array.from({length: endPage - startPage + 1}, (_, i) => startPage + i));

                    // Find tiles that only need pages from this batch
                    const tilesInBatch = tilesWithPages.filter(tile =>
                      tile.neededPages.every(p => pagesInBatch.has(p))
                    );

                    if (tilesInBatch.length > 0) {
                      tilesGroupedByBatch.push({
                        batchIndex: Math.floor(startPage / batchSize),
                        pageRange: [startPage, endPage - 1],
                        tiles: tilesInBatch
                      });
                    }
                  }

                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Background Rendering] Level ${queue.currentLevel} (HIGH-RES): ${queue.tilesInLevel.length} tiles grouped into ${tilesGroupedByBatch.length} page batches`);
                  }
                  queue.tilesInLevel = tilesGroupedByBatch;
                  queue.highResBatchIndex = 0;
                } else {
                  // For low-res levels, sort by page-locality
                  if (queue.currentLevel >= 2) {
                    queue.tilesInLevel = this.tileStreamer._sortTilesByPageLocality(queue.tilesInLevel);
                  }
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Background Rendering] Level ${queue.currentLevel} (LOW-RES): ${queue.tilesInLevel.length} tiles to render`);
                  }
                }
              }

              // Determine if this is a high-res level (different data structure)
              const resolution = this.tileStreamer._getResolutionForLevel(queue.currentLevel);
              const isHighRes = resolution === 'high';

              if (isHighRes) {
                // HIGH-RES PROCESSING: Work through page batches
                if (queue.levelIndex >= queue.tilesInLevel.length) {
                  // All batches processed, move to next level
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Background Rendering] Completed level ${queue.currentLevel}`);
                  }
                  queue.currentLevel++;
                  queue.levelIndex = 0;
                  queue.tilesInLevel = [];
                  setTimeout(() => this._processBackgroundQueue(), queue.delayMs);
                  return;
                }

                const currentBatch = queue.tilesInLevel[queue.levelIndex];
                const [startPage, endPage] = currentBatch.pageRange;
                const pagesToLoad = Array.from({length: endPage - startPage + 1}, (_, i) => startPage + i);

                if (CONFIG.VERBOSE_LOGGING) {
                  console.log(`[Background Rendering] Processing page batch ${queue.levelIndex + 1}/${queue.tilesInLevel.length}: pages ${startPage}-${endPage} (${currentBatch.tiles.length} tiles)`);
                }

                // Preload all pages for this batch
                this.tileStreamer.pageStreamer.requestPages(pagesToLoad, 'high').then(() => {
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Background Rendering] Preloaded pages ${startPage}-${endPage}, rendering ${currentBatch.tiles.length} tiles`);
                  }

                  // Now render all tiles in this batch (asynchronously to avoid blocking UI)
                  this._renderTilesAsync(currentBatch.tiles, 0, () => {
                    if (CONFIG.VERBOSE_LOGGING) {
                      console.log(`[Background Rendering] Completed batch ${queue.levelIndex + 1}/${queue.tilesInLevel.length} with ${currentBatch.tiles.length} tiles`);
                    }

                    // Move to next batch
                    queue.levelIndex++;
                    setTimeout(() => this._processBackgroundQueue(), queue.delayMs);
                  });
                }).catch(err => {
                  console.error('[Background Rendering] Error preloading pages:', err);
                  queue.levelIndex++; // Skip this batch on error
                  setTimeout(() => this._processBackgroundQueue(), queue.delayMs);
                });

                return; // Don't continue to low-res logic below
              }

              // LOW-RES PROCESSING: Render tiles directly
              const batch = queue.tilesInLevel.slice(queue.levelIndex, queue.levelIndex + queue.batchSize);

              if (CONFIG.VERBOSE_LOGGING) {
                console.log(`[Background Rendering] Processing batch: ${queue.levelIndex}-${queue.levelIndex + batch.length} of ${queue.tilesInLevel.length}`);
              }

              // Render tiles asynchronously to avoid blocking UI
              this._renderTilesAsync(batch, 0, () => {
                // Update progress
                queue.levelIndex += batch.length;

                // If finished current level, move to next level
                if (queue.levelIndex >= queue.tilesInLevel.length) {
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Background Rendering] Completed level ${queue.currentLevel}`);
                  }
                  queue.currentLevel++;
                  queue.levelIndex = 0;
                  queue.tilesInLevel = [];
                }

                // Schedule next batch (with delay to keep UI responsive)
                // CRITICAL: Use arrow function to preserve lexical 'this' context
                setTimeout(() => this._processBackgroundQueue(), queue.delayMs);
              });

            } catch (error) {
              // Catch any uncaught errors to prevent silent failure
              console.error('[Background Rendering] FATAL ERROR in _processBackgroundQueue:', error);
              console.error('[Background Rendering] Stack trace:', error.stack);

              // Mark as not running so it can be restarted
              if (this.tileStreamer.backgroundQueue) {
                this.tileStreamer.backgroundQueue.isRunning = false;
              }

              // Don't schedule next batch on fatal error
            }
          }

          /**
           * Render tiles asynchronously with yielding to keep UI responsive
           * Processes tiles one at a time with setTimeout(0) between each
           * @param {Array} tiles - Array of tile objects
           * @param {number} index - Current tile index
           * @param {Function} callback - Called when all tiles are rendered
           */
          _renderTilesAsync(tiles, index, callback) {
            const queue = this.tileStreamer.backgroundQueue;

            // Base case: all tiles rendered
            if (index >= tiles.length) {
              if (callback) callback();
              return;
            }

            // Check if stop was requested
            if (queue.stopRequested) {
              if (CONFIG.VERBOSE_LOGGING) {
                console.log('[Background Rendering] Stop requested during async tile rendering');
              }
              queue.isRunning = false;
              return;
            }

            // Render current tile
            const tile = tiles[index];
            try {
              this.tileStreamer.generateTile(tile.level, tile.x, tile.y);
            } catch (err) {
              console.error(`[Background Rendering] Error rendering tile L${tile.level}(${tile.x},${tile.y}):`, err);
            }

            // Yield to browser and continue with next tile
            // Use setTimeout(0) to allow browser to process events, paint, etc.
            setTimeout(() => this._renderTilesAsync(tiles, index + 1, callback), 0);
          }
        }

        /**
         * Phase 2.1: TileGenerator - Handles tile rendering and image generation
         * Extracted from TileStreamer to improve modularity and readability
         */
        class TileGenerator {
          constructor(tileStreamer) {
            this.tileStreamer = tileStreamer;
          }

          /**
           * Generate a tile at specified level and coordinates
           * Entry point called by OpenSeadragon
           */
          generateTile(level, x, y) {
            // Delegate to original implementation in TileStreamer
            // All tile generation state is managed by TileStreamer
            const ts = this.tileStreamer;

            // Prevent duplicate initial L0 tile generation requests
            if (level === 0) {
              const now = Date.now();

              // Track L0 tile generation attempts for diagnostics
              if (!window.__L0TileGeneration) {
                window.__L0TileGeneration = { calls: [], delayed: 0, firstRequestTime: now };
              }

              const timeSinceFirst = now - window.__L0TileGeneration.firstRequestTime;

              // Block duplicate requests within first 500ms (initial load period)
              if (timeSinceFirst < 500) {
                // Check if we already have a cached L0 tile
                for (const [cacheKey, cachedTile] of ts.tileCache.cache.entries()) {
                  if (cacheKey.startsWith('0_')) {
                    if (!window.__L0TileGeneration.delayed) window.__L0TileGeneration.delayed = 0;
                    window.__L0TileGeneration.delayed++;
                    return cachedTile;
                  }
                }
              }

              // Track L0 tile generation for diagnostics
              const totalPages = ts.numPages;
              const lowResCache = ts.pageStreamer._getPageCache('low');
              const cachedPageCount = lowResCache.size;
              const cacheCompleteness = totalPages ? (cachedPageCount / totalPages) : 0;

              if (!window.__L0TileGeneration.calls) window.__L0TileGeneration.calls = [];
              window.__L0TileGeneration.calls.push({
                time: now,
                level, x, y,
                timeSinceFirst,
                cachedPages: cachedPageCount,
                totalPages: totalPages,
                completeness: Math.round(cacheCompleteness * 100) + '%',
                timestamp: new Date().toISOString()
              });
            }

            // Calculate which pages this tile needs
            const scale = Math.pow(2, level - ts.maxLevel);
            const tileWidthInGrid = ts.tileWidth / scale;
            const tileHeightInGrid = ts.tileHeight / scale;

            // Tile boundaries
            const tileLeft = x * tileWidthInGrid;
            const tileTop = y * tileHeightInGrid;
            const tileRight = Math.min(tileLeft + tileWidthInGrid, ts.gridDims.totalWidth);
            const tileBottom = Math.min(tileTop + tileHeightInGrid, ts.gridDims.totalHeight);

            // Find needed pages
            const neededPages = [];
            const { pageWidth, pageHeight, spacing, gridRows, gridCols } = ts.gridDims;

            for (let row = 0; row < gridRows; row++) {
              for (let col = 0; col < gridCols; col++) {
                // Page centered within cell: half-spacing on each edge
                const halfSpacing = spacing / 2;
                const pageLeft = col * (pageWidth + spacing) + halfSpacing;
                const pageTop = row * (pageHeight + spacing) + halfSpacing;
                const pageRight = pageLeft + pageWidth;
                const pageBottom = pageTop + pageHeight;

                // Check intersection (positive area)
                if (pageRight > tileLeft && pageLeft < tileRight &&
                    pageBottom > tileTop && pageTop < tileBottom) {
                  const pageNum = ts.pattern[row][col];
                  if (pageNum !== 0 && !neededPages.includes(pageNum)) {
                    neededPages.push(pageNum);
                  }
                }
              }
            }

            neededPages.sort((a, b) => a - b);

            // Determine resolution
            let resolution;
            if (level <= ts.minimapMaxLevel) {
              resolution = 'low';
            } else {
              resolution = 'high';
            }

            // Generate cache key with fingerprint
            const fingerprint = this._generateTileFingerprint(neededPages, level, x, y);
            const key = `${level}_${fingerprint}`;

            // Check cache
            const cached = ts.tileCache.get(key);
            if (cached) {
              return cached;
            }

            // Check if all needed pages are available at the REQUIRED resolution
            // Vector 12 Fix: No fallback - only accept correct resolution
            const pageCache = ts.pageStreamer._getPageCache(resolution);

            // Count pages missing at the required resolution
            const missingPages = neededPages.filter(p => {
              const hasCorrectResolution = pageCache.has(`${p}_${resolution}`);
              return !hasCorrectResolution;
            });

            // If missing pages at required resolution, request them and return null
            // OSD will display nothing for this tile until pages are ready
            if (missingPages.length > 0) {
              ts.cacheManager._requestPagesAsync(missingPages, resolution);
              return null;
            }

            // Render tile
            const tileUrl = this._renderTile(level, x, y, scale, key, neededPages, resolution, tileLeft, tileTop, tileRight, tileBottom);

            // Cache and return
            ts.tileCache.set(key, tileUrl);
            return tileUrl;
          }

          /**
           * Render a tile with all needed pages
           */
          _renderTile(level, x, y, scale, key, neededPages, resolution, tileLeft, tileTop, tileRight, tileBottom) {
            const ts = this.tileStreamer;
            const { totalWidth, totalHeight, pageWidth, pageHeight, spacing, gridRows, gridCols } = ts.gridDims;

            // Track L0 tile rendering
            if (level === 0) {
              if (!window.__L0TileGeneration) window.__L0TileGeneration = { calls: [], renders: [] };
              if (!window.__L0TileGeneration.renders) window.__L0TileGeneration.renders = [];
              window.__L0TileGeneration.renders.push({
                time: Date.now(),
                key,
                neededPages: [...neededPages],
                resolution
              });
            }

            // Configure interpolation based on zoom level
            if (level < CONFIG.IMAGE_SMOOTHING_THRESHOLD_LEVEL) {
              ts.tileCtx.imageSmoothingEnabled = CONFIG.IMAGE_SMOOTHING_LOW_ZOOM;
            } else {
              ts.tileCtx.imageSmoothingEnabled = CONFIG.IMAGE_SMOOTHING_HIGH_ZOOM;
            }
            if (ts.tileCtx.imageSmoothingEnabled) {
              ts.tileCtx.imageSmoothingQuality = CONFIG.IMAGE_SMOOTHING_QUALITY;
            }

            // Clear tile with background color
            ts.tileCtx.fillStyle = CONFIG.BACKGROUND_COLOR;
            ts.tileCtx.fillRect(0, 0, ts.tileCanvas.width, ts.tileCanvas.height);

            // Draw portions of pages that intersect this tile
            let pagesDrawnCount = 0;

            for (let row = 0; row < gridRows; row++) {
              for (let col = 0; col < gridCols; col++) {
                const wasDrawn = this._drawPageIntersection(row, col, tileLeft, tileTop, tileRight, tileBottom, scale, key, resolution, level);
                if (wasDrawn) pagesDrawnCount++;
              }
            }

            // DEBUG: Draw tile labels if enabled
            if (CONFIG.TILE_LABELS) {
              this._drawTileDebugLabels(level, key);
            }

            // Convert to data URL
            let dataUrl;
            if (CONFIG.TILE_FORMAT === 'png') {
              dataUrl = ts.tileCanvas.toDataURL('image/png');
            } else {
              dataUrl = ts.tileCanvas.toDataURL('image/jpeg', CONFIG.TILE_JPEG_QUALITY);
            }

            // Update render rate stats
            ts._updateRenderRateWindow(1, 0);

            return dataUrl;
          }

          /**
           * Draw debug labels on tile (tile borders and level number)
           */
          _drawTileDebugLabels(level, key) {
            const ts = this.tileStreamer;
            const ctx = ts.tileCtx;
            const canvas = ts.tileCanvas;

            ctx.lineWidth = 3;

            // Top edge - RED
            ctx.strokeStyle = '#FF0000';
            ctx.beginPath();
            ctx.moveTo(0, 1.5);
            ctx.lineTo(canvas.width, 1.5);
            ctx.stroke();

            // Right edge - GREEN
            ctx.strokeStyle = '#00FF00';
            ctx.beginPath();
            ctx.moveTo(canvas.width - 1.5, 0);
            ctx.lineTo(canvas.width - 1.5, canvas.height);
            ctx.stroke();

            // Bottom edge - BLUE
            ctx.strokeStyle = '#0000FF';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 1.5);
            ctx.lineTo(canvas.width, canvas.height - 1.5);
            ctx.stroke();

            // Left edge - YELLOW
            ctx.strokeStyle = '#FFFF00';
            ctx.beginPath();
            ctx.moveTo(1.5, 0);
            ctx.lineTo(1.5, canvas.height);
            ctx.stroke();

            // Draw level number at center
            ctx.font = 'bold 60px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Black outline for contrast
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 5;
            ctx.strokeText(`L${level}`, canvas.width / 2, canvas.height / 2 - 100);

            // White text
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(`L${level}`, canvas.width / 2, canvas.height / 2 - 100);

            // Draw cache key below level, wrapped
            ctx.font = 'bold 48px monospace';
            const maxWidth = canvas.width - 20;
            const lineHeight = 56;

            const chunks = key.split('_');
            const lines = [];
            let currentLine = '';

            for (const chunk of chunks) {
              const testLine = currentLine ? currentLine + '_' + chunk : chunk;
              const metrics = ctx.measureText(testLine);

              if (metrics.width > maxWidth && currentLine) {
                lines.push(currentLine);
                currentLine = chunk;
              } else {
                currentLine = testLine;
              }
            }
            if (currentLine) lines.push(currentLine);

            // Draw each line
            const startY = canvas.height / 2 - 20;
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 6;

            lines.forEach((line, i) => {
              const y = startY + (i * lineHeight);
              ctx.strokeText(line, canvas.width / 2, y);
              ctx.fillStyle = '#FFFF00';
              ctx.fillText(line, canvas.width / 2, y);
            });
          }

          /**
           * Draw a single page's intersection with the tile
           */
          _drawPageIntersection(row, col, tileLeft, tileTop, tileRight, tileBottom, scale, debugKey, resolution, level, ctx = null) {
            const ts = this.tileStreamer;
            const { pageWidth, pageHeight, spacing } = ts.gridDims;
            // Use provided ctx or fall back to shared tileCtx
            const targetCtx = ctx || ts.tileCtx;
            const tileOverlap = ctx ? 0 : ts.tileOverlap; // No overlap adjustment for per-job canvas

            // Calculate page position in grid (centered within cell)
            const halfSpacing = spacing / 2;
            const pageLeft = col * (pageWidth + spacing) + halfSpacing;
            const pageTop = row * (pageHeight + spacing) + halfSpacing;
            const pageRight = pageLeft + pageWidth;
            const pageBottom = pageTop + pageHeight;

            // Get page number early for diagnostics
            const pageNum = ts.pattern[row][col];

            // Check intersection
            if (pageRight <= tileLeft || pageLeft >= tileRight ||
                pageBottom <= tileTop || pageTop >= tileBottom) {
              // DIAGNOSTIC: Log why pages 2,3 don't intersect (Vector 17)
              if (pageNum >= 2 && pageNum <= 3 && level >= 3 && window.__tileLog) {
                if (!window.__tileLog.noIntersect) window.__tileLog.noIntersect = [];
                window.__tileLog.noIntersect.push({
                  page: pageNum,
                  tile: debugKey,
                  level: level,
                  row: row,
                  col: col,
                  pageGrid: { left: pageLeft, top: pageTop, right: pageRight, bottom: pageBottom },
                  tileGrid: { left: tileLeft, top: tileTop, right: tileRight, bottom: tileBottom },
                  reason: pageRight <= tileLeft ? 'page-right-of-tile' :
                          pageLeft >= tileRight ? 'page-left-of-tile' :
                          pageBottom <= tileTop ? 'page-above-tile' : 'page-below-tile'
                });
              }
              return true; // No intersection - success (nothing to draw)
            }

            // Skip blank cells
            if (pageNum === 0) {
              return true; // Blank cell - success (nothing to draw)
            }

            // Get decoded page from cache (JPEG data URLs are automatically decoded)
            let pageCanvas = ts.pageStreamer.getDecodedPage(pageNum, resolution);

            // Track cache misses and trigger on-demand rendering
            if (!pageCanvas) {
              ts.stats.cacheMisses++;

              // On-demand rendering
              const renderKey = `${pageNum}_${resolution}`;
              const alreadyRendering = ts.pageStreamer.renderingInProgress.has(renderKey);

              // Track for L0 diagnostics
              if (level === 0 && !window.__L0OnDemandSkipped) {
                window.__L0OnDemandSkipped = { enabled: CONFIG.ON_DEMAND_RENDERING_ENABLED, skipped: [] };
              }

              if (!CONFIG.ON_DEMAND_RENDERING_ENABLED && level === 0) {
                window.__L0OnDemandSkipped.skipped.push({pageNum, reason: 'disabled'});
              } else if (alreadyRendering && level === 0) {
                window.__L0OnDemandSkipped.skipped.push({pageNum, reason: 'already_rendering'});
              }

              if (CONFIG.ON_DEMAND_RENDERING_ENABLED && !alreadyRendering) {
                ts.stats.onDemandRenders++;

                // Track for L0 diagnostics
                if (level === 0) {
                  if (!window.__L0OnDemandTracking) window.__L0OnDemandTracking = { triggered: [], completed: [], failed: [] };
                  window.__L0OnDemandTracking.triggered.push({pageNum, resolution, time: Date.now()});
                }

                // Queue render with viewport priority (visible pages first)
                // Stats tracking and invalidation happen in processRenderQueue and renderPage
                ts.pageStreamer.queueRenderRequest(pageNum, resolution);
              }
            }

            // Vector 12 Simplification: Abort tile composition if page missing
            // No retry mechanism - rely on pendingJobs queue instead
            if (!pageCanvas) {
              if (CONFIG.VERBOSE_LOGGING) {
                console.log(`[ABORT COMPOSITION] tile ${debugKey} L${level}: page ${pageNum} ${resolution} not available`);
              }
              return false; // Abort - tile should be queued via pendingJobs
            }

            ts.stats.tilesRendered++;

            // Calculate intersection region in grid coordinates
            const intersectLeft = Math.max(tileLeft, pageLeft);
            const intersectTop = Math.max(tileTop, pageTop);
            const intersectRight = Math.min(tileRight, pageRight);
            const intersectBottom = Math.min(tileBottom, pageBottom);

            // Grid coords are at PDF_RENDER_SCALE, but canvas might be at PDF_LOWRES_SCALE
            // Calculate actual scale ratio from canvas dimensions to handle any resolution
            const canvasToGridRatio = pageCanvas.width / pageWidth;

            // Source rect in canvas coordinates (relative to page origin, scaled to canvas)
            const srcLeft = (intersectLeft - pageLeft) * canvasToGridRatio;
            const srcTop = (intersectTop - pageTop) * canvasToGridRatio;
            const srcWidth = (intersectRight - intersectLeft) * canvasToGridRatio;
            const srcHeight = (intersectBottom - intersectTop) * canvasToGridRatio;

            if (srcWidth <= 0 || srcHeight <= 0) {
              return false;
            }

            // Destination rect in tile coordinates
            // gridToTileScale = 2^(level - maxLevel), so for L0 it's small (e.g., 0.0156)
            // This scales grid coords to tile coords
            // IMPORTANT: scale from _getTileBounds is 2^(maxLevel-level), so use 1/scale
            // (srcWidth is scaled for canvas resolution, dest needs grid-based scaling)
            const gridToTileScale = 1 / scale;
            const destLeft = (intersectLeft - tileLeft) * gridToTileScale;
            const destTop = (intersectTop - tileTop) * gridToTileScale;
            const destWidth = (intersectRight - intersectLeft) * gridToTileScale;
            const destHeight = (intersectBottom - intersectTop) * gridToTileScale;

            // Debug logging for page 11 tile rendering
            if (pageNum === 1 && window.__DEBUG_PAGE11_TILES) {
              console.log(`[DEBUG Page 11 Tile] level=${level}, resolution=${resolution}`);
              console.log(`  pageCanvas: ${pageCanvas.width}x${pageCanvas.height}, canvasToGridRatio=${canvasToGridRatio.toFixed(4)}`);
              console.log(`  page grid: left=${pageLeft.toFixed(0)}, top=${pageTop.toFixed(0)}, right=${pageRight.toFixed(0)}, bottom=${pageBottom.toFixed(0)}`);
              console.log(`  tile grid: left=${tileLeft.toFixed(0)}, top=${tileTop.toFixed(0)}, right=${tileRight.toFixed(0)}, bottom=${tileBottom.toFixed(0)}`);
              console.log(`  intersect: left=${intersectLeft.toFixed(0)}, top=${intersectTop.toFixed(0)}, right=${intersectRight.toFixed(0)}, bottom=${intersectBottom.toFixed(0)}`);
              console.log(`  src: left=${srcLeft.toFixed(1)}, top=${srcTop.toFixed(1)}, w=${srcWidth.toFixed(1)}, h=${srcHeight.toFixed(1)}`);
              console.log(`  dest: left=${destLeft.toFixed(1)}, top=${destTop.toFixed(1)}, w=${destWidth.toFixed(1)}, h=${destHeight.toFixed(1)}`);
            }

            // Draw the page portion onto tile
            try {
              targetCtx.drawImage(
                pageCanvas,
                srcLeft, srcTop, srcWidth, srcHeight,
                destLeft + tileOverlap, destTop + tileOverlap, destWidth, destHeight
              );

              // DIAGNOSTIC: Track page draw operations (Vector 17 - Hypothesis 3)
              if (pageNum <= 3 && window.__tileLog) {
                if (!window.__tileLog.pageDraws) window.__tileLog.pageDraws = [];
                window.__tileLog.pageDraws.push({
                  page: pageNum,
                  tile: debugKey,
                  level: level,
                  resolution: resolution,
                  pageCanvas: { w: pageCanvas.width, h: pageCanvas.height },
                  src: { left: srcLeft, top: srcTop, width: srcWidth, height: srcHeight },
                  dest: { left: destLeft + tileOverlap, top: destTop + tileOverlap, width: destWidth, height: destHeight },
                  tileSize: targetCtx.canvas.width,
                  gridToTileScale: gridToTileScale,
                  time: Date.now()
                });
                console.log(`[PAGE DRAW] p${pageNum}->tile ${debugKey} L${level}: src=(${srcLeft.toFixed(0)},${srcTop.toFixed(0)},${srcWidth.toFixed(0)},${srcHeight.toFixed(0)}) dest=(${(destLeft + tileOverlap).toFixed(1)},${(destTop + tileOverlap).toFixed(1)},${destWidth.toFixed(1)},${destHeight.toFixed(1)}) scale=${gridToTileScale.toFixed(6)}`);
              }

              return true;
            } catch (err) {
              console.warn(`Failed to draw page ${pageNum}:`, err);
              return false;
            }
          }

          /**
           * Render tile to a provided canvas context (for async downloadTileStart pattern)
           * Unlike _renderTile, does not convert to dataURL - returns nothing, just renders
           * @param {number} level - Tile level
           * @param {number} x - Tile x coordinate
           * @param {number} y - Tile y coordinate
           * @param {CanvasRenderingContext2D} ctx - Target context to render into
           * @param {string} resolution - 'low' or 'high'
           * @param {Array} neededPages - Pages needed for this tile
           * @param {Object} tileBounds - Pre-calculated tile bounds {left, top, right, bottom, scale}
           */
          _renderTileToContext(level, x, y, ctx, resolution, neededPages, tileBounds) {
            const ts = this.tileStreamer;
            const { gridRows, gridCols } = ts.gridDims;
            const { left: tileLeft, top: tileTop, right: tileRight, bottom: tileBottom, scale } = tileBounds;
            const canvas = ctx.canvas;

            // Configure interpolation based on zoom level
            if (level < CONFIG.IMAGE_SMOOTHING_THRESHOLD_LEVEL) {
              ctx.imageSmoothingEnabled = CONFIG.IMAGE_SMOOTHING_LOW_ZOOM;
            } else {
              ctx.imageSmoothingEnabled = CONFIG.IMAGE_SMOOTHING_HIGH_ZOOM;
            }
            if (ctx.imageSmoothingEnabled) {
              ctx.imageSmoothingQuality = CONFIG.IMAGE_SMOOTHING_QUALITY;
            }

            // Clear tile with background color
            ctx.fillStyle = CONFIG.BACKGROUND_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw portions of pages that intersect this tile
            // Track if all needed pages were successfully drawn
            let allPagesDrawn = true;
            for (let row = 0; row < gridRows; row++) {
              for (let col = 0; col < gridCols; col++) {
                const wasDrawn = this._drawPageIntersection(
                  row, col, tileLeft, tileTop, tileRight, tileBottom,
                  scale, `${level}_${x}_${y}`, resolution, level, ctx
                );
                if (!wasDrawn) allPagesDrawn = false;
              }
            }

            // Update render rate stats only if successful
            if (allPagesDrawn) {
              ts._updateRenderRateWindow(1, 0);
            }

            return allPagesDrawn; // Return success flag
          }

          /**
           * Calculate tile bounds in grid coordinates
           */
          _getTileBounds(level, x, y) {
            const ts = this.tileStreamer;
            const scale = 1 << (ts.maxLevel - level);
            const width = ts.tileWidth * scale;
            const height = ts.tileHeight * scale;

            return {
              left: x * width,
              top: y * height,
              right: Math.min((x + 1) * width, ts.gridDims.totalWidth),
              bottom: Math.min((y + 1) * height, ts.gridDims.totalHeight),
              width,
              height,
              scale
            };
          }

          /**
           * Generate fingerprint for tile deduplication
           *
           * DEDUPLICATION RULES:
           * - All zoom levels: dedupe by page content + position within page
           * - At high zoom, tiles showing same region of same page(s) ARE equivalent
           * - Position is normalized to page grid, enabling deduplication across
           *   repeated page instances in the staggered pattern
           */
          _generateTileFingerprint(neededPages, level, x, y) {
            if (neededPages.length === 0) return 'empty';

            const ts = this.tileStreamer;
            const { totalWidth, totalHeight, pageWidth, pageHeight, spacing } = ts.gridDims;

            // Calculate tile dimensions at this level
            const scale = Math.pow(2, level - ts.maxLevel);
            const tileWidthInGrid = ts.tileWidth / scale;
            const tileHeightInGrid = ts.tileHeight / scale;

            // Tile position in grid coordinates
            const tileLeft = x * tileWidthInGrid;
            const tileTop = y * tileHeightInGrid;

            // Calculate tile position WITHIN a page cell (for high-zoom deduplication)
            // Page cell = page + spacing on each side
            const cellWidth = pageWidth + spacing;
            const cellHeight = pageHeight + spacing;

            // FIX: Use tile index modulo tiles-per-cell instead of position-based calculation
            // The old formula (tileLeft % cellWidth) / tileWidthInGrid fails when tileWidthInGrid ≈ cellWidth
            // because adjacent tiles both get floor() to 0, causing fingerprint collisions
            const tilesPerCellX = Math.max(1, Math.ceil(cellWidth / tileWidthInGrid));
            const tilesPerCellY = Math.max(1, Math.ceil(cellHeight / tileHeightInGrid));
            const posInCellX = x % tilesPerCellX;
            const posInCellY = y % tilesPerCellY;

            // Pages are contiguous - use min-max range
            const minPage = Math.min(...neededPages);
            const maxPage = Math.max(...neededPages);
            const pageRange = minPage === maxPage ? `${minPage}` : `${minPage}-${maxPage}`;

            // Check if tile is smaller than a page (high zoom)
            // Must be smaller in BOTH dimensions to be truly sub-page
            // A tile wider than pageWidth can span multiple pages horizontally
            const tileIsSmallerThanPage = (tileWidthInGrid < pageWidth) && (tileHeightInGrid < pageHeight);

            if (tileIsSmallerThanPage) {
              // High zoom: include position within page cell for deduplication
              // Tiles at same relative position in same page(s) are equivalent
              return `${pageRange}_${posInCellX}_${posInCellY}`;
            }

            // Low/mid zoom: tile contains full page(s)
            // Calculate number of tiles at this level
            const tilesWide = Math.ceil(totalWidth / tileWidthInGrid);
            const tilesHigh = Math.ceil(totalHeight / tileHeightInGrid);

            // Detect edge tiles: at the right or bottom boundary of the grid
            const isRightEdge = (x >= tilesWide - 1);
            const isBottomEdge = (y >= tilesHigh - 1);

            if (isRightEdge || isBottomEdge) {
              let edge = '';
              if (isRightEdge) edge += 'r';
              if (isBottomEdge) edge += 'b';
              return `${pageRange}_e${edge}`;
            }
            return pageRange;
          }
        }

        /**
         * Phase 2.2: CacheManager - Handles tile cache invalidation and page requests
         * Extracted from TileStreamer to improve modularity
         */
        class CacheManager {
          constructor(tileStreamer) {
            this.tileStreamer = tileStreamer;
            this._pendingRequests = new Set();
            this._redrawTimeout = null;
          }

          /**
           * Schedule a debounced redraw
           * Debounces 100ms to batch multiple page renders before triggering OSD redraw.
           */
          scheduleRedraw() {
            if (this._redrawTimeout) {
              clearTimeout(this._redrawTimeout);
            }
            this._redrawTimeout = setTimeout(() => {
              this._redrawTimeout = null;
              try {
                if (window.osdViewerRef?.world) {
                  window.osdViewerRef.world.needsDraw();
                  window.osdViewerRef.forceRedraw();
                }
              } catch (err) {
                // Silently ignore if OSD not ready
              }
            }, 100);
          }

          /**
           * Request pages asynchronously and invalidate affected tiles
           */
          _requestPagesAsync(pageNums, resolution) {
            const ts = this.tileStreamer;

            // Deduplicate requests
            const key = `${pageNums.join(',')}_${resolution}`;
            if (this._pendingRequests.has(key)) {
              return;
            }

            this._pendingRequests.add(key);

            ts.pageStreamer.requestPages(pageNums, resolution).then(() => {
              this._pendingRequests.delete(key);

              // Invalidate tiles that used these pages
              this._invalidateTilesUsingPages(pageNums, resolution);

              // SCALED BACK: Use lightweight needsDraw() instead of aggressive tiledImage.reset()
              // tiledImage.reset() causes flickering by forcing OSD to re-request all tiles
              // needsDraw() just marks the viewport as needing a repaint
              try {
                if (window.osdViewerRef && window.osdViewerRef.world) {
                  window.osdViewerRef.world.needsDraw();
                }
              } catch (err) {
                // Silently ignore
              }
            }).catch(err => {
              this._pendingRequests.delete(key);
              console.error('Error requesting pages:', err);
            });
          }

          /**
           * Invalidate cached tiles that depend on specific pages
           */
          _invalidateTilesUsingPages(pageNums, resolution) {
            const ts = this.tileStreamer;
            const pageSet = new Set(pageNums);
            let invalidated = 0;

            // Iterate through cached tiles and remove ones that used these pages
            for (const [key, value] of ts.tileCache.cache.entries()) {
              // Parse key to determine which pages it needs
              // Cache key format: "level_pageRange_posX_posY" or "level_pageRange_edge"
              // Example: "7_1_0_0" (page 1), "7_1-3_0_0" (pages 1-3), "7_empty" (no pages)
              // Match: level_ followed by page number(s), then anything
              const pageMatch = key.match(/^\d+_(\d+)(?:-(\d+))?/);
              if (pageMatch) {
                const firstPage = parseInt(pageMatch[1]);
                const lastPage = pageMatch[2] ? parseInt(pageMatch[2]) : firstPage;

                // Check if this tile used any of the newly-rendered pages
                for (let p = firstPage; p <= lastPage; p++) {
                  if (pageSet.has(p)) {
                    ts.tileCache.cache.delete(key);
                    invalidated++;
                    if (CONFIG.VERBOSE_LOGGING) {
                      console.log(`[TileStreamer] INVALIDATE: ${key} (page ${p} now ready)`);
                    }
                    break;
                  }
                }
              } else if (key.includes('empty')) {
                // Skip empty tiles - they don't depend on page content
              } else if (CONFIG.VERBOSE_LOGGING) {
                // Log tiles that don't match expected pattern
                console.log(`[TileStreamer] Unknown cache key format: ${key}`);
              }
            }

            if (invalidated > 0 && CONFIG.VERBOSE_LOGGING) {
              console.log(`[TileStreamer] Invalidated ${invalidated} tiles using pages [${pageNums.join(', ')}]`);
            }
          }
        }

        /**
         * TileStreamer: Generates tiles on-demand for OpenSeadragon deep zoom
         * Manages tile pyramid with power-of-2 level scaling
         * Handles rectangular tiles sized to (page+spacing)/renderScale
         * At 4x render scale: each page = 4×4 tiles at max zoom
         * Exploits grid periodicity opportunities for tile deduplication
         *
         * Phase 2: Modularized with extracted TileGenerator and CacheManager classes
         */
        class TileStreamer {
          constructor(gridDims, pattern, pageStreamer, numPages) {
            this.gridDims = gridDims;
            this.pattern = pattern;
            this.pageStreamer = pageStreamer;
            this.numPages = numPages;

            // Tile cache for rendered tiles
            this.tileCache = new TileCache(CONFIG.MAX_CACHE_SIZE);
            this.checkedCanvases = new Set(); // Track which pages we've already validated

            // Debounced tile refresh: Batch forceRedraw() calls to avoid excessive redraws
            this.redrawTimeout = null;
            this.redrawPending = false;

            // Background rendering queue: Bidirectional strategy (viewport-first + L0-down)
            // Solves cache thrashing by rendering low levels (few tiles) first
            this.backgroundQueue = {
              enabled: false,        // Start disabled, enable after OSD init
              currentLevel: 0,       // Current level being rendered (0 = L0)
              tilesInLevel: [],      // Tiles to render at current level
              levelIndex: 0,         // Index within current level's tiles
              isRunning: false,      // Is background rendering active
              stopRequested: false,  // Signal to stop background rendering
              batchSize: 10,         // Tiles to render per batch before yielding
              delayMs: 50,           // Delay between batches (ms) - keeps UI responsive
              startTime: null,       // When background rendering started (for grace period)
              gracePeriodMs: 3000,   // Don't allow stopping for first 3s (avoid OSD init animations)
              // High-res batch state (for levels > minimapMaxLevel)
              highResBatchIndex: 0,  // Current batch of pages being loaded (0-based)
              // Calculate batch size as 80% of high-res cache (leave 20% headroom)
              // Desktop (10 pages): 8 pages per batch
              // Mobile (50 pages): 40 pages per batch
              // User-adjusted: adapts automatically
              highResBatchSize: Math.max(1, Math.floor(CONFIG.PAGE_CACHE_MAX_SIZE_HIGH * 0.8)),
              highResPreloading: false // Currently preloading high-res pages
            };

            // Phase 2.3: Extract background rendering to BackgroundRenderer module
            this.backgroundRenderer = new BackgroundRenderer(this);

            // Phase 2.4: Extract quality inspection to QualityInspector module
            this.qualityInspector = new QualityInspector(this);

            // Phase 2.1: Extract tile generation to TileGenerator module
            this.tileGenerator = new TileGenerator(this);

            // Phase 2.2: Extract cache management to CacheManager module
            this.cacheManager = new CacheManager(this);

            // Pending tile jobs for async downloadTileStart pattern
            // Maps jobKey (level_x_y) to {context, canvas, ctx, missingPages, resolution, ...}
            this.pendingJobs = new Map();

            // Diagnostics: Track tile rendering
            this.stats = {
              tilesRendered: 0,          // Tiles rendered successfully
              cacheMisses: 0,            // Pages requested but not in cache
              onDemandRenders: 0,        // Pages rendered on-demand (triggered by cache miss)
              onDemandHits: 0,           // On-demand renders that completed before tile re-render
              // Render rate tracking (tiles/second)
              renderRateWindowMs: 1000,  // Time window for rate calculation (1 second)
              renderWindowStart: Date.now(), // Timestamp when current window started
              rendersInWindow: 0,        // Renders in current time window
              renderRate: 0              // Calculated tiles/sec
            };

            // Tile size = (page + spacing) / renderScale
            // At max zoom (4x render), each page+gutter spans 4×4 tiles
            const { pageWidth, pageHeight, spacing } = gridDims;
            const cellWidth = pageWidth + spacing;  // Grid cell size
            const cellHeight = pageHeight + spacing;

            this.tileWidth = cellWidth / CONFIG.PDF_RENDER_SCALE;
            this.tileHeight = cellHeight / CONFIG.PDF_RENDER_SCALE;

            // Calculate max level based on grid dimensions and tile size
            const widthLevels = Math.ceil(Math.log2(gridDims.totalWidth / this.tileWidth));
            const heightLevels = Math.ceil(Math.log2(gridDims.totalHeight / this.tileHeight));
            this.maxLevel = Math.max(widthLevels, heightLevels);

            // Calculate minimap max level (low zoom levels use low-res)
            this.minimapMaxLevel = this.calculateMinimapMaxLevel();

            // Tile canvas size matches tile grid size (NOT scaled by renderScale)
            // This keeps tile canvases small for memory efficiency
            // 1-pixel overlap helps on some browsers (iOS Safari) where subPixelRoundingForTransparency isn't enough
            this.tileOverlap = 1;
            this.tileCanvas = document.createElement('canvas');
            this.tileCanvas.width = Math.round(this.tileWidth + 2 * this.tileOverlap);
            this.tileCanvas.height = Math.round(this.tileHeight + 2 * this.tileOverlap);
            this.tileCtx = this.tileCanvas.getContext('2d', { alpha: false });

            if (CONFIG.VERBOSE_LOGGING) {
              console.log(`Tile size: ${this.tileWidth.toFixed(1)}×${this.tileHeight.toFixed(1)} (grid coords)`);
              console.log(`Tile canvas: ${this.tileCanvas.width}×${this.tileCanvas.height}px`);
              console.log(`Grid cell: ${cellWidth.toFixed(0)}×${cellHeight.toFixed(0)} (page ${pageWidth}×${pageHeight} + ${spacing}px spacing)`);
              console.log(`Max level: ${this.maxLevel}, At max zoom: each page+gutter = ${CONFIG.PDF_RENDER_SCALE}×${CONFIG.PDF_RENDER_SCALE} tiles`);
              console.log(`Canvas interpolation: low-zoom=${CONFIG.IMAGE_SMOOTHING_LOW_ZOOM}, high-zoom=${CONFIG.IMAGE_SMOOTHING_HIGH_ZOOM}, threshold=level ${CONFIG.IMAGE_SMOOTHING_THRESHOLD_LEVEL}`);
            }
          }

          /**
           * Calculate tile bounds in grid coordinates (for tile enumeration)
           * Abstracts repeated tile coordinate calculations with performance optimization
           *
           * CRITICAL: Custom pyramid where L0=overview (large tiles), maxLevel=detail (small tiles)
           * - L0: scale=64 → tiles cover 64x area → few tiles
           * - maxLevel: scale=1 → tiles cover 1x area → many tiles
           *
           * @param {number} level - Pyramid level (0 = overview, maxLevel = detail)
           * @param {number} x - Tile x coordinate at this level
           * @param {number} y - Tile y coordinate at this level
           * @returns {Object} Tile bounds {left, top, right, bottom, width, height, scale}
           */
          /**
           * Phase 2.1: Delegate to TileGenerator module
           */
          _getTileBounds(level, x, y) {
            return this.tileGenerator._getTileBounds(level, x, y);
          }

          /**
           * Update render rate statistics
           * Called whenever a tile is rendered to track tiles/second
           * Uses a sliding 1-second window to calculate current render rate
           */
          /**
           * Unified render rate window management
           * Consolidates duplicated logic from _updateRenderRate() and _checkRenderRateIdle()
           *
           * @param {number} increment - Number of renders to add to window (0 for idle check)
           */
          _updateRenderRateWindow(increment) {
            const now = Date.now();
            const elapsed = now - this.stats.renderWindowStart;

            // Increment counter for current window
            this.stats.rendersInWindow += increment;

            // If window has elapsed, calculate rate and reset window
            if (elapsed >= this.stats.renderRateWindowMs) {
              const seconds = elapsed / 1000;

              // Calculate rate (tiles per second)
              this.stats.renderRate = this.stats.rendersInWindow / seconds;

              // Reset window
              this.stats.renderWindowStart = now;
              this.stats.rendersInWindow = 0;
            }
          }

          /**
           * Update render rate after a tile render completes
           */
          _updateRenderRate() {
            this._updateRenderRateWindow(1);
          }

          /**
           * Update render rate to zero when no rendering is happening
           * Called periodically to ensure rate drops to zero when idle
           */
          _checkRenderRateIdle() {
            this._updateRenderRateWindow(0);
          }

          /**
           * Phase 2.2: Delegate to CacheManager module
           */
          scheduleRedraw() {
            return this.cacheManager.scheduleRedraw();
          }

          /**
           * Phase 2.3: Delegate to BackgroundRenderer module
           */
          startBackgroundRendering() {
            return this.backgroundRenderer.startBackgroundRendering();
          }

          /**
           * Phase 2.3: Delegate to BackgroundRenderer module
           */
          stopBackgroundRendering() {
            return this.backgroundRenderer.stopBackgroundRendering();
          }

          /**
           * Phase 2.3: Delegate to BackgroundRenderer module
           */
          resumeBackgroundRendering() {
            return this.backgroundRenderer.resumeBackgroundRendering();
          }

          /**
           * Phase 2.3: Delegate to BackgroundRenderer module
           */
          _processBackgroundQueue() {
            return this.backgroundRenderer._processBackgroundQueue();
          }

          /**
           * Phase 2.3: Delegate to BackgroundRenderer module
           */
          _renderTilesAsync(tiles, index, callback) {
            return this.backgroundRenderer._renderTilesAsync(tiles, index, callback);
          }

          /**
           * Get all tile coordinates for a given level
           * @param {number} level - Zoom level
           * @returns {Array} Array of {level, x, y} tile coordinates
           */
          _getTilesForLevel(level) {
            const tiles = [];
            // CRITICAL: Custom pyramid (L0=overview with 1 tile, maxLevel=detail with many tiles)
            // L0: scale=64 → tiles cover 64x area → 1 tile
            // maxLevel: scale=1 → tiles cover 1x area → many tiles
            const bounds = this._getTileBounds(level, 0, 0);

            // Calculate how many tiles cover the grid at this level
            const tilesWide = Math.ceil(this.gridDims.totalWidth / bounds.width);
            const tilesHigh = Math.ceil(this.gridDims.totalHeight / bounds.height);

            for (let y = 0; y < tilesHigh; y++) {
              for (let x = 0; x < tilesWide; x++) {
                tiles.push({ level, x, y });
              }
            }

            return tiles;
          }

          /**
           * Sort tiles by page-locality to minimize cache thrashing
           * Groups tiles that need similar page ranges together
           * Critical for L2+ where many tiles exist but cache < numPages
           *
           * @param {Array} tiles - Array of {level, x, y} tile coordinates
           * @returns {Array} Sorted tiles grouped by page locality
           */
          _sortTilesByPageLocality(tiles) {
            const level = tiles[0].level;

            // Calculate page ranges for each tile
            const tilesWithPages = tiles.map(tile => {
              const bounds = this._getTileBounds(level, tile.x, tile.y);
              const neededPages = this._calculateIntersectingPages(bounds.left, bounds.top, bounds.right, bounds.bottom);
              const minPage = neededPages.length > 0 ? Math.min(...neededPages) : 0;
              const maxPage = neededPages.length > 0 ? Math.max(...neededPages) : 0;

              return {
                ...tile,
                neededPages,
                minPage,
                maxPage,
                pageSpan: maxPage - minPage + 1
              };
            });

            // Sort by min page (primary) then max page (secondary)
            // This groups tiles that need consecutive page ranges
            tilesWithPages.sort((a, b) => {
              if (a.minPage !== b.minPage) {
                return a.minPage - b.minPage;
              }
              return a.maxPage - b.maxPage;
            });

            // Return just the tile coordinates (drop page metadata)
            return tilesWithPages.map(({ level, x, y }) => ({ level, x, y }));
          }

          /**
           * Calculate the maximum level for minimap (navigator) usage
           * Minimap shows entire grid, typically at lower zoom levels
           */
          calculateMinimapMaxLevel() {
            // Minimap typically operates at levels that show the full grid
            // Usually this is about 1/3 of the max level range
            return Math.max(0, Math.floor(this.maxLevel * 0.3));
          }

          /**
           * Calculate which pages intersect a tile
           * Returns array of page numbers that have POSITIVE-AREA intersection
           * (not just bounding-box touch - must actually contribute visible content)
           */
          _calculateIntersectingPages(tileLeft, tileTop, tileRight, tileBottom) {
            const { pageWidth, pageHeight, spacing, gridRows, gridCols } = this.gridDims;
            const intersectingPages = new Set(); // Use Set to avoid duplicates

            for (let row = 0; row < gridRows; row++) {
              for (let col = 0; col < gridCols; col++) {
                const pageNum = this.pattern[row][col];

                // Skip blank cells
                if (pageNum === 0) continue;

                // Calculate page position in grid (centered within cell)
                const halfSpacing = spacing / 2;
                const pageLeft = col * (pageWidth + spacing) + halfSpacing;
                const pageTop = row * (pageHeight + spacing) + halfSpacing;
                const pageRight = pageLeft + pageWidth;
                const pageBottom = pageTop + pageHeight;

                // Calculate actual intersection region
                const intersectLeft = Math.max(tileLeft, pageLeft);
                const intersectTop = Math.max(tileTop, pageTop);
                const intersectRight = Math.min(tileRight, pageRight);
                const intersectBottom = Math.min(tileBottom, pageBottom);

                // Only include page if intersection has POSITIVE AREA
                // This filters out tiles that only touch at edges (zero width/height)
                const hasPositiveArea = (intersectRight > intersectLeft) &&
                                        (intersectBottom > intersectTop);

                if (hasPositiveArea) {
                  intersectingPages.add(pageNum);
                }
              }
            }

            return Array.from(intersectingPages);
          }

          /**
           * Determine resolution needed for this zoom level
           */
          _getResolutionForLevel(level) {
            return level <= this.minimapMaxLevel ? 'low' : 'high';
          }

          /**
           * Generate content fingerprint for tile deduplication
           * Returns a signature based on page layout within the tile
           * Tiles with identical page arrangements get identical fingerprints
           */
          /**
           * Phase 2.1: Delegate to TileGenerator module
           */
          _generateTileFingerprint(neededPages, level, x, y) {
            return this.tileGenerator._generateTileFingerprint(neededPages, level, x, y);
          }
          /**
           * Phase 2: Delegates tile generation to TileGenerator module
           * Updated to use async downloadTileStart pattern for proper tile lifecycle management
           */
          getOSDConfig() {
            const self = this;

            return {
              height: this.gridDims.totalHeight,
              width: this.gridDims.totalWidth,
              tileSize: Math.max(this.tileWidth, this.tileHeight),
              getTileWidth: () => this.tileWidth,
              getTileHeight: () => this.tileHeight,
              tileOverlap: 0, // Per-job canvas doesn't need overlap
              minLevel: 0,
              maxLevel: this.maxLevel,

              // getTileUrl is REQUIRED by OSD even with downloadTileStart
              // OSD uses this to generate cache keys for tiles
              getTileUrl: function(level, x, y) {
                return `tile://${level}/${x}/${y}`;
              },

              // Provide tile coordinates via postData for downloadTileStart
              getTilePostData: function(level, x, y) {
                return { level, x, y };
              },

              // Async tile loading - overrides URL fetching
              downloadTileStart: function(context) {
                const { level, x, y } = context.postData;

                // DIAGNOSTIC: Log tile requests for debugging edge tile issues
                const tileKey = `${level}_${x}_${y}`;
                if (!window.__tileLog) window.__tileLog = { requests: [], aborts: [], completes: [] };
                window.__tileLog.requests.push({ key: tileKey, time: Date.now() });
                console.log(`[Tile REQUEST] ${tileKey}`);

                // Each tile gets its own canvas (OSD caches reference, not copy)
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(self.tileWidth);
                canvas.height = Math.round(self.tileHeight);
                const ctx = canvas.getContext('2d', { alpha: false });

                // Try to generate tile with current page cache
                const result = self.tryGenerateTile(level, x, y, ctx);

                // DIAGNOSTIC: Edge tile detection (Vector 17)
                if (result.tileBounds) {
                  const tb = result.tileBounds;
                  const actualWidth = tb.right - tb.left;
                  const actualHeight = tb.bottom - tb.top;
                  const isEdgeX = actualWidth < tb.width * 0.99; // Allow 1% tolerance
                  const isEdgeY = actualHeight < tb.height * 0.99;
                  if (isEdgeX || isEdgeY) {
                    console.log(`[EDGE TILE] ${tileKey}:`);
                    console.log(`  X: left=${tb.left.toFixed(0)}, right=${tb.right.toFixed(0)}, width=${tb.width.toFixed(0)}, actual=${actualWidth.toFixed(0)} (${(actualWidth/tb.width*100).toFixed(1)}%)`);
                    console.log(`  Y: top=${tb.top.toFixed(0)}, bottom=${tb.bottom.toFixed(0)}, height=${tb.height.toFixed(0)}, actual=${actualHeight.toFixed(0)} (${(actualHeight/tb.height*100).toFixed(1)}%)`);
                    console.log(`  neededPages: [${result.neededPages ? result.neededPages.join(', ') : 'none'}]`);
                    console.log(`  ready: ${result.ready}, missingPages: [${result.missingPages ? result.missingPages.join(', ') : 'none'}]`);
                    // Store in tile log for test access
                    if (window.__tileLog) {
                      if (!window.__tileLog.edgeTiles) window.__tileLog.edgeTiles = [];
                      window.__tileLog.edgeTiles.push({
                        key: tileKey,
                        bounds: { left: tb.left, right: tb.right, top: tb.top, bottom: tb.bottom },
                        nominal: { width: tb.width, height: tb.height },
                        actual: { width: actualWidth, height: actualHeight },
                        coverage: { x: actualWidth/tb.width, y: actualHeight/tb.height },
                        neededPages: result.neededPages || [],
                        ready: result.ready
                      });
                    }
                  }
                }

                if (result.ready) {
                  // All pages available - finish immediately
                  if (window.__tileLog) window.__tileLog.completes.push({ key: tileKey, time: Date.now(), immediate: true });
                  console.log(`[Tile COMPLETE] ${tileKey} (immediate)`);
                  context.finish(ctx);
                } else {
                  // Pages missing - queue for later
                  const jobKey = `${level}_${x}_${y}`;
                  self.pendingJobs.set(jobKey, {
                    context,
                    canvas,
                    ctx,
                    level,
                    x,
                    y,
                    missingPages: result.missingPages,
                    resolution: result.resolution,
                    neededPages: result.neededPages,
                    tileBounds: result.tileBounds,
                    requestTime: Date.now()
                  });

                  // Request missing pages
                  self.cacheManager._requestPagesAsync(result.missingPages, result.resolution);

                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Async Tile] Queued job ${jobKey}, waiting for pages: ${result.missingPages.join(', ')}`);
                  }
                }
              },

              downloadTileAbort: function(context) {
                const { level, x, y } = context.postData;
                const jobKey = `${level}_${x}_${y}`;

                // DIAGNOSTIC: Log tile aborts
                if (window.__tileLog) {
                  window.__tileLog.aborts.push({ key: jobKey, time: Date.now() });
                }
                console.log(`[Tile ABORT] ${jobKey}`);

                if (self.pendingJobs.delete(jobKey)) {
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Async Tile] Aborted job ${jobKey}`);
                  }
                }
              },

              // Cache handlers for context2D data (OSD stores reference to canvas context)
              createTileCache: function(cache, data) {
                cache._data = data;
              },
              destroyTileCache: function(cache) {
                cache._data = null;
              },
              getTileCacheData: function(cache) {
                return cache._data;
              },
              getTileCacheDataAsContext2D: function(cache) {
                return cache._data;
              }
            };
          }

          /**
           * Phase 2.1: Delegate to TileGenerator module
           */
          generateTile(level, x, y) {
            return this.tileGenerator.generateTile(level, x, y);
          }

          /**
           * Try to generate a tile - check if all needed pages are available
           * Used by async downloadTileStart pattern
           * @param {number} level - Tile level
           * @param {number} x - Tile x coordinate
           * @param {number} y - Tile y coordinate
           * @param {CanvasRenderingContext2D} ctx - Target context to render into
           * @returns {Object} { ready: boolean, missingPages?: [], resolution?: string, neededPages?: [], tileBounds?: {} }
           */
          tryGenerateTile(level, x, y, ctx) {
            // Calculate tile bounds
            const tileBounds = this.tileGenerator._getTileBounds(level, x, y);
            const { left: tileLeft, top: tileTop, right: tileRight, bottom: tileBottom } = tileBounds;

            // Find needed pages (same logic as generateTile)
            const neededPages = [];
            const { pageWidth, pageHeight, spacing, gridRows, gridCols } = this.gridDims;

            for (let row = 0; row < gridRows; row++) {
              for (let col = 0; col < gridCols; col++) {
                const halfSpacing = spacing / 2;
                const pageLeft = col * (pageWidth + spacing) + halfSpacing;
                const pageTop = row * (pageHeight + spacing) + halfSpacing;
                const pageRight = pageLeft + pageWidth;
                const pageBottom = pageTop + pageHeight;

                if (pageRight > tileLeft && pageLeft < tileRight &&
                    pageBottom > tileTop && pageTop < tileBottom) {
                  const pageNum = this.pattern[row][col];
                  if (pageNum !== 0 && !neededPages.includes(pageNum)) {
                    neededPages.push(pageNum);
                  }
                }
              }
            }
            neededPages.sort((a, b) => a - b);

            // Determine resolution based on level
            const resolution = level <= this.minimapMaxLevel ? 'low' : 'high';

            // Check which pages are available at the REQUIRED resolution
            // Vector 12 Fix: No fallback - only accept correct resolution
            // This ensures stable level-to-resolution mapping (impedance matching)
            const pageCache = this.pageStreamer._getPageCache(resolution);

            const missingPages = neededPages.filter(p => {
              const hasCorrectResolution = pageCache.has(`${p}_${resolution}`);
              return !hasCorrectResolution;
            });

            if (missingPages.length > 0) {
              // Not ready - return info for pending job
              return { ready: false, missingPages, resolution, neededPages, tileBounds };
            }

            // Ready - render to provided context
            // Check if composition succeeded (all pages drawn)
            const success = this.tileGenerator._renderTileToContext(level, x, y, ctx, resolution, neededPages, tileBounds);
            if (!success) {
              // Composition failed (page evicted during render) - treat as not ready
              // Re-check which pages are actually missing now
              const stillMissing = neededPages.filter(p => {
                const hasCorrectResolution = pageCache.has(`${p}_${resolution}`);
                return !hasCorrectResolution;
              });

              if (CONFIG.VERBOSE_LOGGING) {
                console.log(`[COMPOSITION FAILED] tile ${level}_${x}_${y}: pages ${stillMissing.join(',')} evicted during render`);
              }
              return { ready: false, missingPages: stillMissing, resolution, neededPages, tileBounds };
            }
            return { ready: true };
          }

          /**
           * Complete pending tile jobs when pages become available
           * Called after pages finish rendering
           * @param {Array} renderedPages - Page numbers that just finished rendering (optional, for optimization)
           */
          finishPendingJobs(renderedPages = null) {
            if (this.pendingJobs.size === 0) return;

            const jobsToComplete = [];

            // Check each pending job
            for (const [jobKey, job] of this.pendingJobs) {
              // Check if all missing pages are now available at REQUIRED resolution
              // Vector 12 Fix: No fallback - only complete when correct resolution ready
              const pageCache = this.pageStreamer._getPageCache(job.resolution);

              const stillMissing = job.missingPages.filter(p => {
                const hasCorrectResolution = pageCache.has(`${p}_${job.resolution}`);
                return !hasCorrectResolution;
              });

              if (stillMissing.length === 0) {
                jobsToComplete.push(jobKey);
              }
            }

            // Complete ready jobs
            for (const jobKey of jobsToComplete) {
              const job = this.pendingJobs.get(jobKey);
              if (job) {
                // Render to job's canvas - check if composition succeeded
                const success = this.tileGenerator._renderTileToContext(
                  job.level, job.x, job.y, job.ctx,
                  job.resolution, job.neededPages, job.tileBounds
                );

                if (success) {
                  // Signal OSD that tile is ready
                  if (window.__tileLog) window.__tileLog.completes.push({ key: jobKey, time: Date.now(), immediate: false });
                  console.log(`[Tile COMPLETE] ${jobKey} (delayed)`);
                  job.context.finish(job.ctx);
                  this.pendingJobs.delete(jobKey);

                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[Async Tile] Completed pending job ${jobKey}`);
                  }
                } else {
                  // Composition failed - keep job in queue, will retry next time
                  if (CONFIG.VERBOSE_LOGGING) {
                    console.log(`[COMPOSITION FAILED] ${jobKey}: keeping in queue for retry`);
                  }
                }
              }
            }

            // Trigger OSD redraw to display completed tiles
            if (jobsToComplete.length > 0 && window.osdViewerRef) {
              window.osdViewerRef.world.needsDraw();
            }
          }

          /**
           * Async helper to request pages in background
           * When done, triggers OSD redraw
           */
          /**
           * Phase 2.2: Delegate to CacheManager module
           */
          _requestPagesAsync(pageNums, resolution) {
            return this.cacheManager._requestPagesAsync(pageNums, resolution);
          }

          /**
           * Phase 2.2: Delegate to CacheManager module
           */
          _invalidateTilesUsingPages(pageNums, resolution) {
            return this.cacheManager._invalidateTilesUsingPages(pageNums, resolution);
          }

          /**
           * Phase 2.4: Delegate to QualityInspector module
           */
          getVisibleTiles() {
            return this.qualityInspector.getVisibleTiles();
          }

          /**
           * Phase 2.4: Delegate to QualityInspector module
           */
          getLowResLevels(maxPagesPerTile = 4) {
            return this.qualityInspector.getLowResLevels(maxPagesPerTile);
          }

          /**
           * Phase 2.4: Delegate to QualityInspector module
           */
          inspectTileQuality(additionalLevels = 'lowres') {
            return this.qualityInspector.inspectTileQuality(additionalLevels);
          }

          /**
           * Phase 2.4: Delegate to QualityInspector module
           */
