                console.log('PDF loading cancelled by user');
                setIsLoading(false);
                setLoadingStatus('');
                setPdfFile(null);
              } else {
                throw error;
              }
            }
          };

          /**
           * Viewport history tracker for velocity-based prediction
           */
          const viewportHistory = {
            positions: [], // Array of {x, y, timestamp}
            maxSize: CONFIG.VELOCITY_HISTORY_SIZE,

            add(x, y) {
              const now = performance.now();
              this.positions.push({ x, y, timestamp: now });

              // Keep only recent history
              if (this.positions.length > this.maxSize) {
                this.positions.shift();
              }
            },

            getVelocity() {
              if (this.positions.length < 2) {
                return { vx: 0, vy: 0, magnitude: 0 };
              }

              // Calculate velocity from first to last position in history
              const first = this.positions[0];
              const last = this.positions[this.positions.length - 1];
              const dt = (last.timestamp - first.timestamp) / 1000; // seconds

              if (dt === 0) {
                return { vx: 0, vy: 0, magnitude: 0 };
              }

              const vx = (last.x - first.x) / dt;
              const vy = (last.y - first.y) / dt;
              const magnitude = Math.sqrt(vx * vx + vy * vy);

              return { vx, vy, magnitude };
            },

            clear() {
              this.positions = [];
            }
          };

          /**
           * Calculate viewport-aware priority for pages with velocity-based prediction
           * Returns pages sorted by distance from predicted viewport (closest = highest priority)
           */
          const calculateViewportPriority = (viewer, numPages, gridPattern) => {
            if (!viewer?.viewport) {
              // Fallback: sequential order if viewport not ready
              return Array.from({length: numPages}, (_, i) => i + 1);
            }

            const viewport = viewer.viewport;
            const bounds = viewport.getBounds();
            const centerX = bounds.x + bounds.width / 2;
            const centerY = bounds.y + bounds.height / 2;

            // Track viewport position for velocity calculation
            if (CONFIG.PREDICTIVE_RENDERING_ENABLED) {
              viewportHistory.add(centerX, centerY);
            }

            // Get current velocity
            const velocity = CONFIG.PREDICTIVE_RENDERING_ENABLED
              ? viewportHistory.getVelocity()
              : { vx: 0, vy: 0, magnitude: 0 };

            // Calculate predicted viewport center based on velocity
            const lookahead = velocity.magnitude * CONFIG.VELOCITY_LOOKAHEAD_MULTIPLIER;
            const predictedCenterX = centerX + (velocity.magnitude > 0 ? (velocity.vx / velocity.magnitude) * lookahead : 0);
            const predictedCenterY = centerY + (velocity.magnitude > 0 ? (velocity.vy / velocity.magnitude) * lookahead : 0);

            // Calculate priority for each page based on distance from predicted viewport
            const pagePriorities = [];
            for (let pageNum = 1; pageNum <= numPages; pageNum++) {
              // Find page position in grid (simplified - assumes pages appear in order)
              // For more complex grids, would need to search gridPattern
              const pageIndex = pageNum - 1;
              const gridSize = Math.ceil(Math.sqrt(numPages));
              const row = Math.floor(pageIndex / gridSize);
              const col = pageIndex % gridSize;

              // Calculate page center in viewport coordinates
              const pageX = col + 0.5;
              const pageY = row + 0.5;

              // Distance from current viewport center
              const currentDistance = Math.sqrt(
                Math.pow(pageX - centerX, 2) +
                Math.pow(pageY - centerY, 2)
              );

              // Distance from predicted viewport center
              const predictedDistance = Math.sqrt(
                Math.pow(pageX - predictedCenterX, 2) +
                Math.pow(pageY - predictedCenterY, 2)
              );

              // Weighted distance: blend current and predicted based on velocity magnitude
              // Higher velocity = more weight on predicted position
              const velocityWeight = CONFIG.PREDICTIVE_RENDERING_ENABLED
                ? Math.min(velocity.magnitude * CONFIG.VELOCITY_DIRECTION_WEIGHT, 1.0)
                : 0;
              const distance = (1 - velocityWeight) * currentDistance + velocityWeight * predictedDistance;

              pagePriorities.push({ pageNum, distance, currentDistance, predictedDistance, velocityWeight });
            }

            // Sort by weighted distance (closest to predicted path = highest priority)
            pagePriorities.sort((a, b) => a.distance - b.distance);

            // Debug logging for first re-prioritization
            if (CONFIG.DEBUG_MODE && velocity.magnitude > 0.1) {
              const top5 = pagePriorities.slice(0, 5).map(p => p.pageNum);
              console.log(`[Predictive] Velocity: (${velocity.vx.toFixed(2)}, ${velocity.vy.toFixed(2)}), mag=${velocity.magnitude.toFixed(2)}, weight=${pagePriorities[0].velocityWeight.toFixed(2)}, top5: ${top5.join(',')}`);
            }

            return pagePriorities.map(p => p.pageNum);
          };

          /**
           * Parallel viewport-aware rendering
           * Renders pages in parallel based on proximity to viewport
           */
          const renderParallelViewportAware = async (pageStreamer, viewer, numPages, resolution = 'low') => {
            // Detect number of parallel workers
            // Sweet spot appears to be ~10 workers for parallel canvas rendering
            // Too many workers causes contention, too few is slow
            const isIOSSafari = /iPhone|iPad|iPod/.test(navigator.userAgent);
            const cpuCores = navigator.hardwareConcurrency || 4;
            const maxWorkers = isIOSSafari
              ? CONFIG.PARALLEL_WORKERS_MOBILE
              : (CONFIG.PARALLEL_WORKERS_DESKTOP || 10);

            console.log(`[Parallel Render] Starting with ${maxWorkers} workers (CPU cores: ${cpuCores}, iOS: ${isIOSSafari})`);

            // Diagnostics tracking
            const renderStats = {
              totalPages: numPages,
              rendered: 0,
              skipped: 0,  // Already cached
              failed: 0,
              startTime: performance.now(),
              activeWorkers: 0,
              maxActiveWorkers: 0
            };

            // Store stats globally for diagnostics
            window.__parallelRenderStats = renderStats;

            // Get priority-sorted page list
            const priorityPages = calculateViewportPriority(viewer, numPages, null);
            const cacheKey = `_${resolution}`;

            // Filter out already-cached pages
            const pagesToRender = priorityPages.filter(pageNum => {
              const cached = pageStreamer.lowResPageCache.has(`${pageNum}${cacheKey}`) ||
                            pageStreamer.highResPageCache.has(`${pageNum}${cacheKey}`);
              if (cached) renderStats.skipped++;
              return !cached;
            });

            console.log(`[Parallel Render] Queue: ${pagesToRender.length} pages to render (${renderStats.skipped} already cached)`);

            // Render pages in parallel batches with continuous viewport-aware re-prioritization
            let reprioritizeCounter = 0;
            const REPRIORITIZE_INTERVAL = 1; // Re-prioritize every N batches (1 = every batch for responsive panning)

            while (pagesToRender.length > 0) {
              // Check if loading was cancelled
              if (loadingCancelledRef.current) {
                console.log('[Parallel Render] Cancelled by user');
                return renderStats;
              }

              // Re-prioritize queue based on current viewport every N batches
              if (reprioritizeCounter % REPRIORITIZE_INTERVAL === 0 && reprioritizeCounter > 0) {
                const freshPriority = calculateViewportPriority(viewer, numPages, null);
                // Keep only unrendered pages, sorted by current viewport distance
                const unrenderedSet = new Set(pagesToRender);
                pagesToRender = freshPriority.filter(p => unrenderedSet.has(p));
                console.log(`[Parallel Render] Re-prioritized queue based on current viewport (${pagesToRender.length} pages remaining)`);
              }
              reprioritizeCounter++;

              // Get next batch of pages (closest to current viewport)
              const batch = pagesToRender.splice(0, Math.min(maxWorkers, pagesToRender.length));
              renderStats.activeWorkers = batch.length;
              renderStats.maxActiveWorkers = Math.max(renderStats.maxActiveWorkers, batch.length);

              const batchStartTime = performance.now();
              console.log(`[Parallel Render] Batch ${reprioritizeCounter}: rendering ${batch.length} pages (${batch.slice(0, 5).join(', ')}...)`);

              // Render batch in parallel
              const promises = batch.map(pageNum =>
                pageStreamer.renderPage(pageNum, resolution)
                  .then(() => {
                    renderStats.rendered++;
                    if (renderStats.rendered % 10 === 0) {
                      const elapsed = ((performance.now() - renderStats.startTime) / 1000).toFixed(1);
                      const rate = (renderStats.rendered / elapsed).toFixed(1);
                      console.log(`[Parallel Render] Progress: ${renderStats.rendered}/${renderStats.totalPages} (${rate} pages/sec, ${renderStats.activeWorkers} workers)`);
                    }
                  })
                  .catch(err => {
                    console.error(`[Parallel Render] Failed page ${pageNum}:`, err);
                    renderStats.failed++;
                  })
              );

              // Wait for batch to complete
              await Promise.all(promises);

              const batchElapsed = ((performance.now() - batchStartTime) / 1000).toFixed(2);
              console.log(`[Parallel Render] Batch ${reprioritizeCounter} complete: ${batch.length} pages in ${batchElapsed}s (${(batch.length / parseFloat(batchElapsed)).toFixed(1)} pages/sec)`);

              // Update diagnostics
              renderStats.activeWorkers = 0;

              // Yield to browser after each batch
              await new Promise(resolve => setTimeout(resolve, 0));
            }

            const elapsed = ((performance.now() - renderStats.startTime) / 1000).toFixed(2);
            const rate = (renderStats.rendered / elapsed).toFixed(1);
            console.log(`[Parallel Render] Complete: ${renderStats.rendered} pages in ${elapsed}s (${rate} pages/sec, max ${renderStats.maxActiveWorkers} workers)`);

            return renderStats;
          };

          /**
           * Background rendering of remaining low-res pages for minimap
           * Non-blocking, yields to browser to keep UI responsive
           * Sequential rendering for simplicity
           * @param {boolean} lazy - If true, render slowly with longer delays (iOS mode)
           */
          const renderLowResInBackground = async (pageStreamer, numPages, startPage = 1, lazy = false) => {
            const mode = lazy ? 'lazy' : 'normal';
            console.log(`Starting background minimap rendering from page ${startPage + 1}... (${mode} mode)`);

            for (let pageNum = startPage + 1; pageNum <= numPages; pageNum++) {

              // Check if loading was cancelled
              if (loadingCancelledRef.current) {
                console.log('[Background] Rendering cancelled by user');
                return;
              }

              // Check if already cached
              if (pageStreamer.lowResPageCache.has(`${pageNum}_low`)) {
                continue;
              }

              // Render low-res page
              await pageStreamer.renderPage(pageNum, 'low');

              // Yield to browser - more frequently in lazy mode
              if (lazy) {
                // Lazy mode: Yield after EVERY page with longer delay (iOS)
                await new Promise(resolve => setTimeout(resolve, 10));
              } else {
                // Normal mode: Yield every 5 pages with minimal delay (desktop)
                if (pageNum % 5 === 0) {
                  await new Promise(resolve => setTimeout(resolve, 0));
                }
              }

              // Log progress periodically
              if (pageNum % 10 === 0 || pageNum === numPages) {
                const cacheStats = pageStreamer.getCacheStats();
                console.log(`Background minimap: ${cacheStats.low}/${numPages} pages rendered`);
              }
            }

            // Verify all pages actually rendered
            const finalStats = pageStreamer.getCacheStats();
            console.log(`[Background] Loop completed: ${finalStats.low}/${numPages} low-res pages in cache`);

            // Debug: List any missing low-res pages
            if (CONFIG.DEBUG_MODE) {
              const missingLowRes = [];
              for (let i = 1; i <= numPages; i++) {
                if (!pageStreamer.hasPage(i, 'low')) {
                  missingLowRes.push(i);
                }
              }
              if (missingLowRes.length > 0) {
                console.warn(`[Background] WARNING: Missing low-res pages: [${missingLowRes.join(',')}]`);
              } else {
                console.log(`[Background] All ${numPages} low-res pages confirmed in cache`);
              }

              // Debug: Check pages 7-10 for transparency (only log if blank)
              for (let pageNum = 7; pageNum <= 10; pageNum++) {
                const canvas = pageStreamer.lowResPageCache.get(`${pageNum}_low`);
                if (canvas) {
                  const ctx = canvas.getContext('2d');
                  const centerX = Math.floor(canvas.width / 2);
                  const centerY = Math.floor(canvas.height / 2);
                  const pixelData = ctx.getImageData(centerX, centerY, 1, 1).data;
                  if (pixelData[3] === 0) {
                    console.warn(`[Background] Page ${pageNum}_low is BLANK!`);
                  }
                }
              }
            }

            // Ensure level 0 tile (overview) is generated with all pages before recreation
            if (window.tileStreamerRef && window.osdViewerRef) {
              console.log('[Background] All pages ready - ensuring level 0 tile is complete...');

              // Explicitly generate level 0 tile to ensure it has all pages
              // This is the overview tile that shows the entire grid
              try {
                window.tileStreamerRef.generateTile(0, 0, 0);
                console.log('[Background] Level 0 overview tile generated with all pages');
              } catch (error) {
                console.warn('[Background] Could not pre-generate level 0 tile:', error);
              }

              // Now do final TiledImage recreation for clean slate
              console.log('[Background] Recreating TiledImage with all pages complete...');

              try {
                const viewer = window.osdViewerRef;
                const currentZoom = viewer.viewport.getZoom();
                const currentCenter = viewer.viewport.getCenter();

                // Clear tile cache so new TiledImage gets fresh tiles with all pages
                console.log('[Background] Clearing tile cache for fresh regeneration...');
                window.tileStreamerRef.cache.clear();
                console.log('[Background] Tile cache cleared');

                console.log('[Background] About to remove old TiledImage...');
                // Remove old TiledImage
                const oldTiledImage = viewer.world.getItemAt(0);
                if (oldTiledImage) {
                  viewer.world.removeItem(oldTiledImage);
                  console.log('[Background] Old TiledImage removed');
                }

                // Wait for cleanup
                await new Promise(resolve => setTimeout(resolve, 50));

                // Add fresh TiledImage
                viewer.addTiledImage({
                  tileSource: window.tileStreamerRef.getOSDConfig(),
                  success: () => {
                    viewer.viewport.zoomTo(currentZoom, null, true);
                    viewer.viewport.panTo(currentCenter, true);
                    console.log('[Background] TiledImage recreation complete - all tiles have full content!');
                  }
                });
              } catch (error) {
                console.error('[Background] Error recreating TiledImage:', error);
              }
            }

            console.log('[Background] Progressive minimap rendering complete');
          };

          const loadPDFFromURL = async (url, skipHistory = false) => {
            loadingCancelledRef.current = false; // Reset cancel flag
            setIsLoading(true);
            setLoadingStatus('Loading PDF...');
            setPdfFile({ name: url }); // Store URL as "file" for display

            // Update input field immediately to show what's being loaded
            setUrlInput(url);

            // Allow UI to update (show spinner) before heavy work starts
            await new Promise(resolve => setTimeout(resolve, 50));

            // Update URL parameter to reflect loaded file
            if (!skipHistory) {
              if (url.startsWith('http://') || url.startsWith('https://')) {
                URLManager.pushState('url', url);
              } else {
                URLManager.pushState('pdf', url);
              }
            }

            try {
              const pdf = await PDFUtils.loadPDFFromURL(url);
              await loadPDF(pdf, url);
            } catch (error) {
              if (error.message === 'Loading cancelled by user') {
                console.log('Loading cancelled');
                setPdfFile(null);
              } else {
                console.error('Error loading PDF from URL:', error);
                setPdfFile(null); // Clear pdfFile to show instruction screen
              }
              setIsLoading(false);
              setLoadingStatus('');
              if (error.message !== 'Loading cancelled by user') {
                throw error; // Re-throw for auto-load handler
              }
            }
          };

          const handleFileUpload = async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            loadingCancelledRef.current = false; // Reset cancel flag
            setIsLoading(true);
            setLoadingStatus('Loading PDF...');
            setPdfFile(file);
            setUrlInput(file.name); // Show filename in URL bar

            // Allow UI to update (show spinner) before heavy work starts
            await new Promise(resolve => setTimeout(resolve, 50));

            // Update URL parameter to reflect loaded file (adds to browser history)
            URLManager.pushState('pdf', file.name);

            try {
              const pdf = await PDFUtils.loadPDFFromFile(file);
              await loadPDF(pdf, file.name);

              // Save to storage for faster refresh
              const fileData = await file.arrayBuffer();
              pdfFileSizeRef.current = fileData.byteLength; // Track PDF file size
              await PDFStorage.save(fileData, file.name);
            } catch (error) {
              if (error.message === 'Loading cancelled by user') {
                console.log('Loading cancelled');
                setPdfFile(null);
              } else {
                console.error('Error loading PDF:', error);
                alert('Error loading PDF: ' + error.message);
              }
              setIsLoading(false);
              setLoadingStatus('');
            }
          };

          const handleUrlLoad = async () => {
            const url = urlInput.trim();
            if (!url) {
              alert('Please enter a URL');
              return;
            }

            // Validate URL format
            if (!url.startsWith('http://') && !url.startsWith('https://') && !url.endsWith('.pdf')) {
              alert('Please enter a valid URL starting with http:// or https://\n\nExample: https://example.com/document.pdf');
              return;
            }

            // Check if URL looks like a PDF
            const urlLower = url.toLowerCase();
            if (!urlLower.endsWith('.pdf') && !urlLower.includes('.pdf?') && !urlLower.includes('.pdf#')) {
              const proceed = confirm(
                'The URL doesn\'t appear to be a PDF file.\n\n' +
                'URL: ' + url + '\n\n' +
                'Do you want to try loading it anyway?'
              );
              if (!proceed) {
                return;
              }
            }

            try {
              await loadPDFFromURL(url);
              // URL is now displayed in the input field by loadPDFFromURL
            } catch (error) {
              let errorMsg = 'Error loading PDF from URL:\n\n' + error.message;

              // Provide helpful hints for common errors
              if (error.message.includes('Invalid PDF structure')) {
                errorMsg += '\n\nTip: Make sure the URL points directly to a PDF file, not an HTML page.';
              } else if (error.message.includes('NetworkError') || error.message.includes('CORS')) {
                errorMsg += '\n\nTip: The server may not allow cross-origin requests. Try a different PDF URL.';
              }

              alert(errorMsg);
            }
          };

          const handleUrlKeyPress = (event) => {
            if (event.key === 'Enter') {
              handleUrlLoad();
            }
          };

          const handleStopLoading = () => {
            loadingCancelledRef.current = true;
            // Immediately hide the spinner for instant feedback
            setIsLoading(false);
            setLoadingStatus('');
            setPdfFile(null);
          };

          const initializeViewer = (numPages, pageWidth, pageHeight, showNavigator = false) => {
            // Clean up existing viewer
            if (osdViewerRef.current) {
              osdViewerRef.current.destroy();
            }

            const viewerElement = document.getElementById('openseadragon-viewer');
            if (!viewerElement) {
              console.error('Viewer element not found');
              return;
            }

            // Generate grid pattern and dimensions
            const pattern = GridPattern.generate(numPages, numPages);
            const gridDims = GridPattern.calculateDimensions(numPages, pageWidth, pageHeight, pattern);

            // Create tile streamer with PageStreamer
            const pageStreamer = window.pageStreamerRef;
            const tileStreamer = new TileStreamer(
              gridDims,
              pattern,
              pageStreamer,  // PageStreamer instance
              numPages
            );
            tileStreamerRef.current = tileStreamer;
            window.tileStreamerRef = tileStreamer; // Store globally for debugging

            // Expose periodicity analysis function globally
            window.analyzePeriodicityPatterns = () => tileStreamer.analyzePeriodicityPatterns();

            // Store grid dimensions globally for viewer recreation
            window.gridPageWidth = pageWidth;
            window.gridPageHeight = pageHeight;
            window.gridSize = gridDims.gridSize;

            // Initialize OpenSeadragon viewer
            const viewer = OSDManager.initialize(tileStreamer, pageWidth, pageHeight, gridDims.gridSize, showNavigator);
            osdViewerRef.current = viewer;
            window.osdViewerRef = viewer; // Store globally for async tile updates

            // Expose diagnostics API for automated testing
            window.__PDFGridDiagnostics = {
              getPageCacheSize: () => (pageStreamer?.lowResPageCache.size || 0) + (pageStreamer?.highResPageCache.size || 0),
              getTileCacheSize: () => tileStreamer?.tileCache.cache.size || 0,
              getCacheStats: () => {
                const pageStats = pageStreamer?.getCacheStats() || { low: 0, high: 0 };
                const tileStats = tileStreamer?.stats || {
                  tilesRenderedFull: 0,
                  tilesRenderedFallback: 0,
                  cacheMisses: 0,
                  onDemandRenders: 0,
                  onDemandHits: 0
                };
                return {
                  pages: {
                    low: pageStats.low,
                    high: pageStats.high,
                    total: pageStats.low + pageStats.high
                  },
                  tiles: tileStreamer?.tileCache.cache.size || 0,
                  tileRenderStats: {
                    full: tileStats.tilesRenderedFull,
                    fallback: tileStats.tilesRenderedFallback,
                    total: tileStats.tilesRenderedFull + tileStats.tilesRenderedFallback,
                    fallbackPercentage: tileStats.tilesRenderedFull + tileStats.tilesRenderedFallback > 0
                      ? ((tileStats.tilesRenderedFallback / (tileStats.tilesRenderedFull + tileStats.tilesRenderedFallback)) * 100).toFixed(1)
                      : 0
                  },
                  cacheMisses: tileStats.cacheMisses,
                  onDemandRenders: tileStats.onDemandRenders,
                  onDemandHits: tileStats.onDemandHits,
                  minimapMaxLevel: tileStreamer?.minimapMaxLevel,
                  renderScale: CONFIG.PDF_RENDER_SCALE,
                  lowResScale: CONFIG.PDF_LOWRES_SCALE
                };
              },
              getCurrentZoom: () => viewer?.viewport?.getZoom() || 0,
              getMemoryStats: () => {
                try {
                  let tileCacheMB = 0;
                  let tileCacheCount = 0;
                  let lowResPageCacheMB = 0;
                  let lowResPageCacheCount = 0;
                  let highResPageCacheMB = 0;
                  let highResPageCacheCount = 0;

                  // Calculate tile cache memory (actual canvas dimensions)
                  if (tileStreamer?.tileCache?.cache) {
                    for (const canvas of tileStreamer.tileCache.cache.values()) {
                      if (canvas && canvas.width && canvas.height) {
                        tileCacheMB += (canvas.width * canvas.height * 4) / (1024 * 1024);
                        tileCacheCount++;
                      }
                    }
                  }

                  // Calculate page cache memory (actual canvas dimensions)
                  if (pageStreamer) {
                    if (pageStreamer.lowResPageCache?.cache) {
                      for (const canvas of pageStreamer.lowResPageCache.cache.values()) {
                        if (canvas && canvas.width && canvas.height) {
                          lowResPageCacheMB += (canvas.width * canvas.height * 4) / (1024 * 1024);
                          lowResPageCacheCount++;
                        }
                      }
                    }
                    if (pageStreamer.highResPageCache?.cache) {
                      for (const canvas of pageStreamer.highResPageCache.cache.values()) {
                        if (canvas && canvas.width && canvas.height) {
                          highResPageCacheMB += (canvas.width * canvas.height * 4) / (1024 * 1024);
                          highResPageCacheCount++;
                        }
                      }
                    }
                  }

                  const totalMB = tileCacheMB + lowResPageCacheMB + highResPageCacheMB;

                  // Get PDF file size from ref
                  const pdfFileSizeMB = parseFloat((pdfFileSizeRef.current / (1024 * 1024)).toFixed(2));

                  return {
                    totalMB: parseFloat(totalMB.toFixed(2)),
                    tileCacheMB: parseFloat(tileCacheMB.toFixed(2)),
                    tileCacheCount,
                    avgTileMB: tileCacheCount > 0 ? parseFloat((tileCacheMB / tileCacheCount).toFixed(3)) : 0,
                    lowResPageCacheMB: parseFloat(lowResPageCacheMB.toFixed(2)),
                    lowResPageCacheCount,
                    avgLowResPageMB: lowResPageCacheCount > 0 ? parseFloat((lowResPageCacheMB / lowResPageCacheCount).toFixed(3)) : 0,
                    highResPageCacheMB: parseFloat(highResPageCacheMB.toFixed(2)),
                    highResPageCacheCount,
                    avgHighResPageMB: highResPageCacheCount > 0 ? parseFloat((highResPageCacheMB / highResPageCacheCount).toFixed(3)) : 0,
                    pdfFileSizeMB
                  };
                } catch (error) {
                  console.error('[getMemoryStats] Error calculating memory:', error);
                  return {
                    totalMB: 0,
                    tileCacheMB: 0,
                    tileCacheCount: 0,
                    avgTileMB: 0,
                    lowResPageCacheMB: 0,
                    lowResPageCacheCount: 0,
                    avgLowResPageMB: 0,
                    highResPageCacheMB: 0,
                    highResPageCacheCount: 0,
                    avgHighResPageMB: 0,
                    pdfFileSizeMB: 0
                  };
                }
              },
              clearCaches: () => {
                pageStreamer?.clear();
                tileStreamer?.tileCache.cache.clear();
                return 'Caches cleared';
              },
              getParallelRenderStats: () => {
                const stats = window.__parallelRenderStats || null;
                if (!stats) return null;

                const elapsed = stats.startTime ? ((performance.now() - stats.startTime) / 1000).toFixed(2) : 0;
                const rate = elapsed > 0 ? (stats.rendered / elapsed).toFixed(1) : 0;

                return {
                  enabled: CONFIG.PARALLEL_RENDERING_ENABLED,
                  workers: CONFIG.PARALLEL_WORKERS_DESKTOP || navigator.hardwareConcurrency || 4,
                  totalPages: stats.totalPages,
                  rendered: stats.rendered,
                  skipped: stats.skipped,
                  failed: stats.failed,
                  activeWorkers: stats.activeWorkers,
                  maxActiveWorkers: stats.maxActiveWorkers,
                  elapsedSeconds: parseFloat(elapsed),
                  pagesPerSecond: parseFloat(rate)
                };
              },
              // iOS-friendly diagnostic display
              showDebug: () => {
                const stats = window.__PDFGridDiagnostics.getCacheStats();
                const tileDebug = window.__tileCacheDebug ? '\n\nRecent tiles:\n' + window.__tileCacheDebug.join('\n') : '';
                alert(`PageCache: ${stats.pages.low} low-res, ${stats.pages.high} high-res\nTileCache: ${stats.tiles}\n\nTiles Rendered:\n  Full: ${stats.tileRenderStats.full}\n  Fallback: ${stats.tileRenderStats.fallback}\n  Fallback %: ${stats.tileRenderStats.fallbackPercentage}%\nCache Misses: ${stats.cacheMisses}\n\nminimapMaxLvl: ${stats.minimapMaxLevel}\nRender: ${stats.renderScale}x, LowRes: ${stats.lowResScale}x\niOS: ${isIOSSafari ? 'YES' : 'NO'}\nDEBUG: ${CONFIG.VERBOSE_LOGGING ? 'ON' : 'OFF'}${tileDebug}`);
              },
              // Test tile intersection calculation
              getTileIntersections: (level, x, y) => {
                if (!tileStreamer) return null;

                const scale = Math.pow(2, level - tileStreamer.maxLevel);
                const tileWidthInGrid = tileStreamer.tileWidth / scale;
                const tileHeightInGrid = tileStreamer.tileHeight / scale;

                const tileLeft = x * tileWidthInGrid;
                const tileTop = y * tileHeightInGrid;
                const tileRight = Math.min(tileLeft + tileWidthInGrid, tileStreamer.gridDims.totalWidth);
                const tileBottom = Math.min(tileTop + tileHeightInGrid, tileStreamer.gridDims.totalHeight);

                const pages = tileStreamer._calculateIntersectingPages(tileLeft, tileTop, tileRight, tileBottom);

                return {
                  level, x, y,
                  tileBounds: {
                    left: tileLeft.toFixed(1),
                    top: tileTop.toFixed(1),
                    right: tileRight.toFixed(1),
                    bottom: tileBottom.toFixed(1)
                  },
                  intersectingPages: pages.sort((a, b) => a - b),
                  pageCount: pages.length
                };
              },
              // Diagnose L0 tile incompleteness
              diagnoseL0Tile: () => {
                if (!tileStreamer || !pageStreamer) return null;

                // Get what pages L0 should contain
                const scale = Math.pow(2, 0 - tileStreamer.maxLevel);
                const tileWidthInGrid = tileStreamer.tileWidth / scale;
                const tileHeightInGrid = tileStreamer.tileHeight / scale;
                const tileLeft = 0;
                const tileTop = 0;
                const tileRight = Math.min(tileWidthInGrid, tileStreamer.gridDims.totalWidth);
                const tileBottom = Math.min(tileHeightInGrid, tileStreamer.gridDims.totalHeight);

                const neededPages = tileStreamer._calculateIntersectingPages(tileLeft, tileTop, tileRight, tileBottom);
                const resolution = tileStreamer._getResolutionForLevel(0); // Should be 'low' for L0

                // Check which pages are actually cached
                const cachedPages = [];
                const missingPages = [];
                neededPages.forEach(pageNum => {
                  const hasCached = pageStreamer.hasPage(pageNum, resolution);
                  if (hasCached) {
                    cachedPages.push(pageNum);
                  } else {
                    missingPages.push(pageNum);
                  }
                });

                // Get on-demand tracking data
                const tracking = window.__L0OnDemandTracking || { triggered: [], completed: [], failed: [] };
                const skipped = window.__L0OnDemandSkipped || { enabled: true, skipped: [] };

                // Get draw page debug data
                const drawDebug = window.__drawPageDebug || { failures: [], successes: [] };
                const l0Failures = drawDebug.failures.filter(f => f.level === 0);
                const l0Successes = drawDebug.successes || [];

                // Group failures by reason
                const failuresByReason = {};
                l0Failures.forEach(f => {
                  if (!failuresByReason[f.reason]) failuresByReason[f.reason] = [];
                  failuresByReason[f.reason].push(f);
                });

                return {
                  neededPages: neededPages.sort((a, b) => a - b),
                  neededCount: neededPages.length,
                  resolution: resolution,
                  cached: cachedPages.sort((a, b) => a - b),
                  cachedCount: cachedPages.length,
                  missing: missingPages.sort((a, b) => a - b),
                  missingCount: missingPages.length,
                  completeness: ((cachedPages.length / neededPages.length) * 100).toFixed(1) + '%',
                  lowResCacheSize: pageStreamer.lowResPageCache.size,
                  highResCacheSize: pageStreamer.highResPageCache.size,
                  onDemandStats: tileStreamer.stats,
                  onDemandTracking: {
                    enabled: skipped.enabled,
                    triggered: tracking.triggered.map(t => t.pageNum).sort((a, b) => a - b),
                    triggeredCount: tracking.triggered.length,
                    completed: tracking.completed.map(t => t.pageNum).sort((a, b) => a - b),
                    completedCount: tracking.completed.length,
                    failed: tracking.failed.map(t => ({page: t.pageNum, error: t.error})),
                    failedCount: tracking.failed.length,
                    skippedCount: skipped.skipped.length,
                    skippedByReason: {
                      disabled: skipped.skipped.filter(s => s.reason === 'disabled').length,
                      alreadyRendering: skipped.skipped.filter(s => s.reason === 'already_rendering').length
                    },
                    skippedPages: [...new Set(skipped.skipped.map(s => s.pageNum))].sort((a, b) => a - b)
                  },
                  drawingDebug: {
                    totalFailures: l0Failures.length,
                    totalSuccesses: l0Successes.length,
                    failuresByReason: Object.keys(failuresByReason).map(reason => ({
                      reason,
                      count: failuresByReason[reason].length,
                      examples: failuresByReason[reason].slice(0, 3)
                    })),
                    successfulPages: [...new Set(l0Successes.map(s => s.pageNum))].sort((a, b) => a - b)
                  },
                  tileGeneration: {
                    generateTileCalls: (window.__L0TileGeneration?.calls || []).length,
                    renderTileCalls: (window.__L0TileGeneration?.renders || []).length,
                    delayedCalls: window.__L0TileGeneration?.delayed || 0,
                    callTimeline: window.__L0TileGeneration?.calls || [],
                    renderTimeline: window.__L0TileGeneration?.renders || []
                  },
                  parallelRendering: window.__parallelRenderStats || null
                };
              }
            };

            // DEBUG button moved to help panel (v1.9.1)
          };

          const initializeViewerWithNavigator = (numPages, pageWidth, pageHeight) => {
            return initializeViewer(numPages, pageWidth, pageHeight, true);
          };

          /**
           * Drag-and-drop handlers
           */
          const handleDragOver = (e) => {
            e.preventDefault();
            e.stopPropagation();
          };

          const handleDrop = async (e) => {
            e.preventDefault();
            e.stopPropagation();

            if (isLoading) return;

            const files = e.dataTransfer.files;
            if (files.length > 0) {
              const file = files[0];
              if (file.type === 'application/pdf') {
                await handleFileUpload({ target: { files: [file] } });
              } else {
                alert('Please drop a PDF file');
              }
            }
          };

          /**
           * Download current PDF to device filesystem
           * Handles different browsers: Chrome (File System API), iOS (Web Share), others (download link)
           */
          const handleDownload = async () => {
            if (!pdfDocRef.current || !currentFilename) {
              alert('No PDF loaded');
              return;
            }

            try {
              const pdf = pdfDocRef.current;
              const data = await pdf.getData();

              // Extract filename from URL or use default
              let filename = currentFilename.replace(/^https?:\/\/.*\//, '') || 'document.pdf';

              // Ensure .pdf extension
              if (!filename.toLowerCase().endsWith('.pdf')) {
                filename += '.pdf';
              }

              // Detect iOS/iPadOS
              // Note: iPadOS 13+ reports as macOS in desktop mode, but still supports touch/share
              const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
              const isIPadOS = (navigator.maxTouchPoints && navigator.maxTouchPoints > 2 && /MacIntel/.test(navigator.platform));
              const isMobileSafari = isIOS || isIPadOS;

              // Try modern File System Access API first (Chrome, Edge, Opera - but not iOS/iPadOS)
              if (!isMobileSafari && window.showSaveFilePicker) {
                try {
                  const handle = await window.showSaveFilePicker({
                    suggestedName: filename,
                    types: [{
                      description: 'PDF Document',
                      accept: { 'application/pdf': ['.pdf'] }
                    }]
                  });

                  const writable = await handle.createWritable();
                  await writable.write(data);
                  await writable.close();

                  console.log(`PDF saved as: ${filename}`);
                  return;
                } catch (error) {
                  if (error.name === 'AbortError') {
                    console.log('Save cancelled by user');
                    return;
                  }
                  // Fall through to next method
                  console.log('File System Access API failed, trying next method');
                }
              }

              // iOS/iPadOS Safari: Use Web Share API (works for saving files on iOS/iPadOS)
              if (isMobileSafari && navigator.share && navigator.canShare) {
                try {
                  const file = new File([data], filename, { type: 'application/pdf' });

                  if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                      files: [file],
                      title: 'Download PDF',
                      text: filename
                    });
                    console.log('PDF shared successfully on iOS');
                    return;
                  }
                } catch (error) {
                  if (error.name === 'AbortError') {
                    console.log('Share cancelled by user');
                    return;
                  }
                  console.log('Web Share API failed, trying fallback');
                }
              }

              // Fallback for desktop Firefox, Safari, and older browsers
              // Create blob with octet-stream to force download behavior
              const blob = new Blob([data], { type: 'application/octet-stream' });

              // Create object URL
              const url = URL.createObjectURL(blob);

              // Create and configure download link
              const a = document.createElement('a');
              a.href = url;
              a.download = filename; // Set filename
              a.target = '_blank'; // Prevent navigation in current tab

              // Important: Must append to DOM for Firefox
              document.body.appendChild(a);

              // Trigger download
              a.click();

              // Cleanup after download starts
              setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
              }, 250);

              console.log(`Download triggered for: ${filename}`);
            } catch (error) {
              console.error('Error downloading PDF:', error);
              alert('Failed to download PDF');
            }
          };

          return (
            <div className="w-full h-full bg-gray-900 flex flex-col">
              {/* Header */}
              <div className="bg-gray-800 border-b border-gray-700 p-2 md:p-3">
                <div className="flex items-center gap-2 max-w-7xl mx-auto">
                  {/* Help Button */}
                  <button
                    onClick={() => setShowHelp(!showHelp)}
                    className="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white rounded cursor-pointer transition-colors text-lg font-bold"
                    title="Help & About"
                  >
                    ?
                  </button>

                  {/* URL Input */}
                  <input
                    type="text"
                    value={urlInput}
                    onChange={(e) => setUrlInput(e.target.value)}
                    onKeyPress={handleUrlKeyPress}
                    onFocus={(e) => e.target.select()}
                    placeholder="Enter PDF URL or choose local file..."
                    className="flex-1 px-2 md:px-3 py-2 bg-gray-700 text-white border border-gray-600 rounded focus:outline-none focus:border-blue-500 text-sm"
                    disabled={isLoading}
                  />
                  <button
                    onClick={handleUrlLoad}
                    disabled={isLoading}
                    className="px-3 md:px-4 py-2 bg-green-600 hover:bg-green-700 active:bg-green-800 text-white rounded cursor-pointer transition-colors disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap text-sm"
                  >
                    <span className="md:hidden">URL</span>
                    <span className="hidden md:inline">Open URL</span>
                  </button>

                  {/* File Upload */}
                  <label className="px-3 md:px-4 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded cursor-pointer transition-colors text-center text-sm whitespace-nowrap">
                    <span className="md:hidden">PDF</span>
                    <span className="hidden md:inline">Local PDF</span>
                    <input
                      type="file"
                      accept="application/pdf"
                      onChange={handleFileUpload}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>

              {/* Viewer Area */}
              <div
                className="flex-1 relative"
                onDragOver={handleDragOver}
                onDrop={handleDrop}

                      {/* Statistics */}
                      <div className="space-y-1">
                        <div><span className="text-gray-400">Page Cache:</span> <span className="text-white">{stats.pages.low} low-res, {stats.pages.high} high-res</span></div>
                        <div><span className="text-gray-400">Tile Cache:</span> <span className="text-white">{stats.tiles} tiles</span></div>
                        <div className="pt-1 border-t border-gray-700">
                          <span className="text-gray-400">Tiles Rendered:</span>
                          <div className="pl-2 text-white text-xs">Full: {stats.tileRenderStats.full}, Fallback: {stats.tileRenderStats.fallback} ({stats.tileRenderStats.fallbackPercentage}%)</div>
                        </div>
                        <div><span className="text-gray-400">Cache Misses:</span> <span className="text-white">{stats.cacheMisses}</span></div>
                        {onDemandStats && (
                          <div className="pt-1 border-t border-gray-700">
                            <span className="text-gray-400">On-Demand:</span>
                            <div className="pl-2 text-white text-xs">Triggered: {onDemandStats.triggered}, Completed: {onDemandStats.completed}, Failed: {onDemandStats.failed}</div>
                          </div>
                        )}
                        {parallelStats && (
                          <div className="pt-1 border-t border-gray-700">
                            <span className="text-gray-400">Parallel:</span>
                            <div className="pl-2 text-white text-xs">Rendered: {parallelStats.rendered}/{parallelStats.totalPages}, Rate: {((parallelStats.rendered / ((Date.now() - parallelStats.startTime) / 1000)) || 0).toFixed(1)} pg/s</div>
                          </div>
                        )}
                        <div className="pt-1 border-t border-gray-700">
                          <span className="text-gray-400">Settings:</span>
                          <div className="pl-2 text-white text-xs">
                            Minimap: L{stats.minimapMaxLevel}, Render: {stats.renderScale}x, LowRes: {stats.lowResScale}x
                          </div>
                          <div className="pl-2 text-white text-xs">iOS: {isIOSSafari ? 'YES' : 'NO'}, Debug: {CONFIG.DEBUG_MODE ? 'ON' : 'OFF'}</div>
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>

            </div>
          );
        };

        ReactDOM.render(<PDFGridViewer />, document.getElementById('root'));
    </script>
</body>
</html>
